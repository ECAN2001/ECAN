    </div>
  </div>`;
}
function listaTareas(filtro){
  filtro = filtro || {};
  const filas = [];
  const gradosVisibles = misGrados(currentUser);
  DB.estudiantes.forEach(est=>{
    if(gradosVisibles.indexOf(est.grado) < 0) return;
    if(filtro.grado && est.grado !== filtro.grado) return;
    if(filtro.estudiante && est.id !== filtro.estudiante) return;
    asignaturasDeGrado(est.grado).forEach(asig=>{
      if(filtro.asigId && asig.id !== filtro.asigId) return;
      if(!isAdmin(currentUser) && !esOrientador(currentUser, est.grado) &&
         !currentUser.asignaciones.some(a=>a.grado===est.grado && a.asignaturaId===asig.id)) return;
      for(let p=1; p<=4; p++){
        if(filtro.periodo && Number(filtro.periodo) !== p) continue;
        const acts = getActividades(est.grado, asig.id, p);   // los nombres cambian por período
        const entradas = acts.map(a=>({id:a.id, nombre:a.nombre, comp:'act:'+a.id, tipo:'Actividad'}))
          .concat(rubrosTarea().map(r=>({id:r.key, nombre:getNombreRubro(est.grado, asig.id, r.key, p), comp:r.key, tipo:r.nombre})));
        entradas.forEach(ent=>{
          const estado = getEstado(est.id, asig.id, p, ent.id);
          const fecha = getFechaTarea(est.grado, asig.id, ent.id, p);
          const nota = getComp(est.id, asig.id, p, ent.comp);
          const obs = getObs(est.id, asig.id, p, ent.comp);
          if(!estado && !fecha && nota===undefined && !obs) return;  // aún sin usar
          if(filtro.estado && estado !== filtro.estado) return;
          if(filtro.semana === 'actual'){ if(lunesDe(fecha) !== semanaEnCurso()) return; }
          else if(filtro.semana){ if(lunesDe(fecha) !== filtro.semana) return; }
          if(filtro.dia && fecha !== filtro.dia) return;
          filas.push({fecha, grado:est.grado, materia:asig.nombre, asigId:asig.id,
            estudiante:est.nombre, estId:est.id, tarea:ent.nombre, tipo:ent.tipo, periodo:p,
            estado, nota, obs});
        });
      }
    });
  });
  filas.sort((a,b)=>{
    if(a.fecha && b.fecha && a.fecha !== b.fecha) return b.fecha.localeCompare(a.fecha);
    if(a.fecha && !b.fecha) return -1;
    if(!a.fecha && b.fecha) return 1;
    return a.estudiante.localeCompare(b.estudiante,'es');
  });
  return filas;
}
/* Semana de una fecha: se toma el lunes como inicio */
function lunesDe(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d.getTime())) return '';
  const dia = (d.getDay() + 6) % 7;          // lunes = 0
  d.setDate(d.getDate() - dia);
  return d.toISOString().slice(0,10);
}
function semanaEnCurso(){ return lunesDe(new Date().toISOString().slice(0,10)); }
function rotuloSemana(lunes){
  if(!lunes) return 'Sin fecha';
  const d = new Date(lunes + 'T12:00:00');
  const fin = new Date(d); fin.setDate(fin.getDate() + 4);
  const f = x => x.getDate() + '/' + (x.getMonth()+1);
  return 'Semana del ' + f(d) + ' al ' + f(fin);
}
function fechaCorta(iso){
  if(!iso) return 'Sin fecha';
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('es', {weekday:'short', day:'2-digit', month:'2-digit'});
}

/* Alertas: 2 pendientes = amarilla, 3 = naranja, 4 o más = roja */
/* 2 pendientes: amarilla. 3 pendientes: naranja solo si son de tres materias
   distintas; si están concentradas en menos materias, es roja. 4 o más: roja. */
function nivelAlerta(cantidad, materiasDistintas){
  if(cantidad >= 4) return {nivel:'roja', nombre:'Roja', clase:'alerta-roja'};
  if(cantidad === 3){
    return (materiasDistintas >= 3)
      ? {nivel:'naranja', nombre:'Naranja', clase:'alerta-naranja'}
      : {nivel:'roja', nombre:'Roja', clase:'alerta-roja'};
  }
  if(cantidad === 2) return {nivel:'amarilla', nombre:'Amarilla', clase:'alerta-amarilla'};
  return null;
}
function calcularAlertas(filtro){
  const pendientes = listaTareas(filtro).filter(f=>f.estado === 'no');
  const porEstudiante = {};
  pendientes.forEach(f=>{
    if(!porEstudiante[f.estId]) porEstudiante[f.estId] = {estudiante:f.estudiante, grado:f.grado, filas:[], materias:{}};
    porEstudiante[f.estId].filas.push(f);
    porEstudiante[f.estId].materias[f.materia] = true;
  });
  const orden = {roja:0, naranja:1, amarilla:2};
  return Object.keys(porEstudiante).map(id=>{
    const g = porEstudiante[id];
    const al = nivelAlerta(g.filas.length, Object.keys(g.materias).length);
    return al ? Object.assign({}, g, {alerta:al, cantidad:g.filas.length,
      materias:Object.keys(g.materias)}) : null;
  }).filter(Boolean).sort((a,b)=> orden[a.alerta.nivel]-orden[b.alerta.nivel] ||
      a.estudiante.localeCompare(b.estudiante,'es'));
}

/* ============================= CALCULOS ============================= */
function getComp(estId, asigId, periodo, comp){
  return DB.calificaciones[estId+'|'+asigId+'|'+periodo+'|'+comp];
}
function setComp(estId, asigId, periodo, comp, value){
  const key = estId+'|'+asigId+'|'+periodo+'|'+comp;
  if(value===null || value===undefined || value===''){ delete DB.calificaciones[key]; }
  else { DB.calificaciones[key] = Number(value); }
}
/* Nota efectiva de un rubro. Si tiene recuperación, vale la más alta de las dos. */
function claveRecuperacion(key){ return key + '_rec'; }
function notaRubro(estId, asigId, periodo, rubro){
  const base = getComp(estId, asigId, periodo, rubro.key);
  if(!rubro.conRecuperacion) return (base===undefined||base===null||isNaN(base)) ? null : base;
  const rec = getComp(estId, asigId, periodo, claveRecuperacion(rubro.key));
  const vals = [base, rec].filter(v=>v!==undefined && v!==null && !isNaN(v));
  return vals.length ? Math.max.apply(null, vals) : null;
}
/* Calcula la nota del período con lo que ya esté cargado.
   Devuelve {valor, completo, avance}: el promedio se muestra desde la primera nota,
   repartiendo proporcionalmente entre los rubros ya calificados. */
function periodInfo(estId, asigId, periodo, grado){
  const acts = getActividades(grado, asigId, periodo);
  let suma = 0, pesoUsado = 0, pesoTotal = 0, completo = true;

  const pesoAct = pesoDe('actividades');
  pesoTotal += pesoAct;
  if(acts.length > 0){
    const entradas = acts.map(a=>getComp(estId, asigId, periodo, 'act:'+a.id));
    const hayAlguna = entradas.some(v=>v!==undefined && v!==null && !isNaN(v));
    if(hayAlguna){
      // Las casillas sin llenar cuentan como 0 dentro del promedio de Actividades.
      const sumaAct = entradas.reduce((s,v)=>s + ((v!==undefined && v!==null && !isNaN(v)) ? v : 0), 0);
      const actAvg = sumaAct / acts.length;
      suma += actAvg * pesoAct;
      pesoUsado += pesoAct;
    }
    if(!hayAlguna || entradas.some(v=>v===undefined||v===null||isNaN(v))) completo = false;
  }else{
    completo = false;
  }

  for(const r of rubrosActivos()){
    const p = pesoDe(r.key);
    pesoTotal += p;
    const v = notaRubro(estId, asigId, periodo, r);
    if(v === null){ completo = false; continue; }
    suma += v * p;
    pesoUsado += p;
  }

  if(pesoUsado === 0) return {valor:null, completo:false, avance:0};
  return {
    // Ya empezó a calificarse este período: lo que todavía no se ha llenado
    // cuenta como 0 sobre el 100% del período, no se excluye del cálculo.
    valor: pesoTotal>0 ? suma / pesoTotal : null,
    completo: completo,
    avance: pesoTotal>0 ? pesoUsado/pesoTotal : 0
  };
}
/* Compatibilidad: la nota del período tal como se muestra */
function periodScore(estId, asigId, periodo, grado){
  return periodInfo(estId, asigId, periodo, grado).valor;
}
function periodScoreCompleto(estId, asigId, periodo, grado){
  const i = periodInfo(estId, asigId, periodo, grado);
  return i.completo ? i.valor : null;
}
/* Promedio de la asignatura con los períodos que ya tengan nota */
function subjectInfo(estId, asigId, grado){
  const infos = [1,2,3,4].map(p=>periodInfo(estId, asigId, p, grado));
  const conNota = infos.filter(i=>i.valor !== null);
  if(conNota.length === 0) return {valor:null, completo:false, periodos:0};
  return {
    valor: conNota.reduce((s,i)=>s+i.valor,0)/conNota.length,
    completo: conNota.length === 4 && conNota.every(i=>i.completo),
    periodos: conNota.length
  };
}
function subjectFinal(estId, asigId, grado){
  return subjectInfo(estId, asigId, grado).valor;
}
function studentInfo(estId, grado){
  const asigs = asignaturasDeGrado(grado);
  const infos = asigs.map(a=>subjectInfo(estId, a.id, grado)).filter(i=>i.valor!==null);
  if(infos.length===0) return {valor:null, completo:false};
  return {
    valor: infos.reduce((s,i)=>s+i.valor,0)/infos.length,
    completo: infos.length === asigs.length && infos.every(i=>i.completo)
  };
}
function studentFinalAverage(estId, grado){
  return studentInfo(estId, grado).valor;
}

/* Si hay un Apps Script configurado pero por algún motivo transitorio la
   conexión no se estableció (por ejemplo, justo al abrir la página), se
   reintenta antes de decidir cómo entrar — así nunca se cae por error al
   camino de "base completa" solo por mala suerte de tiempos. */
async function asegurarMotorNube(){
  if(motor !== 'nube' && getSyncUrl()){
    try{ await detectarMotor(); }catch(e){}
  }
}
async function entrarComoDocenteLogin(){
  await asegurarMotorNube();
  if(!baseCompletaCargada) await loadAll();
  const crudo = ((document.getElementById('doc_usuario_input')||{}).value || '').trim();
  const usuario = normalizarUsuario(crudo);
  const clave = (document.getElementById('doc_clave_input')||{}).value || '';
  // Acepta tanto el usuario generado (ej. sandra.umanzor) como el nombre completo
  // tal como aparece registrado (ej. "Lic. Sandra Umanzor"), por si la persona
  // está acostumbrada a escribir su nombre.
  let u = DB.docentes.find(t=>t.usuario === usuario && !esPropietario(t));
  if(!u && crudo){
    const crudoNorm = crudo.toLowerCase();
    u = DB.docentes.find(t=>!esPropietario(t) && String(t.nombre||'').trim().toLowerCase() === crudoNorm);
  }
  const claveOk = u && (tieneClave(u) ? hashClave(clave) === u.clave : true);
  if(!crudo || !u || !claveOk){
    viewState.errorLoginDocente = 'Usuario o contraseña incorrectos.';
    render();
    setTimeout(()=>{ const c = document.getElementById('doc_clave_input'); if(c) c.focus(); }, 60);
    return;
  }
  viewState.errorLoginDocente = '';
  entrarComo(u);
}
async function entrarComoEstudianteLogin(){
  const usuario = normalizarUsuario((document.getElementById('est_usuario_input')||{}).value || '');
  const clave = (document.getElementById('est_clave_input')||{}).value || '';
  if(!usuario || !clave){
    viewState.errorLoginEstudiante = 'Usuario o contraseña incorrectos.';
    render();
    return;
  }
  await asegurarMotorNube();
  const claveHash = hashClave(clave);
  if(motor === 'nube'){
    // El servidor filtra: a este navegador solo llegan los datos de este estudiante.
    viewState.errorLoginEstudiante = '';
    showToast('Ingresando…');
    try{
      const datos = await nubeLeerEstudiante(usuario, claveHash);
      if(!datos || !datos.estudiante){
        viewState.errorLoginEstudiante = 'Usuario o contraseña incorrectos.';
        render();
        setTimeout(()=>{ const c = document.getElementById('est_clave_input'); if(c) c.focus(); }, 60);
        return;
      }
      adoptarDocEstudiante(datos);
      await entrarComoEstudiante(DB.estudiantes[0], {usuario, claveHash});
    }catch(e){
      console.error(e);
      viewState.errorLoginEstudiante = 'No se pudo conectar con la escuela. Intenta de nuevo.';
      render();
    }
    return;
  }
  // Sin un Apps Script propio conectado no hay forma de filtrar en el servidor;
  // se recurre a la base completa, como en versiones anteriores.
  if(!baseCompletaCargada) await loadAll();
  const est = DB.estudiantes.find(e=>e.usuario === usuario);
  if(!est || hashClave(clave) !== est.clave){
    viewState.errorLoginEstudiante = 'Usuario o contraseña incorrectos.';
    render();
    setTimeout(()=>{ const c = document.getElementById('est_clave_input'); if(c) c.focus(); }, 60);
    return;
  }
  viewState.errorLoginEstudiante = '';
  await entrarComoEstudiante(est);
}

   título en menos de 2 segundos abren el acceso. No aparece en ningún
   listado ni pista visual — quien no conozca el gesto no la encuentra. */
let clicsTitulo = 0, clicsTituloTimer = null;
function tocarTitulo(){

  clearTimeout(clicsTituloTimer);
  clicsTituloTimer = setTimeout(()=>{ clicsTitulo = 0; }, 2000);

let selloVisto = '';
function hoyTexto(){ return new Date().toISOString().slice(0,10); }
/* Huella del mensaje: si Dirección lo cambia, se vuelve a mostrar el mismo día */
/* Mensaje que le corresponde a ESTE usuario: su versión personal si se le
   configuró una, o la general del centro escolar si no. Los estudiantes
   nunca tienen mensaje personal (no aplica: no ven este mensaje en absoluto,
   ver debeMostrarMensaje). */
function saludoDe(u){
  if(u && u.fraseSaludoPersonal) return u.fraseSaludoPersonal;
  return (DB.ajustes && DB.ajustes.fraseSaludo) || '';
}
function mensajeBienvenidaDe(u){
  if(u && u.mensajeBienvenidaPersonal) return u.mensajeBienvenidaPersonal;
  return (DB.ajustes && DB.ajustes.mensajeBienvenida) || '';
}
function huellaMensaje(txt){
  let h = 5381;
  for(let i=0;i<txt.length;i++) h = ((h*33) ^ txt.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
/* El sello incluye al usuario: si en este dispositivo entra alguien que
   todavía no lo ha visto, el mensaje le aparece aunque otro ya lo haya aceptado. */
function selloActual(){
  const txt = mensajeBienvenidaDe(currentUser);
  const quien = currentUser ? currentUser.id : 'nadie';
  return quien + '|' + hoyTexto() + '|' + huellaMensaje(txt);
}
/* Lee el registro de "ya lo vi". Si viene en un formato viejo o dañado,
   se descarta y se empieza de cero en lugar de fallar. */
function leerVistos(){
  try{
    const crudo = window.localStorage.getItem('mensaje_visto');
    if(!crudo) return {};
    const dato = JSON.parse(crudo);
    if(dato && typeof dato === 'object' && !Array.isArray(dato)) return dato;
    window.localStorage.removeItem('mensaje_visto');   // formato anterior: se descarta
    return {};
  }catch(e){
    try{ window.localStorage.removeItem('mensaje_visto'); }catch(e2){}  // valor dañado
    return {};
  }
}
function quienSoy(){ return currentUser ? currentUser.id : 'nadie'; }
function debeMostrarMensaje(){
  if(sesionEstudiante) return false;   // los estudiantes no ven el mensaje de bienvenida
  const txt = mensajeBienvenidaDe(currentUser);
  if(!txt) return false;
  const sello = selloActual();
  if(selloVisto === sello) return false;       // ya se aceptó en esta sesión
  return leerVistos()[quienSoy()] !== sello;   // ya se aceptó hoy en este dispositivo
}
function cerrarMensajeBienvenida(){
  selloVisto = selloActual();
  const vistos = leerVistos();
  vistos[quienSoy()] = selloVisto;
  const hoy = hoyTexto();
  Object.keys(vistos).forEach(k=>{             // se limpian registros de días anteriores
    const partes = String(vistos[k]).split('|');
    if(partes[1] && partes[1] !== hoy) delete vistos[k];
  });
  try{ window.localStorage.setItem('mensaje_visto', JSON.stringify(vistos)); }
  catch(e){ console.error('no se pudo registrar el mensaje visto', e); }
  render();
}
function renderMensajeBienvenida(){
  if(!debeMostrarMensaje()) return '';
  const aj = DB.ajustes || {};
  return `
  <div class="modal-bg" style="align-items:center;">
    <div class="modal" style="max-width:520px; text-align:center;">
      ${aj.logo?`<img src="${aj.logo}" alt="Logo" style="width:64px;height:64px;object-fit:contain;margin:0 auto 14px;display:block;">`:''}
      <h3 class="modal-title" style="text-align:center;">${esc(aj.nombreColegio || 'Centro Escolar')}</h3>
      <p style="font-size:14.5px; line-height:1.7; white-space:pre-wrap; margin:0 0 22px; text-align:left;">${esc(mensajeBienvenidaDe(currentUser))}</p>
      <button class="btn btn-primary" onclick="cerrarMensajeBienvenida()" style="min-width:140px;">Aceptar</button>
    </div>
  </div>`;
}

    case 'soporte': return renderSoporte();
    case 'mensajes': return renderMensajes();
    case 'bitacora': return renderBitacora();
    case 'hojas': return renderHojas();
    case 'personalizar': return renderPersonalizar();
    case 'sincronizacion': return renderSincronizacion();
    default: return '';
  }
}

/* --- Credencial: la misma plantilla e imagen que se descarga desde Estudiantes,
   pero mostrada dentro de la app. Se dibuja después de montar el HTML porque
   necesita cargar la plantilla (async); mientras tanto se ve un mensaje de carga. */
let _credencialEstudianteUrl = null;
function renderCredencialEstudiante(est){
  return `
  <div class="page-head">
    <p class="page-eyebrow">Mi acceso</p>
    <h1 class="page-title">Mi credencial</h1>
    <p class="page-desc">Esta es tu credencial de acceso a la plataforma. Es personal e intransferible.</p>
  </div>
  <div class="card" style="max-width:420px;">
    <div id="credencial_wrap" style="text-align:center;">
      <p class="empty" style="padding:30px 0;">Cargando credencial…</p>
    </div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn btn-primary" onclick="descargarMiCredencial()">Descargar mi credencial</button>
    </div>
  </div>`;
}
async function cargarCredencialEstudianteEnPantalla(){
  const est = estudianteEnPantalla();
  if(!est) return;
  const wrap = document.getElementById('credencial_wrap');
  if(!wrap) return;
  if(!est.usuario || !est.claveTexto){
    wrap.innerHTML = '<p class="empty" style="padding:20px 0;">Todavía no se generó una credencial para este estudiante.</p>';
    return;
  }
  try{
    const img = await cargarPlantillaCredencial();
    const dataUrl = dibujarCredencial(img, est.usuario, est.claveTexto);
    _credencialEstudianteUrl = dataUrl;
    const wrap2 = document.getElementById('credencial_wrap');   // por si el DOM cambió mientras cargaba
    if(wrap2) wrap2.innerHTML = `<img src="${dataUrl}" alt="Credencial" style="max-width:100%; border-radius:10px;">`;
  }catch(e){
    console.error(e);
    if(wrap) wrap.innerHTML = '<p class="empty" style="padding:20px 0;">No se pudo cargar la credencial.</p>';
  }
}
function descargarMiCredencial(){
  const est = estudianteEnPantalla() || currentUser;
  const terminar = (dataUrl)=>{
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = (est.grado + ' - ' + nombresDe(est) + ' ' + apellidosDe(est)).replace(/[\\\/:\*\?"<>\|]/g,' ').trim() + '.png';
    a.click();
  };
  if(_credencialEstudianteUrl){ terminar(_credencialEstudianteUrl); return; }
  cargarPlantillaCredencial().then(img=>{
    const dataUrl = dibujarCredencial(img, est.usuario, est.claveTexto || '—');
    _credencialEstudianteUrl = dataUrl;
    terminar(dataUrl);
  }).catch(()=> showToast('No se pudo generar la credencial.'));
}

function contarAlertasEstudiante(est){
  let n = 0;
  asignaturasDeGrado(est.grado).forEach(asig=>{
    for(let p=1; p<=4; p++){
      const ids = getActividades(est.grado, asig.id, p).map(a=>a.id).concat(rubrosTarea().map(r=>r.key));
      ids.forEach(id=>{ if(getEstado(est.id, asig.id, p, id) === 'no') n++; });
    }
  });
  return n;
}
function renderAlertasEstudiante(est){
  const asigs = asignaturasDeGrado(est.grado);
  const pendientes = [];
  asigs.forEach(asig=>{
    for(let p=1; p<=4; p++){
      const acts = getActividades(est.grado, asig.id, p);
      const entradas = acts.map(a=>({id:a.id, nombre:a.nombre, comp:'act:'+a.id}))
        .concat(rubrosTarea().map(r=>({id:r.key, nombre:getNombreRubro(est.grado, asig.id, r.key, p), comp:r.key})));
      entradas.forEach(ent=>{
        const estado = getEstado(est.id, asig.id, p, ent.id);
        const fecha = getFechaTarea(est.grado, asig.id, ent.id, p);
        if(estado !== 'no') return;
        const nota = getComp(est.id, asig.id, p, ent.comp);
        const obs = getObs(est.id, asig.id, p, ent.comp);
        pendientes.push({fecha, materia:asig.nombre, tarea:ent.nombre, periodo:p, nota, obs});
      });
    }
  });
  const materiasDistintas = new Set(pendientes.map(x=>x.materia)).size;
  const al = nivelAlerta(pendientes.length, materiasDistintas);
  pendientes.sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  return `
  <div class="page-head">
    <p class="page-eyebrow">Evaluación</p>
    <h1 class="page-title">Mis alertas de tareas</h1>
    <p class="page-desc">Tareas y actividades marcadas como "No entregada".</p>
  </div>
  <div class="card">
    <p class="card-title">Nivel de alerta
      ${al?`<span class="pill ${al.clase}">${esc(al.nombre)}</span>`:`<span class="pill pill-muted">Sin alerta</span>`}
      <span class="pill pill-muted">${pendientes.length} pendiente(s)</span></p>
    <div class="table-wrap">
    <table>
      <thead><tr><th style="width:96px;">Fecha</th><th>Materia</th><th>Tarea</th><th style="width:70px;">Nota</th><th>Comentarios</th><th style="width:70px;">Período</th></tr></thead>
      <tbody>
        ${pendientes.length===0?`<tr><td colspan="6" class="empty">No tienes tareas pendientes marcadas.</td></tr>`:''}
        ${pendientes.map(f=>`<tr>
          <td class="mono">${esc(f.fecha||'—')}</td>
          <td>${esc(f.materia)}</td>
          <td style="font-size:12.5px;">${esc(f.tarea)}</td>
          <td class="mono">${f.nota!==undefined?f.nota:'—'}</td>
          <td style="font-size:12.5px;">${f.obs?esc(f.obs):'<span class="empty" style="padding:0;">—</span>'}</td>
          <td class="mono">${f.periodo}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>
  </div>`;
}

  acciones: ['Diálogo con el estudiante','Estuvo un tiempo en la dirección de la escuela',

};
const OPC_F2_DEFAULT = {
  situacion: ['Agresión Verbal','Daño a muebles','Incumplimiento de tareas o trabajos','Agresión Física',
    'Desacato al docente','Conducta constante agresiva','Conducta de riesgo','Uso de lenguaje inapropiado','Otro'],
  antecedentes: ['Llamada de atención verbal','Reincidió 1 o 2 veces en esta situación',
    'Diálogo con el alumno','Compromisos no cumplidos','Otro']
};
/* Garantiza que la lista siempre tenga una opción "otro" al final, aunque
   Dirección la haya borrado sin querer al editar el manual de convivencia
   — así un maestro nunca se queda sin poder registrar una falta que no
   está en la lista. */
function asegurarOtroEnLista(lista, etiqueta){
  lista = (lista||[]).map(s=>String(s).trim()).filter(Boolean);
  const yaTiene = lista.some(s=>s.toLowerCase()===etiqueta.toLowerCase());
  if(!yaTiene) lista.push(etiqueta);
  return lista;
}
/* Devuelve las categorías del manual de convivencia: las que Dirección
   haya personalizado desde Personalizar, o las de fábrica si todavía no
   se ha configurado nada. */
function opcionesF1(){
  const m = DB.ajustes && DB.ajustes.manualF1;
  return {
    situacion: asegurarOtroEnLista(m && m.situacion && m.situacion.length ? m.situacion : OPC_F1_DEFAULT.situacion, 'Otros'),
    antecedentes: asegurarOtroEnLista(m && m.antecedentes && m.antecedentes.length ? m.antecedentes : OPC_F1_DEFAULT.antecedentes, 'Otros'),
    acciones: asegurarOtroEnLista(m && m.acciones && m.acciones.length ? m.acciones : OPC_F1_DEFAULT.acciones, 'Otras')
  };
}
function opcionesF2(){
  const m = DB.ajustes && DB.ajustes.manualF2;
  return {
    situacion: asegurarOtroEnLista(m && m.situacion && m.situacion.length ? m.situacion : OPC_F2_DEFAULT.situacion, 'Otro'),
    antecedentes: asegurarOtroEnLista(m && m.antecedentes && m.antecedentes.length ? m.antecedentes : OPC_F2_DEFAULT.antecedentes, 'Otro')
  };
}

/* Número correlativo del centro escolar: 001, 002… sin importar el docente.
   Una vez asignado, un número queda reservado para siempre, incluso si el
   reporte se borra — nunca se reutiliza. */
function siguienteCorrelativo(){
  const nums = (DB.reportes||[]).map(r=>Number(r.numero)||0);
  const maxExistente = nums.length ? Math.max.apply(null, nums) : 0;
  return Math.max(DB.config.correlativoReportes||0, maxExistente) + 1;
}
function correlativoTexto(n){ return 'N° ' + String(n).padStart(3,'0'); }
/* Deja constancia de quién abrió el reporte */
function registrarVista(id){
  if(!currentUser || sesionEstudiante) return;   // los estudiantes solo tienen su propia base parcial: nunca escriben sobre ella
  commit(doc=>{
    const r = (doc.reportes||[]).find(x=>x.id===id);
    if(!r) return;
    r.vistas = r.vistas || [];
    const ya = r.vistas.find(v=>v.userId===currentUser.id);
    if(ya){ ya.ts = new Date().toISOString(); ya.veces = (ya.veces||1) + 1; }
    else r.vistas.push({userId:currentUser.id, nombre:currentUser.nombre, ts:new Date().toISOString(), veces:1});
  });
}
function agregarSeguimiento(id){
  // Puede comentar quien tenga permiso de editar el panel de Reportes,
  // o quien sea orientador del grado de ESE reporte en particular
  // (aunque no tenga permiso para crear/eliminar reportes en general).
  const rep = (DB.reportes||[]).find(x=>x.id===id);
  const autorizado = rep && (puedeEditarPanel(currentUser, 'reportes') || esOrientador(currentUser, rep.grado)) && !currentUser.soloLectura;
  if(!autorizado){ showToast('No tienes permiso para comentar este reporte.'); return; }
  const campo = document.getElementById('seg_' + id);
  const txt = campo ? campo.value.trim() : '';
  if(!txt){ showToast('Escribe el seguimiento.'); return; }
  commit(doc=>{
    const r = (doc.reportes||[]).find(x=>x.id===id);
    if(!r) return;
    r.seguimientos = r.seguimientos || [];
    r.seguimientos.push({ts:new Date().toISOString(), userId:currentUser.id, nombre:currentUser.nombre, texto:txt});
  });
  registrar('Reporte disciplinario', 'Agregó seguimiento a un reporte');
  showToast('Seguimiento agregado.');
  render();
}

function toggleDescripcionElim(id){

function restaurarReporteEliminado(id){
  if(!puedeEditarPanel(currentUser, 'reportes') || currentUser.soloLectura){
    showToast('No tienes permiso para restaurar reportes.'); return;
  }
  if(!confirm('¿Restaurar este reporte al historial activo?')) return;
  commit(doc=>{
    const i = (doc.reportesEliminados||[]).findIndex(r=>r.id===id);
    if(i<0) return;
    const [reporte] = doc.reportesEliminados.splice(i,1);
    delete reporte.eliminadoTs; delete reporte.eliminadoPor; delete reporte.eliminadoPorId;
    doc.reportes = doc.reportes || [];
    doc.reportes.push(reporte);
  });
  registrar('Reporte disciplinario', 'Restauró un reporte eliminado');
  showToast('Reporte restaurado.');
  render();
}

async function guardarReporte(){
  // Evita reportes duplicados si se hace clic varias veces seguidas
  // (por ejemplo, con internet lento y la persona pensando que no funcionó).
  if(guardarReporte._enCurso) return;
  guardarReporte._enCurso = true;
  setTimeout(()=>{ guardarReporte._enCurso = false; }, 1500);
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const estId = val('rep_est') || getPref('repEst','');
  const est = DB.estudiantes.find(e=>e.id===estId);
  if(!est){ showToast('Selecciona el estudiante.'); guardarReporte._enCurso = false; return; }
  const desc = val('rep_desc');
  if(!desc){ showToast('Describe lo sucedido.'); guardarReporte._enCurso = false; return; }
  let imagen = null;
  try{ imagen = await imagenDeInput('rep_imagen', 1000); }
  catch(e){ showToast('No se pudo procesar la foto; se guarda el reporte sin ella.'); }
  const nivelReal = getPref('repNivel','leve');
  const marcadas = (prefijo, lista) => lista.filter((t,i)=>{
    const el = document.getElementById(prefijo + i);
    return el && el.checked;
  });
  const opc = nivelReal==='leve' ? opcionesF1() : (nivelReal==='grave' ? opcionesF2() : null);
  const reporte = {
    id: uid('rep'), numero: siguienteCorrelativo(), ts: new Date().toISOString(), nivel: nivelReal,
    vistas: [], seguimientos: [],
    estId: est.id, estudiante: apellidosDe(est) + ', ' + nombresDe(est), grado: est.grado,
    fecha: val('rep_fecha'), lugar: val('rep_lugar'), reincidencias: val('rep_reinc'),
    articuloManual: val('rep_articulo'),
    situaciones: opc ? marcadas('rep_sit_', opc.situacion) : [],
    antecedentes: opc ? marcadas('rep_ant_', opc.antecedentes) : [],
    acciones: nivelReal==='leve' ? marcadas('rep_acc_', opcionesF1().acciones) : [],
    descripcion: desc, medida: val('rep_medida'),
    acuerdosAlumno: val('rep_acu_alumno'), acuerdosPadres: val('rep_acu_padres'),
    imagen: imagen,
    docente: currentUser.nombre, docenteId: currentUser.id
  };
  commit(doc=>{
    doc.reportes = doc.reportes || [];
    doc.reportes.push(reporte);
    doc.config.correlativoReportes = Math.max(doc.config.correlativoReportes||0, reporte.numero);
  });
  registrar('Reporte disciplinario', correlativoTexto(reporte.numero) + ' · ' + (nivelFalta(nivel).noEsFalta?nivelFalta(nivel).nombre.toLowerCase():'falta '+nivelFalta(nivel).nombre.toLowerCase()) + ' — ' + reporte.estudiante);
  setPref('repEst','');
  showToast('Reporte guardado. El formulario quedó en blanco.');
  render();
}
function eliminarReporte(id){
  if(!confirm('¿Eliminar este reporte del historial?')) return;
  commit(doc=>{
    const i = (doc.reportes||[]).findIndex(r=>r.id===id);
    if(i>=0){
      const [reporte] = doc.reportes.splice(i,1);
      doc.reportesEliminados = doc.reportesEliminados || [];
      doc.reportesEliminados.push({
        ...reporte,
        eliminadoTs: new Date().toISOString(),
        eliminadoPor: currentUser.nombre,
        eliminadoPorId: currentUser.id
      });
      if(doc.reportesEliminados.length > 500) doc.reportesEliminados = doc.reportesEliminados.slice(-500);
    }
  });
  registrar('Reporte disciplinario', 'Eliminó un reporte');
  render();
}

/* Día de la semana de una fecha: 1 = lunes … 5 = viernes */
function diaSemanaDe(iso){
  if(!iso) return 0;
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d.getTime())) return 0;
  const n = d.getDay();
  return (n >= 1 && n <= 5) ? n : 0;
}
function marcaRad(activo){ return activo ? '<span class="rad on"></span>' : '<span class="rad"></span>'; }
function lineasRep(texto, n, q){
  const t = q(texto||'');
  return `<div class="lineas">${t ? '<div class="txt">'+t+'</div>' : ''}${Array.from({length:n}).map(()=>'<div class="ln"></div>').join('')}</div>`;
}
/* Arial 14 en descripción y acuerdos; si el texto es largo, baja lo justo
   para que el reporte siga cabiendo en una sola página. */
function ptTexto(txt, base){
  const n = String(txt||'').length;
  if(n <= 220) return base;
  if(n <= 420) return base - 2;
  if(n <= 700) return base - 4;
  if(n <= 1000) return base - 6;
  return base - 7;
}

/* Arma un reporte con lo que hay en el formulario, sin guardarlo */
function reporteDelFormulario(){
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const estId = val('rep_est') || getPref('repEst','');
  const est = DB.estudiantes.find(e=>e.id===estId);
  const nivel = getPref('repNivel','leve');
  const opc = nivel==='leve' ? opcionesF1() : (nivel==='grave' ? opcionesF2() : null);
  const marcadas = (prefijo, lista) => lista.filter((t,i)=>{
    const el = document.getElementById(prefijo + i);
    return el && el.checked;
  });
  return {
    id:'previo', ts:new Date().toISOString(), nivel: nivel,
    estId: est?est.id:'', estudiante: est ? (apellidosDe(est) + ', ' + nombresDe(est)) : '',
    grado: est?est.grado:'', fecha: val('rep_fecha'), lugar: val('rep_lugar'),
    reincidencias: val('rep_reinc'),
    situaciones: opc ? marcadas('rep_sit_', opc.situacion) : [],
    antecedentes: opc ? marcadas('rep_ant_', opc.antecedentes) : [],
    acciones: nivel==='leve' ? marcadas('rep_acc_', opcionesF1().acciones) : [],
    descripcion: val('rep_desc'), medida: val('rep_medida'),
    acuerdosAlumno: val('rep_acu_alumno'), acuerdosPadres: val('rep_acu_padres'),
    docente: currentUser.nombre, docenteId: currentUser.id
  };
}
function verReporteAntes(){

function descargarReportes(){
  const gradoF = getPref('repGrado',''), estF = getPref('repEst','');
  const tipoF = getPref('repTipoFalta',''), semanaF = getPref('repSemana','');
  let lista = reportesVisibles(currentUser).slice().sort((a,b)=>b.ts.localeCompare(a.ts));

  if(estF) lista = lista.filter(r=>r.estId===estF);

/* ============================= AVERÍAS Y SOLICITUDES ============================= */
const ESTADOS_AVERIA = [
  {id:'pendiente', nombre:'Pendiente',  pill:'pill-rojo'},
  {id:'proceso',   nombre:'En proceso', pill:'pill-gold'},
  {id:'resuelto',  nombre:'Resuelto',   pill:'pill-primary'}
];
const TIPOS_AVERIA = [
  {id:'averia',    nombre:'Avería'},
  {id:'solicitud', nombre:'Solicitud de material'}
];
function estadoAveria(id){ return ESTADOS_AVERIA.find(e=>e.id===id) || ESTADOS_AVERIA[0]; }
function tipoAveria(id){ return TIPOS_AVERIA.find(t=>t.id===id) || TIPOS_AVERIA[0]; }
/* Cada quien ve lo que reportó; administración ve todo. */
function averiasVisibles(u){
  u = u || currentUser;
  const todas = (DB.averias || []);
  if(isAdmin(u)) return todas;
  return todas.filter(a => a.userId === u.id);
}
/* Cuántas averías/solicitudes visibles para este usuario siguen sin resolver */
function contarAveriasPendientes(u){
  return averiasVisibles(u).filter(a=>a.estado!=='resuelto').length;
}
function siguienteAveria(){
  const n = (DB.averias||[]).map(a=>Number(a.numero)||0);
  return (n.length ? Math.max.apply(null, n) : 0) + 1;
}
/* Sin resolver primero (del más antiguo al más nuevo); resueltos al final. */
function ordenarAverias(lista){
  return lista.slice().sort((a,b)=>{
    const aRes = a.estado === 'resuelto', bRes = b.estado === 'resuelto';
    if(aRes !== bRes) return aRes ? 1 : -1;
    return (a.ts||'').localeCompare(b.ts||'');
  });
}

async function guardarAveria(tipo){
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const titulo = val('av_titulo');
  if(!titulo){ showToast(tipo==='solicitud' ? 'Escribe qué necesitas.' : 'Escribe el asunto.'); return; }
  let imagen = null;
  try{ imagen = await imagenDeInput('av_imagen', 1000); }
  catch(e){ showToast('No se pudo procesar la imagen; se envía sin foto.'); }
  const nueva = {
    id: uid('av'), numero: siguienteAveria(), ts: new Date().toISOString(),
    userId: currentUser.id, nombre: currentUser.nombre, tipo: tipo || 'averia',
    titulo: titulo, lugar: val('av_lugar'), descripcion: val('av_desc'),
    urgencia: val('av_urg') || 'normal', imagen: imagen,
    estado: 'pendiente', vistas: [], notas: []
  };
  commit(doc=>{ doc.averias = doc.averias || []; doc.averias.push(nueva); });
  registrar('Avería o solicitud', 'N° ' + String(nueva.numero).padStart(3,'0') + ' · ' + titulo);
  showToast(tipo==='solicitud' ? 'Solicitud enviada.' : 'Reporte enviado.');
  setPref('avVista','lista');
}
function abrirAveria(id){
  viewState.avAbierta = (viewState.avAbierta === id) ? null : id;
  if(viewState.avAbierta){
    commit(doc=>{
      const a = (doc.averias||[]).find(x=>x.id===id);
      if(!a) return;
      a.vistas = a.vistas || [];
      const ya = a.vistas.find(v=>v.userId===currentUser.id);
      if(ya) ya.ts = new Date().toISOString();
      else a.vistas.push({userId:currentUser.id, nombre:currentUser.nombre, ts:new Date().toISOString()});
    });
  }
  render();
}
/* Puede eliminarla quien la reportó, o cualquier usuario de acceso total
   (Dirección, administradores, propietaria). */
function eliminarAveria(id){
  const a = (DB.averias||[]).find(x=>x.id===id);
  if(!a) return;
  const puede = currentUser && (a.userId === currentUser.id || isAdmin(currentUser));
  if(!puede){ showToast('No tienes permiso para eliminar este reporte.'); return; }
  if(!confirm('¿Eliminar este reporte? Esta acción no se puede deshacer.')) return;
  commit(doc=>{
    const i = (doc.averias||[]).findIndex(x=>x.id===id);
    if(i>=0) doc.averias.splice(i,1);
  });
  if(viewState.avAbierta === id) viewState.avAbierta = null;
  registrar('Avería o solicitud', 'Eliminó el reporte N° ' + String(a.numero||'').padStart(3,'0'));
  showToast('Reporte eliminado.');
  render();
}
function cambiarEstadoAveria(id, estado){
  commit(doc=>{
    const a = (doc.averias||[]).find(x=>x.id===id);
    if(a) a.estado = estado;
  });
  registrar('Avería o solicitud', 'Cambió el estado a ' + estadoAveria(estado).nombre);
  showToast('Estado actualizado.');
  render();
}
async function agregarNotaAveria(id, textoFijo){
  const campo = document.getElementById('avnota_' + id);
  const txt = textoFijo || (campo ? campo.value.trim() : '');
  if(!txt){ showToast('Escribe la respuesta.'); return; }
  let imagen = null;
  if(!textoFijo){
    try{ imagen = await imagenDeInput('avnotaimg_' + id, 1000); }
    catch(e){ showToast('No se pudo procesar la imagen; se envía sin foto.'); }
  }
  commit(doc=>{
    const a = (doc.averias||[]).find(x=>x.id===id);
    if(!a) return;
    a.notas = a.notas || [];
    a.notas.push({ts:new Date().toISOString(), userId:currentUser.id, nombre:currentUser.nombre, texto:txt, imagen:imagen});
  });
  render();
}

/* ============================= SOPORTE DE LA PLATAFORMA =============================
   Buzón para reportar problemas del propio sistema (no del edificio, eso es
   Averías). Pueden escribir docentes Y estudiantes; pero solo lo ve la
   propietaria y los usuarios de acceso total — cada quien más solo ve lo
   que él mismo envió. */
function soporteVisible(u){
  u = u || currentUser;
  const todo = (DB.soporte || []);
  if(isAdmin(u)) return todo;
  return todo.filter(s => s.userId === u.id);
}
/* Cuántos reportes de soporte visibles para este usuario siguen sin resolver */
function contarSoportePendientes(u){
  return soporteVisible(u).filter(s=>s.estado!=='resuelto').length;
}
function siguienteSoporte(){
  const n = (DB.soporte||[]).map(s=>Number(s.numero)||0);
  return (n.length ? Math.max.apply(null, n) : 0) + 1;
}
function ordenarSoporte(lista){
  return lista.slice().sort((a,b)=>{
    const aRes = a.estado === 'resuelto', bRes = b.estado === 'resuelto';
    if(aRes !== bRes) return aRes ? 1 : -1;
    return (a.ts||'').localeCompare(b.ts||'');
  });
}

async function guardarSoporte(){
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const titulo = val('sop_titulo');
  if(!titulo){ showToast('Escribe el asunto.'); return; }
  let imagen = null;
  try{ imagen = await imagenDeInput('sop_imagen', 1000); }
  catch(e){ showToast('No se pudo procesar la imagen; se envía sin foto.'); }
  const nuevo = {
    id: uid('sop'), numero: siguienteSoporte(), ts: new Date().toISOString(),
    userId: currentUser.id, nombre: currentUser.nombre, origen: 'docente',
    titulo: titulo, descripcion: val('sop_desc'), imagen: imagen,
    estado: 'pendiente', vistas: [], notas: []
  };
  commit(doc=>{ doc.soporte = doc.soporte || []; doc.soporte.push(nuevo); });
  registrar('Soporte de la plataforma', 'N° ' + String(nuevo.numero).padStart(3,'0') + ' · ' + titulo);
  showToast('Reporte enviado.');
  setPref('sopVista','lista');
}
function abrirSoporte(id){
  viewState.sopAbierto = (viewState.sopAbierto === id) ? null : id;
  if(viewState.sopAbierto){
    commit(doc=>{
      const s = (doc.soporte||[]).find(x=>x.id===id);
      if(!s) return;
      s.vistas = s.vistas || [];
      const ya = s.vistas.find(v=>v.userId===currentUser.id);
      if(ya) ya.ts = new Date().toISOString();
      else s.vistas.push({userId:currentUser.id, nombre:currentUser.nombre, ts:new Date().toISOString()});
    });
  }
  render();
}
function cambiarEstadoSoporte(id, estado){
  commit(doc=>{
    const s = (doc.soporte||[]).find(x=>x.id===id);
    if(s) s.estado = estado;
  });
  registrar('Soporte de la plataforma', 'Cambió el estado a ' + estadoAveria(estado).nombre);
  showToast('Estado actualizado.');
  render();
}
async function agregarNotaSoporte(id, textoFijo){
  const campo = document.getElementById('sopnota_' + id);
  const txt = textoFijo || (campo ? campo.value.trim() : '');
  if(!txt){ showToast('Escribe la respuesta.'); return; }
  let imagen = null;
  if(!textoFijo){
    try{ imagen = await imagenDeInput('sopnotaimg_' + id, 1000); }
    catch(e){ showToast('No se pudo procesar la imagen; se envía sin foto.'); }
  }
  commit(doc=>{
    const s = (doc.soporte||[]).find(x=>x.id===id);
    if(!s) return;
    s.notas = s.notas || [];
    s.notas.push({ts:new Date().toISOString(), userId:currentUser.id, nombre:currentUser.nombre, texto:txt, imagen:imagen});
  });
  render();
}

/* Conversaciones entre docentes/administración, y entre docentes/administración
   y estudiantes. Cada mensaje es 1 a 1; se agrupan por la otra persona. */
function conversacionesDe(userId){
  const propios = (DB.mensajes||[]).filter(m=>m.deId===userId || m.paraId===userId);
  const grupos = {};
  propios.forEach(m=>{
    const otroId = m.deId===userId ? m.paraId : m.deId;
    const otroNombre = m.deId===userId ? m.paraNombre : m.deNombre;
    if(!grupos[otroId]) grupos[otroId] = {otroId, otroNombre, mensajes:[]};
    grupos[otroId].mensajes.push(m);
  });
  const lista = Object.keys(grupos).map(k=>grupos[k]);
  lista.forEach(g=>g.mensajes.sort((a,b)=>(a.ts||'').localeCompare(b.ts||'')));
  lista.sort((a,b)=>{
    const ua = a.mensajes[a.mensajes.length-1].ts || '';
    const ub = b.mensajes[b.mensajes.length-1].ts || '';
    return ub.localeCompare(ua);
  });
  return lista;
}
function contarMensajesNoLeidos(userId){

async function enviarMensajeDocente(){
  const tipo = viewState.msgDestinoTipo || 'docente';
  const texto = ((document.getElementById('msg_texto')||{}).value || '').trim();
  if(!texto){ showToast('Escribe un mensaje.'); return; }
  let imagen = null;
  try{ imagen = await imagenDeInput('msg_imagen', 1000); }
  catch(e){ showToast('No se pudo procesar la imagen; se envía sin foto.'); }

  if(tipo === 'docente'){
    const idsSeleccionados = Array.from(document.querySelectorAll('.msg-docente-check:checked')).map(el=>el.value);
    if(idsSeleccionados.length===0){ showToast('Elige a quién le vas a escribir.'); return; }
    const destinatarios = idsSeleccionados
      .map(id => DB.docentes.find(x=>x.id===id))
      .filter(Boolean);
    const nuevos = destinatarios.map(t => ({
      id: uid('msg'), ts: new Date().toISOString(), deId: currentUser.id, deNombre: currentUser.nombre,
      deTipo: isAdmin(currentUser)?'admin':'docente',
      paraId: t.id, paraNombre: t.nombre, paraTipo: 'docente', texto, imagen, leido: false
    }));
    commit(doc=>{ doc.mensajes = doc.mensajes || []; doc.mensajes.push(...nuevos); });
    registrar('Mensajes', destinatarios.length > 1
      ? 'Envió un mensaje a ' + destinatarios.length + ' persona(s)'
      : 'Envió un mensaje a ' + destinatarios[0].nombre);
    viewState.mensajeNuevo = false;
    if(destinatarios.length === 1){
      viewState.mensajeConv = destinatarios[0].id;
      showToast('Mensaje enviado.');
    }else{
      viewState.mensajeConv = null;
      showToast('Mensaje enviado a ' + destinatarios.length + ' persona(s).');
    }
    render();
    return;
  }

  if(tipo === 'estudiante'){
    const idsSeleccionados = Array.from(document.querySelectorAll('.msg-estudiante-check:checked')).map(el=>el.value);
    if(idsSeleccionados.length===0){ showToast('Elige a quién le vas a escribir.'); return; }
    const destinatarios = idsSeleccionados
      .map(id => DB.estudiantes.find(x=>x.id===id))
      .filter(Boolean);
    const nuevos = destinatarios.map(est => ({
      id: uid('msg'), ts: new Date().toISOString(), deId: currentUser.id, deNombre: currentUser.nombre,
      deTipo: isAdmin(currentUser)?'admin':'docente',
      paraId: est.id, paraNombre: nombreCompleto(est.nombres, est.apellidos), paraTipo: 'estudiante', texto, imagen, leido: false
    }));
    commit(doc=>{ doc.mensajes = doc.mensajes || []; doc.mensajes.push(...nuevos); });
    registrar('Mensajes', destinatarios.length > 1
      ? 'Envió un mensaje a ' + destinatarios.length + ' estudiante(s)'
      : 'Envió un mensaje a ' + nombreCompleto(destinatarios[0].nombres, destinatarios[0].apellidos));
    viewState.mensajeNuevo = false;
    if(destinatarios.length === 1){
      viewState.mensajeConv = destinatarios[0].id;
      showToast('Mensaje enviado.');
    }else{
      viewState.mensajeConv = null;
      showToast('Mensaje enviado a ' + destinatarios.length + ' estudiante(s).');
    }
    render();
  }
}

/* ============================= BITÁCORA DEL SISTEMA ============================= */
/* Deja constancia de quién entró y qué hizo. Se conservan los últimos 800
   movimientos para que el archivo no crezca sin control. */
const BITACORA_MAX = 800;
function registrar(accion, detalle){
  if(!currentUser) return;
  const linea = {
    ts: new Date().toISOString(),
    userId: currentUser.id,
    nombre: currentUser.nombre,
    accion: accion,
    detalle: detalle || ''
  };
  // Lo que hace la propietaria de la plataforma no deja rastro visible para
  // el colegio: se guarda aparte y solo ella puede verlo en su propia sesión.
  if(esPropietario(currentUser)) linea.propietario = true;
  commit(doc=>{
    doc.bitacora = doc.bitacora || [];
    doc.bitacora.push(linea);
    if(doc.bitacora.length > BITACORA_MAX) doc.bitacora.splice(0, doc.bitacora.length - BITACORA_MAX);
  });
}
function fechaLegible(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('es',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' +
           d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return iso; }
}
function renderBitacora(){
  if(!canManageAcademicData(currentUser)) return renderNoAccess();
  const todo = (DB.bitacora || []).slice().reverse()
    .filter(l => esPropietario(currentUser) ? true : !l.propietario);
  const quien = getPref('bitUser','');
  const accionF = getPref('bitAccion','');
  const diaF = getPref('bitDia','');
  const orden = getPref('bitOrden','fecha');          // 'fecha' o 'accion'
  let filtradas = quien ? todo.filter(l=>l.userId===quien) : todo;
  if(accionF) filtradas = filtradas.filter(l=>l.accion===accionF);
  if(diaF) filtradas = filtradas.filter(l=>String(l.ts).slice(0,10)===diaF);
  if(orden === 'accion'){
    // agrupa los movimientos del mismo tipo, y dentro de cada grupo del más reciente al más antiguo
    filtradas = filtradas.slice().sort((a,b)=>
      a.accion.localeCompare(b.accion,'es') || b.ts.localeCompare(a.ts));
  }
  const accionesUsadas = [...new Set((quien ? todo.filter(l=>l.userId===quien) : todo).map(l=>l.accion))].sort();
  const diasUsados = [...new Set((quien ? todo.filter(l=>l.userId===quien) : todo).map(l=>String(l.ts).slice(0,10)))].sort().reverse();
  const usuarios = DB.docentes.filter(t=>!esPropietario(t)).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const resumen = {};
  todo.forEach(l=>{
    if(!resumen[l.userId]) resumen[l.userId] = {ingresos:0, acciones:0, ultimo:l.ts};
    if(l.accion === 'Ingreso') resumen[l.userId].ingresos++;
    else resumen[l.userId].acciones++;
    if(l.ts > resumen[l.userId].ultimo) resumen[l.userId].ultimo = l.ts;
  });
  const u = quien ? DB.docentes.find(x=>x.id===quien) : null;

  return `
  <div class="page-head">
    <p class="page-eyebrow">Control interno</p>
    <h1 class="page-title">Bitácora del sistema</h1>
    <p class="page-desc">Registro de ingresos y cambios hechos por cada usuario. Puedes filtrar por día y por tipo de acción, o agrupar los movimientos del mismo tipo. Se conservan los últimos ${BITACORA_MAX}.</p>
  </div>
  <div class="filters">
    <div class="field">
      <label>Usuario</label>
      <select onchange="setPref('bitUser', this.value)">
        <option value="">Todos los usuarios</option>
        ${usuarios.map(x=>`<option value="${x.id}" ${quien===x.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Acción</label>
      <select onchange="setPref('bitAccion', this.value)">
        <option value="">Todas las acciones</option>
        ${accionesUsadas.map(x=>`<option value="${esc(x)}" ${accionF===x?'selected':''}>${esc(x)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Día</label>
      <select onchange="setPref('bitDia', this.value)">
        <option value="">Todos los días</option>
        ${diasUsados.map(d=>`<option value="${esc(d)}" ${diaF===d?'selected':''}>${esc(fechaCorta(d))}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Ordenar</label>
      <select onchange="setPref('bitOrden', this.value)">
        <option value="fecha" ${orden==='fecha'?'selected':''}>Por fecha y hora</option>
        <option value="accion" ${orden==='accion'?'selected':''}>Agrupado por acción</option>
      </select>
    </div>
    ${(quien||accionF||diaF)?`<button class="btn" onclick="setPref('bitUser',''); setPref('bitAccion',''); setPref('bitDia','')">Quitar filtros</button>`:''}
  </div>

  ${!quien ? `
  <div class="card">
    <p class="card-title">Resumen por usuario</p>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Usuario</th><th>Perfil</th><th style="width:110px;">Ingresos</th>
        <th style="width:120px;">Cambios</th><th style="width:170px;">Último movimiento</th><th></th></tr></thead>
      <tbody>
        ${usuarios.map(x=>{
          const r = resumen[x.id];
          return `<tr>
            <td>${esc(x.nombre)}</td>
            <td><span class="badge ${badgeClass(x)}">${esc(domainLabel(x))}</span></td>
            <td class="mono">${r?r.ingresos:0}</td>
            <td class="mono">${r?r.acciones:0}</td>
            <td class="mono">${r?esc(fechaLegible(r.ultimo)):'—'}</td>
            <td><button class="icon-btn" onclick="setPref('bitUser','${x.id}')">Ver detalle</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>
  </div>`:''}

  <div class="card">
    <p class="card-title">
      ${quien ? 'Movimientos de ' + esc(u?u.nombre:'') : 'Últimos movimientos'}
      <span class="pill pill-muted">${filtradas.length} registro(s)</span>
    </p>
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th style="width:170px; cursor:pointer;" onclick="setPref('bitOrden','fecha')">Fecha y hora ${orden==='fecha'?'▾':''}</th>
        ${quien?'':'<th>Usuario</th>'}
        <th style="width:190px; cursor:pointer;" onclick="setPref('bitOrden','accion')" title="Agrupar los movimientos del mismo tipo">Acción ${orden==='accion'?'▾':''}</th>
        <th>Detalle</th></tr></thead>
      <tbody>
        ${filtradas.length===0?`<tr><td colspan="4" class="empty">Todavía no hay movimientos registrados.</td></tr>`:''}
        ${filtradas.slice(0,300).map(l=>`<tr>
          <td class="mono">${esc(fechaLegible(l.ts))}</td>
          ${quien?'':`<td>${esc(l.nombre)}</td>`}
          <td><span class="pill ${l.accion==='Ingreso'?'pill-primary':'pill-muted'}" style="cursor:pointer;"
            title="Ver solo estos movimientos" onclick="setPref('bitAccion','${esc(l.accion)}')">${esc(l.accion)}</span></td>
          <td style="font-size:12.5px; color:var(--muted);">${esc(l.detalle)}</td>

      </tbody>

/* ============================= PROMEDIOS DEL PANEL ============================= */
/* Promedio de los estudiantes de esos grados en esas materias.
   Solo cuenta lo que ya tiene nota; ignora lo que está en blanco. */
function promedioDe(grados, asigIds){
  let suma = 0, n = 0;
  grados.forEach(g=>{
    const materias = asignaturasVisibles(g).filter(a=>!asigIds || asigIds.indexOf(a.id) >= 0);
    DB.estudiantes.filter(e=>e.grado===g).forEach(e=>{
      materias.forEach(a=>{
        const v = subjectInfo(e.id, a.id, g).valor;
        if(v !== null){ suma += v; n++; }
      });
    });
  });
  return n === 0 ? null : {valor: suma/n, cuantos: n};
}
function celdaProm(p){
  if(!p) return '<span class="empty" style="padding:0;">Sin notas</span>';
  const v = p.valor;
  return `<b class="mono ${v>=60?'avg-good':'avg-bad'}" style="font-size:15px;">${v.toFixed(1)}</b>`;
}

  const aSel = getPref('promAsig','');
  const gradosUsar = gSel ? [gSel] : grados;

      return `<tr><td>${esc(g)}</td><td>${celdaProm(p)}</td><td class="mono">${p?p.cuantos:0}</td></tr>`; }).join('')}
    </tbody></table>`;
  }else{
    detalle = `
    <table><thead><tr><th>Materia</th><th style="width:120px;">Promedio</th><th style="width:130px;">Notas contadas</th></tr></thead>
    <tbody>${asignaturasVisibles(gSel).filter(a=>!asigUsar || asigUsar.indexOf(a.id)>=0).map(a=>{

  }

  const rotulo = (gSel?esc(gSel):'Todo el colegio') + ' · ' + (aSel ? esc((materias.find(m=>m.id===aSel)||{}).nombre||'') : 'Todas las materias');
  return `

    <p class="card-title">Promedios <span class="pill pill-muted">${esc(rotulo)}</span></p>
    <div class="filters" style="margin-bottom:14px;">
      <div class="field">
        <label>Aula</label>
        <select onchange="setPref('promGrado', this.value)">
          <option value="">Todo el colegio</option>
          ${grados.map(g=>`<option value="${esc(g)}" ${gSel===g?'selected':''}>${esc(g)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Materia</label>
        <select onchange="setPref('promAsig', this.value)">
          <option value="">Todas las materias</option>
          ${materias.map(a=>`<option value="${a.id}" ${aSel===a.id?'selected':''}>${esc(a.nombre)}</option>`).join('')}
        </select>

function toggleSeleccionEst(id, marcado){
  viewState.seleccionEst = viewState.seleccionEst || {};
  if(marcado) viewState.seleccionEst[id] = true;
  else delete viewState.seleccionEst[id];
  render();
}
/* Estudiantes visibles según el grado elegido Y el texto de búsqueda (sin
   distinguir mayúsculas ni tildes) — usado por la tabla, la selección
   masiva y el borrado masivo, para que todos coincidan con lo que se ve. */
/* Buscar mientras se escribe, sin perder el cursor: se guarda la posición
   antes de redibujar y se restaura después (redibujar todo pierde el foco). */
function buscarEstudiantesInput(valor){
  PREFS['buscarEst'] = valor;
  try{ window.localStorage.setItem('prefs_ui', JSON.stringify(PREFS)); }catch(e){}
  const activo = document.activeElement;
  const cursor = (activo && activo.id==='buscar_est_input') ? activo.selectionStart : null;
  render();
  if(cursor !== null){
    const el = document.getElementById('buscar_est_input');
    if(el){ el.focus(); el.setSelectionRange(cursor, cursor); }
  }
}
function estudiantesFiltrados(){
  const filtro = getPref('filtroGrado','');
  const gradosMostrados = filtro ? [filtro] : misGrados(currentUser);
  const busqueda = normalizarComparacion(getPref('buscarEst',''));
  return DB.estudiantes.filter(e=>{
    if(gradosMostrados.indexOf(e.grado)<0) return false;
    if(!busqueda) return true;
    return normalizarComparacion(nombreCompleto(nombresDe(e), apellidosDe(e))).indexOf(busqueda) >= 0;
  });
}
function toggleSeleccionTodosMostrados(marcado){
  const idsMostrados = estudiantesFiltrados().map(e=>e.id);
  viewState.seleccionEst = viewState.seleccionEst || {};
  idsMostrados.forEach(id=>{
    if(marcado) viewState.seleccionEst[id] = true;
    else delete viewState.seleccionEst[id];
  });
  render();
}
function eliminarSeleccionEst(){
  if(!puedeGestionarEstudiantes(currentUser)){ showToast('No tienes permiso para eliminar estudiantes.'); return; }
  const ids = Object.keys(viewState.seleccionEst || {}).filter(id=>viewState.seleccionEst[id]);
  if(ids.length===0){ showToast('No hay ningún estudiante seleccionado.'); return; }
  if(!confirm(`¿Eliminar ${ids.length} estudiante(s) seleccionado(s)? También se borrarán sus calificaciones. Esta acción no se puede deshacer.`)) return;
  commit(doc=>{
    for(let i=doc.estudiantes.length-1; i>=0; i--){
      if(ids.indexOf(doc.estudiantes[i].id)>=0) doc.estudiantes.splice(i,1);
    }
    ids.forEach(id=>{
      Object.keys(doc.calificaciones).forEach(k=>{ if(k.startsWith(id+'|')) delete doc.calificaciones[k]; });
    });
  });
  registrar('Estudiante', `Eliminó ${ids.length} estudiante(s) en bloque`);
  showToast(`${ids.length} estudiante(s) eliminado(s).`);
  viewState.seleccionEst = {};
  render();
}

/* ============================= IMPORTAR ESTUDIANTES DESDE UNA LISTA PEGADA ============================= */
/* ============================= CARGAR DATOS DESDE UN ARCHIVO (HOJA DE TAREAS) =============================
   Lee un Word, un PDF, o una imagen pegada con Ctrl+V, y adivina fecha,
   contenido, tarea y criterios para no tener que escribirlos a mano.
   Las librerías se cargan solo la primera vez que se usa esto, para no
   pesarle a quien nunca lo necesite. */
const _librerias = {};
function cargarScript(src){
  if(_librerias[src]) return _librerias[src];
  _librerias[src] = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve(true);
    s.onerror = ()=>reject(new Error('No se pudo cargar ' + src + ' (revisa tu conexión a internet).'));
    document.head.appendChild(s);
  });
  return _librerias[src];
}
function leerArchivoComoArrayBuffer(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('No se pudo leer el archivo.'));
    r.readAsArrayBuffer(file);
  });
}
async function extraerTextoDocx(file){
  await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const buf = await leerArchivoComoArrayBuffer(file);
  const zip = await JSZip.loadAsync(buf);
  const doc = zip.file('word/document.xml');
  if(!doc) throw new Error('Ese archivo no parece un Word (.docx) válido.');
  const xml = await doc.async('string');
  const parrafos = xml.split(/<\/w:p>/);
  const partes = [];
  parrafos.forEach(p=>{
    const textos = [...p.matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map(m=>m[1]);
    if(textos.length) partes.push(textos.join(''));
  });
  return partes.join('\n')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
}
/* Lee la TABLA de verdad de un Word (filas y columnas), no solo el texto
   corrido — así se pueden detectar varias tareas e integradoras de una
   sola vez, tal como están armadas en la Hoja de tareas de la escuela.
   Usa el analizador XML del navegador, que sí entiende tablas anidadas
   (como la tabla chiquita de Puntualidad/Legibilidad/Contenido dentro de
   la columna de Rúbrica). */
async function extraerFilasDocx(file){
  await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const buf = await leerArchivoComoArrayBuffer(file);
  const zip = await JSZip.loadAsync(buf);
  const docFile = zip.file('word/document.xml');
  if(!docFile) throw new Error('Ese archivo no parece un Word (.docx) válido.');
  const xml = await docFile.async('string');
  const NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const xdoc = new DOMParser().parseFromString(xml, 'application/xml');
  if(xdoc.getElementsByTagName('parsererror').length) return [];
  const tablas = Array.from(xdoc.getElementsByTagNameNS(NS, 'tbl'));
  if(tablas.length === 0) return [];
  // La tabla que buscamos es la de más afuera (no una tabla chiquita metida
  // dentro de una celda).
  const nivelSuperior = tablas.filter(t=>{
    let p = t.parentNode;
    while(p){ if(p.namespaceURI===NS && p.localName==='tc') return false; p = p.parentNode; }
    return true;
  });
  const candidatas = nivelSuperior.length ? nivelSuperior : tablas;
  let mejor = candidatas[0], mejorCantidad = -1;
  candidatas.forEach(t=>{
    const cant = Array.from(t.childNodes).filter(n=>n.namespaceURI===NS && n.localName==='tr').length;
    if(cant > mejorCantidad){ mejorCantidad = cant; mejor = t; }
  });
  const filasNodos = Array.from(mejor.childNodes).filter(n=>n.namespaceURI===NS && n.localName==='tr');
  // Cada celda: su texto, y si "continúa" una combinación vertical desde la
  // fila de arriba (Word junta Fecha/Contenido/Tarea en varias filas reales
  // cuando la columna de Rúbrica trae un criterio por fila).
  return filasNodos.map(tr=>{
    const celdas = Array.from(tr.childNodes).filter(n=>n.namespaceURI===NS && n.localName==='tc');
    return celdas.map(tc=>{
      const vMerge = tc.getElementsByTagNameNS(NS, 'vMerge')[0];
      const continua = !!vMerge && vMerge.getAttribute('w:val') !== 'restart';
      const texto = Array.from(tc.getElementsByTagNameNS(NS,'t')).map(t=>t.textContent).join('').trim();
      return {texto, continua};
    });
  });
}
async function extraerTextoPdf(file){
  await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  if(typeof pdfjsLib !== 'undefined'){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf = await leerArchivoComoArrayBuffer(file);
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let texto = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const contenido = await page.getTextContent();
    texto += contenido.items.map(it=>it.str).join(' ') + '\n';
  }
  return texto;
}
/* Reconocimiento de texto en una imagen (OCR). No es perfecto: funciona
   bien con texto impreso claro, y bastante peor con letra a mano o fotos
   borrosas — por eso siempre se deja revisar el resultado antes de usarlo. */
async function extraerTextoImagen(blob){
  await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js');
  const resultado = await Tesseract.recognize(blob, 'spa');
  return resultado.data.text;
}
const MESES_ES = {enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,junio:6,julio:7,agosto:8,
  septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
function analizarFechaTexto(texto){
  let m = texto.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
  if(m){
    let [,d,mo,y] = m;
    if(y.length===2) y = '20'+y;
    return y + '-' + mo.padStart(2,'0') + '-' + d.padStart(2,'0');
  }
  m = texto.match(/\b(\d{1,2})\s+de\s+([a-záéíóúñ]+)(?:\s+de\s+(\d{4}))?\b/i);
  if(m){
    const mesNum = MESES_ES[normalizarComparacion(m[2])];
    if(mesNum){
      const y = m[3] || String(new Date().getFullYear());
      return y + '-' + String(mesNum).padStart(2,'0') + '-' + m[1].padStart(2,'0');
    }
  }
  return '';
}
/* A partir del texto extraído, adivina fecha/contenido/tarea/criterios.
   Es un intento razonable, no una lectura perfecta: por eso siempre se
   muestra editable antes de guardarlo. */
function analizarTextoParaFila(texto){
  const fecha = analizarFechaTexto(texto);
  const lineas = texto.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  let contenido = '', tarea = '';
  const criterios = [];
  const restantes = [];
  lineas.forEach(l=>{
    const norm = normalizarComparacion(l);
    if(/^(contenidos?|tema):/.test(norm)) contenido = (contenido?contenido+' ':'') + l.replace(/^[^:]*:/,'').trim();
    else if(/^(tareas?|actividad|trabajo|indicaciones?):/.test(norm)) tarea = (tarea?tarea+' ':'') + l.replace(/^[^:]*:/,'').trim();
    else if(/^(criterios?|r[uú]brica):/.test(norm)) criterios.push(l.replace(/^[^:]*:/,'').trim());
    else if(!/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test(l)) restantes.push(l);
  });
  if(!contenido && restantes.length) contenido = restantes[0];
  if(!tarea && restantes.length>1) tarea = restantes.slice(1).join(' ');
  return {fecha, contenido, tarea, criterios};
}
/* Separa "Páginas 78, 79 y 82Puntualidad30%Legibilidad...10%Contenido60%"
   en el texto de la tarea y la lista de criterios con su porcentaje.
   Los nombres de los criterios siempre empiezan justo después de un número
   (el final del texto anterior) con mayúscula, así se distinguen del
   texto de la tarea aunque no haya ningún espacio entre ambos. */
function extraerCriteriosYTarea(bloque){
  const re = /([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ()'".,\s]*?)(\d{1,3})\s*%/g;
  const criterios = [];
  let primerInicio = -1;
  let m;
  while((m = re.exec(bloque)) !== null){
    if(primerInicio === -1) primerInicio = m.index;
    const nombre = m[1].trim();
    if(nombre) criterios.push({nombre, peso:Number(m[2])});
  }
  const tarea = (primerInicio >= 0 ? bloque.slice(0, primerInicio) : bloque).trim();
  return {tarea, criterios};
}
/* A partir de las filas crudas de la tabla (cada celda con su texto y si
   "continúa" una combinación vertical desde arriba), arma una lista de
   filas de tarea/integradora/examen listas para revisar. Cuando Word
   combina Fecha/Contenido/Tarea en varias filas reales (una por cada
   criterio de la Rúbrica), estas se vuelven a juntar en una sola tarea con
   todos sus criterios. Es un intento razonable, no perfecto — por eso todo
   queda editable antes de guardarse. */
function esEncabezadoOMetadatoFila(textos, todoTexto){
  const norm0 = normalizarComparacion(textos[0]||'');
  if(/^fecha$/.test(norm0)) return true;                              // fila "FECHA | CONTENIDOS | ..."
  if(/^(grado|docente|asignatura|materia|periodo|per[ií]odo)\s*:?/.test(normalizarComparacion(todoTexto))) return true;
  return false;
}
function interpretarFilasTabla(filasCeldas){
  const resultado = [];
  let grupo = null;   // {esIntegradora, fecha, contenido, tarea, criterios}

  function cerrarGrupo(){
    if(!grupo) return;
    if(grupo.esIntegradora) resultado.push({tipo:'integradora', fecha:grupo.fecha, etiqueta:grupo.etiqueta, tarea:grupo.tarea, contenido:''});
    else resultado.push({tipo:'tarea', fecha:grupo.fecha, contenido:grupo.contenido, tarea:grupo.tarea, criterios:grupo.criterios});
    grupo = null;
  }

  filasCeldas.forEach(celdas=>{
    if(!celdas.length) return;
    const textos = celdas.map(c=>c.texto);
    const todoTexto = textos.join(' ').trim();
    if(!todoTexto) return;
    if(esEncabezadoOMetadatoFila(textos, todoTexto)){ cerrarGrupo(); return; }

    const continua = celdas[0] && celdas[0].continua;

    if(!continua){
      cerrarGrupo();
      if(celdas.length <= 3 && /semana de ex[aá]menes|^ex[aá]men/i.test(todoTexto)){
        resultado.push({tipo:'examen', fecha: analizarFechaTexto(textos[0]||todoTexto), texto: todoTexto.replace(textos[0]||'', '').trim() || todoTexto});
        return;
      }
      const fecha = analizarFechaTexto(textos[0] || todoTexto);
      const contenido = (textos[1] || '').trim();
      const bloqueResto = textos.slice(2).join(' ').trim();
      const esIntegradora = /integradora/i.test(contenido) || /integradora/i.test(bloqueResto);
      if(esIntegradora){
        const etiqueta = (todoTexto.match(/INTEGRADORA\s*[IVX0-9]+/i) || [''])[0].toUpperCase().replace(/\s+/g,' ');
        let despues = todoTexto.slice(todoTexto.search(/INTEGRADORA\s*[IVX0-9]+/i) + etiqueta.length);
        despues = despues.split(/Fecha:|F\.\s*Responsable|F\.\s*Maestro/i)[0].trim();
        // Algunas integradoras traen además un tema en la columna de
        // Contenido (ej.: "La suma"); no lo perdemos, se antepone.
        const tarea = contenido ? (contenido + ' — ' + despues).trim() : despues;
        grupo = {esIntegradora:true, fecha, etiqueta, tarea};
      }else{
        const {tarea, criterios} = criteriosDeFila(textos, bloqueResto);
        grupo = {esIntegradora:false, fecha, contenido, tarea, criterios};
      }
    }else if(grupo && !grupo.esIntegradora){
      // Esta fila solo trae un criterio más de la Rúbrica para la misma tarea.
      const bloqueResto = textos.slice(2).join(' ').trim();
      const {criterios} = criteriosDeFila(textos, bloqueResto);
      grupo.criterios.push(...criterios);
    }
  });
  cerrarGrupo();
  return resultado;
}
/* La columna de Rúbrica casi siempre trae el nombre del criterio y su
   porcentaje en dos celdas separadas y en una posición fija (columnas 3 y
   4). Cuando la tarea es un texto largo, confiar en esa posición es mucho
   más seguro que tratar de separarlo por texto (una descripción larga
   puede "tragarse" el nombre del criterio si se adivina solo con patrones). */
function celdaPorcentaje(txt){
  const m = String(txt||'').match(/(\d{1,3})\s*%/);
  return m ? Number(m[1]) : null;
}
function criteriosDeFila(textos, bloqueResto){
  const nombreCrit = (textos[3]||'').trim();
  const peso = celdaPorcentaje(textos[4]);
  if(nombreCrit && peso !== null){
    return {tarea: (textos[2]||'').trim(), criterios: [{nombre:nombreCrit, peso}]};
  }
  return extraerCriteriosYTarea(bloqueResto);
}
function abrirCargarArchivoHoja(){
  viewState.modalCargarArchivo = {paso:1, cargando:false, error:''};
  render();
}
function cerrarCargarArchivoHoja(){
  viewState.modalCargarArchivo = null;
  render();
}
async function procesarArchivoHoja(file){
  if(!file) return;
  viewState.modalCargarArchivo = {paso:1, cargando:true, error:''};
  render();
  try{
    const nombre = (file.name || '').toLowerCase();
    if(nombre.endsWith('.docx')){
      // Primero se intenta leer la tabla de verdad (varias filas a la vez).
      let filasTabla = [];
      try{ filasTabla = interpretarFilasTabla(await extraerFilasDocx(file)); }catch(e){ console.warn('lectura de tabla', e); }
      const filasUtiles = filasTabla.filter(f=>f.tipo==='examen' || f.contenido || f.tarea);
      if(filasUtiles.length >= 2){
        viewState.modalCargarArchivo = {paso:3, cargando:false, error:'', filas: filasUtiles};
        render();
        return;
      }
      // Si no se encontró una tabla útil, se cae al modo de una sola fila.
      const texto = await extraerTextoDocx(file);
      if(!texto || !texto.trim()) throw new Error('No se encontró texto en ese archivo.');
      viewState.modalCargarArchivo = {paso:2, cargando:false, error:'', texto, campos: analizarTextoParaFila(texto)};
      render();
      return;
    }
    let texto = '';
    if(nombre.endsWith('.pdf')) texto = await extraerTextoPdf(file);
    else if(/^image\//.test(file.type)) texto = await extraerTextoImagen(file);
    else throw new Error('Ese tipo de archivo no se reconoce. Usa un .docx, un .pdf, o pega una imagen.');
    if(!texto || !texto.trim()) throw new Error('No se encontró texto en ese archivo.');
    const campos = analizarTextoParaFila(texto);
    viewState.modalCargarArchivo = {paso:2, cargando:false, error:'', texto, campos};
  }catch(e){
    console.error(e);
    viewState.modalCargarArchivo = {paso:1, cargando:false, error: e.message || 'No se pudo procesar el archivo.'};
  }
  render();
}
async function manejarPegadoImagenHoja(ev){
  const items = ev.clipboardData && ev.clipboardData.items;
  if(!items) return;
  for(let i=0; i<items.length; i++){
    if(items[i].type.indexOf('image') === 0){
      ev.preventDefault();
      const blob = items[i].getAsFile();
      await procesarArchivoHoja(blob);
      return;
    }
  }
  showToast('No se detectó ninguna imagen en lo que pegaste (Ctrl+V).');
}
function insertarFilaDesdeArchivo(){
  const info = viewState.modalCargarArchivo;
  if(!info || info.paso !== 2) return;
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const tipoSel = document.querySelector('input[name="carg_tipo"]:checked');
  const tipo = tipoSel ? tipoSel.value : 'tarea';
  const fecha = val('carg_fecha');
  const contenido = val('carg_contenido');
  const tareaTxt = val('carg_tarea');
  const criteriosTxt = val('carg_criterios');
  const { grado, asigId, periodo } = hojaActual();
  const cfg = hojaCfg();
  const donde = (typeof viewState.filaSel === 'number') ? viewState.filaSel : null;
  const criterios = criteriosTxt.split('\n').map(c=>c.trim()).filter(Boolean).map(nombre=>({nombre, peso:0}));
  mutarHoja(grado, asigId, periodo, h=>{
    const cuantas = h.filas.filter(f=>f.tipo==='integradora').length;
    const nueva = tipo==='integradora'
      ? {tipo:'integradora', fecha, contenido, tarea:tareaTxt, etiqueta: cfg.etiquetas[cuantas]||('INTEGRADORA '+(cuantas+1)), rubrica:[], nota:'', obs:''}
      : {tipo:'tarea', fecha, contenido, tarea:tareaTxt, etiqueta:'', rubrica: criterios.length?criterios:cfg.rubrica.map(r=>Object.assign({},r)), nota:'', obs:''};
    if(donde !== null && donde >= 0 && donde < h.filas.length) h.filas.splice(donde + 1, 0, nueva);
    else h.filas.push(nueva);
  });
  viewState.modalCargarArchivo = null;
  showToast('Fila agregada. Revisa que los datos hayan quedado bien.');
  render();
}
function insertarFilasMultiples(){
  const info = viewState.modalCargarArchivo;
  if(!info || info.paso !== 3) return;
  const filas = info.filas || [];

  // Primero se lee TODO del formulario, antes de tocar la base de datos.
  // Importante: esto no puede hacerse adentro del "mutarHoja" de más abajo,
  // porque ese bloque se vuelve a ejecutar solo unos segundos después (al
  // guardar en la nube) y para entonces el formulario ya no existe en
  // pantalla — leerlo ahí adentro duplicaba las filas, la segunda tanda
  // en blanco.
  const resueltas = [];
  let examenFecha = '', examenTexto = '';
  filas.forEach((f, i)=>{
    const incluir = document.getElementById('mf_incluir_' + i);
    if(incluir && !incluir.checked) return;
    const tipo = (document.getElementById('mf_tipo_' + i)||{}).value || f.tipo;
    const fecha = (document.getElementById('mf_fecha_' + i)||{}).value || '';
    if(tipo === 'examen'){
      examenFecha = fecha || examenFecha;
      examenTexto = (document.getElementById('mf_tarea_' + i)||{}).value || examenTexto;
      return;
    }
    const contenido = (document.getElementById('mf_contenido_' + i)||{}).value || '';
    const tareaTxt = (document.getElementById('mf_tarea_' + i)||{}).value || '';
    const criteriosTxt = (document.getElementById('mf_criterios_' + i)||{}).value || '';
    const criterios = criteriosTxt.split('\n').map(c=>c.trim()).filter(Boolean).map(linea=>{
      const m = linea.match(/^(.*?)[:\-]?\s*(\d{1,3})\s*%?$/);
      return m ? {nombre:m[1].trim(), peso:Number(m[2])} : {nombre:linea, peso:0};
    });
    resueltas.push({tipo, fecha, contenido, tarea:tareaTxt, criterios, etiquetaDetectada: f.etiqueta || ''});
  });

  const { grado, asigId, periodo } = hojaActual();
  const cfg = hojaCfg();
  let rellenadas = 0, agregadas = 0;

  mutarHoja(grado, asigId, periodo, h=>{
    const filaVacia = (fila) => fila.tipo==='tarea' ? (!fila.contenido && !fila.tarea) : !fila.tarea;
    let cuantasInt = h.filas.filter(f=>f.tipo==='integradora').length;

    resueltas.forEach(r=>{
      // Primero se intenta rellenar una fila vacía existente del mismo tipo,
      // en vez de siempre agregar una fila nueva.
      const existente = h.filas.find(f=>f.tipo===r.tipo && filaVacia(f));
      if(existente){
        existente.fecha = r.fecha;
        if(r.tipo==='tarea'){
          existente.contenido = r.contenido;
          existente.tarea = r.tarea;
          if(r.criterios.length) existente.rubrica = r.criterios;
        }else{
          existente.tarea = r.tarea;
          if(r.etiquetaDetectada) existente.etiqueta = r.etiquetaDetectada;
        }
        rellenadas++;
        return;
      }
      const nueva = r.tipo==='integradora'
        ? {tipo:'integradora', fecha:r.fecha, contenido:'', tarea:r.tarea,
           etiqueta: r.etiquetaDetectada || cfg.etiquetas[cuantasInt] || ('INTEGRADORA '+(cuantasInt+1)), rubrica:[], nota:'', obs:''}
        : {tipo:'tarea', fecha:r.fecha, contenido:r.contenido, tarea:r.tarea, etiqueta:'',
           rubrica: r.criterios.length ? r.criterios : cfg.rubrica.map(x=>Object.assign({},x)), nota:'', obs:''};
      if(r.tipo==='integradora') cuantasInt++;
      h.filas.push(nueva);
      agregadas++;
    });

    if(examenFecha || examenTexto){
      h.examen = h.examen || {};
      if(examenFecha) h.examen.fecha = examenFecha;
      if(examenTexto) h.examen.texto = examenTexto;
    }
  });

  viewState.modalCargarArchivo = null;
  showToast(`${rellenadas} fila(s) rellenada(s), ${agregadas} fila(s) nueva(s) agregada(s).`);
  render();
}
