function normalizarComparacion(txt){
  return String(txt||'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,' ');
}
/* Cada línea trae siempre 2 apellidos; el resto son nombres (pueden ser 1 o más). */
function partirLineaEstudiante(linea, orden){
  const palabras = String(linea||'').trim().split(/\s+/).filter(Boolean);
  if(palabras.length < 3) return null;
  if(orden === 'apellidos'){
    return { apellidos: palabras.slice(0,2).join(' '), nombres: palabras.slice(2).join(' ') };
  }
  return { apellidos: palabras.slice(-2).join(' '), nombres: palabras.slice(0,-2).join(' ') };
}
function analizarImportacion(){
  const texto = (document.getElementById('imp_texto')||{}).value || '';
  const orden = (document.querySelector('input[name="imp_orden"]:checked')||{}).value || 'apellidos';
  const grado = (document.getElementById('imp_grado')||{}).value;
  if(!grado){ showToast('Elige el grado donde se agregarán.'); return; }
  const lineas = texto.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lineas.length===0){ showToast('Pega al menos un nombre.'); return; }

  const existentesDelGrado = DB.estudiantes.filter(e=>e.grado===grado);
  const filas = lineas.map(linea=>{
    const partido = partirLineaEstudiante(linea, orden);
    if(!partido) return {original:linea, error:'No se reconocen al menos 2 apellidos y 1 nombre.'};
    const comp = normalizarComparacion(partido.apellidos + ' ' + partido.nombres);
    const existente = existentesDelGrado.find(e=>normalizarComparacion(apellidosDe(e)+' '+nombresDe(e))===comp);
    return {
      original: linea, nombres: partido.nombres, apellidos: partido.apellidos,
      duplicadoId: existente ? existente.id : null,
      accion: existente ? 'mantener' : 'nuevo'
    };
  });
  viewState.modalImportar = {paso:2, grado, orden, filas};
  render();
}
function cambiarAccionImportar(i, accion){
  if(!viewState.modalImportar || !viewState.modalImportar.filas[i]) return;
  viewState.modalImportar.filas[i].accion = accion;
  render();
}
function confirmarImportacion(){
  const info = viewState.modalImportar;
  if(!info || !info.filas) return;
  const grado = info.grado;
  const validas = info.filas.filter(f=>!f.error);
  let agregados = 0, reemplazados = 0, mantenidos = 0;
  commit(doc=>{
    validas.forEach(f=>{
      if(f.accion === 'nuevo'){
        const item = {id:uid('est'), nombres:f.nombres, apellidos:f.apellidos,
          nombre: nombreCompleto(f.nombres, f.apellidos), grado, accesos: accesosPorDefecto()};
        item.usuario = generarUsuarioEstudiante(f.nombres, f.apellidos, item.id);
        const txt = generarClaveEstudiante(item.id);
        item.clave = hashClave(txt);
        item.claveTexto = txt;
        doc.estudiantes.push(item);
        agregados++;
      }else if(f.accion === 'reemplazar' && f.duplicadoId){
        const e = doc.estudiantes.find(x=>x.id===f.duplicadoId);
        if(e){
          e.nombres = f.nombres; e.apellidos = f.apellidos;
          e.nombre = nombreCompleto(f.nombres, f.apellidos);
          reemplazados++;
        }
      }else{
        mantenidos++;
      }
    });
  });
  registrar('Estudiante', `Importó una lista en ${grado}: ${agregados} nuevo(s), ${reemplazados} reemplazado(s), ${mantenidos} sin cambios.`);
  showToast(`${agregados} agregado(s), ${reemplazados} reemplazado(s), ${mantenidos} sin cambios.`);
  viewState.modalImportar = null;
  render();
}
function renderImportarModal(){
  const info = viewState.modalImportar;
  if(!info) return '';
  const cerrar = `viewState.modalImportar=null; render();`;
  const gradosVisibles = misGrados(currentUser);
  const filtro = getPref('filtroGrado','');

  if(info.paso === 1){
    return `
    <div class="modal-bg" onclick="if(event.target===this){ ${cerrar} }">
      <div class="modal">
        <button class="modal-close" onclick="${cerrar}">×</button>
        <h3 class="modal-title">Pegar lista de estudiantes</h3>
        <p class="nota-chica" style="margin-top:-6px;">Un estudiante por línea. Cada línea debe traer siempre 2 apellidos; el resto se toma como nombres.</p>
        <div class="field"><label>Grado / aula</label>
          <select id="imp_grado">
            ${gradosVisibles.map(g=>`<option value="${esc(g)}" ${(filtro||gradosVisibles[0])===g?'selected':''}>${esc(g)}</option>`).join('')}
          </select></div>
        <div class="field">
          <label>¿Cómo está ordenada la lista que vas a pegar?</label>
          <div class="tag-row">
            <label class="check-chip"><input type="radio" name="imp_orden" value="apellidos" checked> Apellidos primero (2), luego nombres</label>
            <label class="check-chip"><input type="radio" name="imp_orden" value="nombres"> Nombres primero, apellidos (2) al final</label>
          </div>
        </div>
        <div class="field"><label>Lista</label>
          <textarea id="imp_texto" rows="10" placeholder="Gamez Fuentes Jacob Arthur
Jacobo Solis Fernando Andrés
Manzano González Karine Monserrat"></textarea></div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="analizarImportacion()">Analizar lista</button>
          <button class="btn" onclick="${cerrar}">Cancelar</button>
        </div>
      </div>
    </div>`;
  }

  // Paso 2: revisión antes de confirmar
  const filas = info.filas;
  const nuevos = filas.filter(f=>!f.error && f.accion==='nuevo').length;
  const dups = filas.filter(f=>!f.error && f.duplicadoId).length;
  const errores = filas.filter(f=>f.error).length;
  return `
  <div class="modal-bg" onclick="if(event.target===this){ ${cerrar} }">
    <div class="modal" style="max-width:720px;">
      <button class="modal-close" onclick="${cerrar}">×</button>
      <h3 class="modal-title">Revisar antes de agregar — ${esc(info.grado)}</h3>
      <p class="nota-chica" style="margin-top:-6px;">${nuevos} nuevo(s) · ${dups} ya existían · ${errores} con error</p>
      <div class="table-wrap" style="max-height:360px; overflow-y:auto;">
      <table>
        <thead><tr><th>Línea pegada</th><th>Apellidos</th><th>Nombres</th><th style="width:230px;">Acción</th></tr></thead>
        <tbody>
          ${filas.map((f,i)=>{
            if(f.error) return `<tr><td colspan="4" style="color:var(--red); font-size:12px;">${esc(f.original)} — ${esc(f.error)}</td></tr>`;
            if(!f.duplicadoId) return `<tr>
              <td style="font-size:12px;">${esc(f.original)}</td>
              <td>${esc(f.apellidos)}</td><td>${esc(f.nombres)}</td>
              <td><span class="pill pill-primary">Nuevo</span></td></tr>`;
            return `<tr>
              <td style="font-size:12px;">${esc(f.original)}</td>
              <td>${esc(f.apellidos)}</td><td>${esc(f.nombres)}</td>
              <td>
                <select onchange="cambiarAccionImportar(${i}, this.value)">
                  <option value="mantener" ${f.accion==='mantener'?'selected':''}>Ya existe — mantener el actual</option>
                  <option value="reemplazar" ${f.accion==='reemplazar'?'selected':''}>Reemplazar (conserva notas)</option>
                </select>
              </td></tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn btn-primary" onclick="confirmarImportacion()">Confirmar</button>
        <button class="btn" onclick="viewState.modalImportar={paso:1}; render();">Volver</button>
      </div>
    </div>
  </div>`;
}

/* Paneles que un estudiante puede tener habilitados. Por defecto ninguno:
   Dirección/docente los activa desde "Accesos" o desde Editar. */
const PANELES_ESTUDIANTE = [
  {id:'reportes',       label:'Reportes disciplinarios (solo su historial)'},
  {id:'hojas',          label:'Hojas de tareas (solo su grado)'},
  {id:'calificaciones', label:'Calificaciones (solo las suyas)'},
  {id:'alertas',        label:'Alertas de tareas'},
  {id:'boletas',        label:'Boletas de notas'},
  {id:'mensajes',       label:'Mensajes con docentes y administración'}
];
function accesosPorDefecto(){
  const a = {}; PANELES_ESTUDIANTE.forEach(p=>a[p.id]=false); return a;
}
function normalizarUsuario(txt){
  return String(txt||'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9.]+/g,'');
}
function usuarioEstudianteExiste(usuario, exceptoId){
  return DB.estudiantes.some(e=>e.usuario && e.usuario===usuario && e.id!==exceptoId);
}
/* Usuario por defecto: primer nombre + primer apellido. Si ya existe, se
   agregan segundos nombres/apellidos hasta que sea único; al final, un
   número correlativo como último recurso. */
function generarUsuarioEstudiante(nombres, apellidos, exceptoId){
  const pn = String(nombres||'').trim().split(/\s+/).filter(Boolean).map(normalizarUsuario);
  const pa = String(apellidos||'').trim().split(/\s+/).filter(Boolean).map(normalizarUsuario);
  const n1 = pn[0]||'estudiante', n2 = pn[1]||'';
  const a1 = pa[0]||'ecan', a2 = pa[1]||'';
  const candidatos = [
    n1+'.'+a1,
    a2 ? n1+'.'+a1+a2 : null,
    n2 ? n1+n2+'.'+a1 : null,
    (n2&&a2) ? n1+n2+'.'+a1+a2 : null
  ].filter(Boolean);
  for(const c of candidatos){ if(!usuarioEstudianteExiste(c, exceptoId)) return c; }
  const base = candidatos[candidatos.length-1] || (n1+'.'+a1);
  let i = 2;
  while(usuarioEstudianteExiste(base+i, exceptoId)) i++;
  return base+i;
}
function usuarioDocenteExiste(usuario, exceptoId){
  return DB.docentes.some(t=>t.usuario && t.usuario===usuario && t.id!==exceptoId);
}
/* Usuario de acceso para docentes/administración: primer nombre + primer
   apellido del nombre registrado (se ignoran tratamientos como "Lic.",
   "Miss", "Sra."). Si ya existe, se agrega la siguiente palabra del nombre
   hasta ser único; al final, un número correlativo. */
function generarUsuarioDocente(nombreCompleto_, exceptoId){
  const partes = String(nombreCompleto_||'').trim().split(/\s+/).filter(Boolean)
    .filter(p=>TRATAMIENTOS.indexOf(p.toLowerCase().replace(/\.$/,''))<0)
    .map(normalizarUsuario).filter(Boolean);
  if(partes.length===0) return 'usuario' + Math.floor(Math.random()*900+100);
  if(partes.length===1) return usuarioDocenteExiste(partes[0], exceptoId) ? partes[0]+'2' : partes[0];
  const n1 = partes[0];
  const candidatos = [n1+'.'+partes[1]];
  let acumulado = candidatos[0];
  partes.slice(2).forEach(p=>{ acumulado = acumulado + p; candidatos.push(acumulado); });
  for(const c of candidatos){ if(!usuarioDocenteExiste(c, exceptoId)) return c; }
  const base = candidatos[candidatos.length-1];
  let i = 2;
  while(usuarioDocenteExiste(base+i, exceptoId)) i++;
  return base+i;
}
/* Contraseña: 5 dígitos, única entre todos los estudiantes */
function generarClaveEstudiante(exceptoId){
  const usadas = new Set(DB.estudiantes.filter(e=>e.id!==exceptoId && e.claveTexto).map(e=>e.claveTexto));
  let intento;  do{ intento = String(Math.floor(10000 + Math.random()*90000)); } while(usadas.has(intento));
  return intento;
}
/* Convierte un dataURL (canvas.toDataURL) a bytes reales para meterlo en el ZIP */
function dataUrlABytes(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
let _imgPlantillaCredencial = null;
function cargarPlantillaCredencial(){
  return new Promise((resolve, reject)=>{
    if(_imgPlantillaCredencial){ resolve(_imgPlantillaCredencial); return; }
    const img = new Image();
    img.onload = ()=>{ _imgPlantillaCredencial = img; resolve(img); };
    img.onerror = reject;
    img.src = 'data:image/png;base64,' + PLANTILLA_CREDENCIAL_B64;
  });
}
/* Dibuja la credencial de un estudiante sobre la plantilla oficial y
   devuelve un dataURL PNG. Coordenadas calibradas sobre la imagen 1054×1492. */
function dibujarCredencial(img, usuario, clave){
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const esc2 = img.width / 1054;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(297*esc2, 949*esc2, 584*esc2, 46*esc2);
  ctx.fillRect(297*esc2, 1089*esc2, 584*esc2, 39*esc2);
  ctx.fillStyle = '#16233F';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '600 ' + Math.round(34*esc2) + 'px Inter, Arial, sans-serif';
  ctx.fillText(usuario, 302*esc2, 985*esc2);
  ctx.font = '600 ' + Math.round(34*esc2) + 'px "JetBrains Mono", monospace';
  ctx.fillText(clave, 302*esc2, 1120*esc2);
  return c.toDataURL('image/png');
}
/* Asegura que el estudiante tenga usuario y contraseña asignados (los genera si faltan) */
function asegurarCredencialEstudiante(e){
  let cambio = false;
  if(!e.usuario){ e.usuario = generarUsuarioEstudiante(e.nombres, e.apellidos, e.id); cambio = true; }
  if(!e.clave){ const txt = generarClaveEstudiante(e.id); e.clave = hashClave(txt); e.claveTexto = txt; cambio = true; }
  if(!e.accesos) e.accesos = accesosPorDefecto();
  return cambio;
}
async function descargarCredenciales(){
  if(!puedeDescargarCredenciales(currentUser)){ showToast('No tienes permiso para descargar credenciales.'); return; }
  const filtro = getPref('filtroGrado','');
  const gradosVisibles = misGrados(currentUser);
  const gradosMostrados = filtro ? [filtro] : gradosVisibles;
  const orden = getPref('ordenEst','apellidos');
  let lista = [];
  gradosMostrados.forEach(g=>{
    ordenarEstudiantes(DB.estudiantes.filter(e=>e.grado===g), orden).forEach(e=>lista.push(e));
  });
  if(lista.length===0){ showToast('No hay estudiantes para generar credenciales.'); return; }
  showToast('Generando credenciales…');
  let huboCambios = false;
  const idsAfectados = [];
  lista.forEach(e=>{ if(asegurarCredencialEstudiante(e)) { huboCambios = true; idsAfectados.push(e.id); } });
  if(huboCambios){
    commit(doc=>{
      idsAfectados.forEach(id=>{
        const orig = lista.find(x=>x.id===id);
        const d = doc.estudiantes.find(x=>x.id===id);
        if(d && orig){ d.usuario = orig.usuario; d.clave = orig.clave; d.claveTexto = orig.claveTexto; d.accesos = d.accesos || orig.accesos; }
      });
    });
    registrar('Estudiante', 'Generó credenciales de acceso para ' + idsAfectados.length + ' estudiante(s).');
  }
  try{
    const img = await cargarPlantillaCredencial();
    const archivos = lista.map(e=>{
      const dataUrl = dibujarCredencial(img, e.usuario, e.claveTexto || '\u2014');
      const nombreArchivo = (e.grado + ' - ' + nombresDe(e) + ' ' + apellidosDe(e))
        .replace(/[\\\/:\*\?"<>\|]/g,' ').trim() + '.png';
      return {nombre: nombreArchivo, contenido: dataUrlABytes(dataUrl)};
    });
    const bytes = crearZip(archivos);
    const blob = new Blob([bytes], {type:'application/zip'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Credenciales ' + (filtro || 'todos los grados') + '.zip';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    showToast(lista.length + ' credencial(es) descargadas en un .zip.');
  }catch(err){
    console.error(err);
    showToast('No se pudo generar la plantilla de credenciales.');
  }
  render();
}

/* Cada rotulador lleva el logo del centro escolar a la izquierda y el nombre
   del estudiante al centro. Seis por página carta vertical, en PNG. */
async function descargarRotuladores(){
  const filtro = getPref('filtroGrado','');
  const grados = filtro ? [filtro] : misGrados(currentUser);
  const lista = [];
  grados.forEach(g=>{
    ordenarEstudiantes(DB.estudiantes.filter(e=>e.grado===g), getPref('ordenEst','apellidos'))
      .forEach(e=>lista.push({nombre: (nombresDe(e) + ' ' + apellidosDe(e)).trim(), grado:g}));
  });
  if(lista.length === 0){ showToast('No hay estudiantes para rotular.'); return; }

  // La letra decorativa debe quedar IDÉNTICA sin importar el dispositivo del
  // docente: se espera a que la fuente termine de cargar antes de dibujar
  // (si no, el navegador dibuja con otra letra sin avisar) y se convierte a
  // imagen, así el PDF final ya no depende de qué fuentes tenga instaladas
  // quien lo abra después.
  try{
    await document.fonts.load('48px "Dancing Script"');
    await document.fonts.ready;
  }catch(e){ console.warn('no se pudo confirmar la carga de la fuente', e); }

  const aj = DB.ajustes || {};
  const dibujar = (logoImg)=>{
    const ESCALA = 2;                       // doble resolución para que imprima nítido
    const ANCHO = 816 * ESCALA;             // carta vertical a 96 ppp
    const ALTO  = 1056 * ESCALA;
    const paginas = [];

    for(let i = 0; i < lista.length; i += 6){
      const grupo = lista.slice(i, i + 6);
      const c = document.createElement('canvas');
      c.width = ANCHO; c.height = ALTO;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, ANCHO, ALTO);

      const margen = 30 * ESCALA;
      const alto = (ALTO - margen*2) / 6;
      const anchoCaja = ANCHO - margen*2;

      grupo.forEach((est, j)=>{
        const y = margen + alto * j;
        const h = alto - 10 * ESCALA;
        // marco del rotulador
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2 * ESCALA;
        ctx.strokeRect(margen, y + 5*ESCALA, anchoCaja, h);

        // logo a la izquierda, dentro del marco
        let xTexto = margen;
        let anchoTexto = anchoCaja;
        if(logoImg){
          const pad = 8 * ESCALA;
          const altoLogo = h - pad*2;
          const rel = logoImg.width && logoImg.height ? (logoImg.width / logoImg.height) : 1;
          const anchoLogo = altoLogo * rel;
          ctx.drawImage(logoImg, margen + pad, y + 5*ESCALA + pad, anchoLogo, altoLogo);
          xTexto = margen + pad*2 + anchoLogo;
          anchoTexto = anchoCaja - (pad*3 + anchoLogo);
        }

        // nombre centrado en el espacio que queda
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let tam = 48 * ESCALA;
        const maxAncho = anchoTexto - 20 * ESCALA;
        do {
          ctx.font = tam + 'px "Dancing Script", cursive';
          if(ctx.measureText(est.nombre).width <= maxAncho) break;
          tam -= 2 * ESCALA;
        } while(tam > 16 * ESCALA);
        ctx.fillText(est.nombre, xTexto + anchoTexto/2, y + 5*ESCALA + h/2);
      });
      paginas.push(c.toDataURL('image/png'));
    }

    const cierre = '<' + '/script>';
    const html = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">' +
    '<title>ROTULADORES ' + String(filtro || 'TODOS LOS GRADOS').toUpperCase() + '</title><style>' +
    '@page{ size: letter portrait; margin: 0; }' +
    '*{ box-sizing:border-box; } body{ margin:0; }' +
    '@media screen{ body{ background:#d8d8d8; padding:18px 0; }' +
    '  .pag{ width:215.9mm; margin:0 auto 18px; box-shadow:0 2px 12px rgba(0,0,0,.28); background:#fff; } }' +
    '@media print{ .pag{ page-break-after:always; } .pag:last-child{ page-break-after:auto; } }' +
    '.pag img{ width:100%; display:block; }' +
    '</style></head><body>' +
    paginas.map(src=>'<div class="pag"><img src="' + src + '"></div>').join('') +
    '<script>window.onload=function(){setTimeout(function(){window.print();},600);};' + cierre +
    '</body></html>';

    const v = window.open('', '_blank');
    if(!v){ showToast('El navegador bloqueó la ventana emergente. Permítela e intenta de nuevo.'); return; }
    v.document.write(html);
    v.document.close();
    showToast(paginas.length + ' página(s) de rotuladores. Elige "Guardar como PDF".');
  };

  if(aj.logo){
    const img = new Image();
    img.onload = ()=>dibujar(img);
    img.onerror = ()=>{ showToast('No se pudo cargar el logo; se generan sin él.'); dibujar(null); };
    img.src = aj.logo;
  }else{
    dibujar(null);
  }
}

    const e = DB.estudiantes.find(x=>x.id===editingId) || {id:editingId};

async function deleteStudent(id){

async function addSubject(){

  const grados = [];
  DB.config.grados.forEach((g,i)=>{

    grados.forEach(g=>{
      doc.curriculo[g] = doc.curriculo[g] || [];
      if(doc.curriculo[g].indexOf(nueva.id)<0) doc.curriculo[g].push(nueva.id);
    });
  });

function renombrarAsignatura(id, nombre){
  const limpio = (nombre||'').trim();
  const actual = DB.asignaturas.find(a=>a.id===id);
  if(!actual) return;
  if(!limpio){ showToast('La asignatura necesita un nombre.'); render(); return; }
  if(limpio === actual.nombre) return;
  if(DB.asignaturas.some(a=>a.id!==id && a.nombre.toLowerCase()===limpio.toLowerCase())){
    showToast('Ya existe una asignatura con ese nombre.');
    render();
    return;
  }
  commit(doc=>{
    const a = doc.asignaturas.find(x=>x.id===id);
    if(a) a.nombre = limpio;
  });
  showToast('Asignatura renombrada. El cambio se aplica en todo el sistema.');
  render();
}
function toggleGradoAsignatura(asigId, grado){
  const docenteAsignado = DB.docentes.some(d=>d.asignaciones.some(a=>a.grado===grado && a.asignaturaId===asigId));
  const estaba = asignaturasDeGrado(grado).some(x=>x.id===asigId);
  if(estaba && docenteAsignado){
    showToast('Primero quita la asignación del docente en la pantalla Docentes.');
    return;
  }
  commit(doc=>{
    if(!doc.curriculo) doc.curriculo = {};
    doc.curriculo[grado] = doc.curriculo[grado] || [];
    const i = doc.curriculo[grado].indexOf(asigId);
    if(i>=0) doc.curriculo[grado].splice(i,1); else doc.curriculo[grado].push(asigId);
  });
  render();
}
async function deleteSubject(id){
  if(!confirm('¿Eliminar esta asignatura? Se quitará de las asignaciones de los docentes.')) return;
  commit(doc=>{
    const i = doc.asignaturas.findIndex(x=>x.id===id);
    if(i>=0) doc.asignaturas.splice(i,1);
    doc.docentes.forEach(d=> d.asignaciones = (d.asignaciones||[]).filter(a=>a.asignaturaId!==id));
    Object.keys(doc.calificaciones).forEach(k=>{ if(k.split('|')[1]===id) delete doc.calificaciones[k]; });
    Object.keys(doc.actividades).forEach(k=>{ if(k.split('|')[1]===id) delete doc.actividades[k]; });
  });
  showToast('Asignatura eliminada.');
  render();
}

/* ============================= SEGUIMIENTO DE DOCENTES ============================= */
/* Para Dirección: de un vistazo, quién ya cargó su Hoja de tareas y sus
   calificaciones, y quién todavía no.
   - Hoja de tareas: se espera completa de antemano, para TODO el período
     que ya arrancó — no se espera a que cada fecha individual pase.
   - Calificaciones: solo se exige de lo que ya venció (no se puede
     calificar algo que todavía no pasó). */
function hoyISO(){ return new Date().toISOString().slice(0,10); }
/* Fecha de inicio de un período, configurada por Dirección (config.periodosFechas).
   Si todavía no la configuraron, se calcula como antes: la fecha de la
   primera fila de esa hoja, para no dejar el panel en blanco mientras
   tanto. */
function fechaInicioPeriodo(periodo, grado, asigId){
  const cfg = (DB.config.periodosFechas || [])[periodo-1];
  if(cfg && cfg.inicio) return cfg.inicio;
  const filasReales = getHoja(grado, asigId, periodo).filas.filter(f=>f.tipo==='tarea'||f.tipo==='integradora');
  const fechas = filasReales.map(f=>f.fecha).filter(Boolean).sort();
  return fechas[0] || '';
}
function guardarFechasPeriodos(){
  const fechas = [1,2,3,4].map(p=>{
    const el = document.getElementById('per_inicio_' + p);
    return {inicio: el ? el.value : ''};
  });
  commit(doc=>{
    doc.config = doc.config || {};
    doc.config.periodosFechas = fechas;
  });
  registrar('Personalizar', 'Actualizó las fechas de inicio de los períodos');
  showToast('Fechas guardadas.');
  render();
}
function evaluarAsignacionSeguimiento(grado, asigId){
  const hoy = hoyISO();
  const estudiantesGrado = DB.estudiantes.filter(e=>e.grado===grado);
  let huboFilasPasadas = false, hojaPendiente = false, califPendiente = false;
  let filasPendHoja = 0, filasPendCalif = 0, filasTotal = 0, huboPeriodoEnCurso = false;
  for(let periodo=1; periodo<=(DB.config.periodos||4); periodo++){
    const hoja = getHoja(grado, asigId, periodo);
    const filasT = filasTarea(grado, asigId, periodo);
    const filasI = filasIntegradora(grado, asigId, periodo);
    const filasReales = hoja.filas.filter(f=>f.tipo==='tarea' || f.tipo==='integradora');
    if(filasReales.length===0) continue;
    // ¿Este período ya arrancó? Se usa la fecha que configuró Dirección; si
    // todavía no la configuraron, se calcula de las fechas ya cargadas.
    const inicio = fechaInicioPeriodo(periodo, grado, asigId);
    const periodoEnCurso = !!inicio && inicio<=hoy;
    if(!periodoEnCurso) continue;
    huboPeriodoEnCurso = true;
    filasReales.forEach(f=>{
      filasTotal++;
      // Hoja de tareas: toda la fila debe estar llena, sin importar su fecha.
      // Para integradoras, "Contenido" y "Tarea" son los campos con texto
      // real que escribe el docente (la Etiqueta se autocompleta sola al
      // crear la fila, así que no cuenta como contenido real).
      const sinTexto = f.tipo==='tarea'
        ? !(f.contenido||'').trim() && !(f.tarea||'').trim()
        : !(f.tarea||'').trim() && !(f.contenido||'').trim();
      if(sinTexto){ hojaPendiente = true; filasPendHoja++; }
      // Calificaciones: solo se exige de las fechas que ya vencieron.
      if(!f.fecha || f.fecha>hoy) return;
      huboFilasPasadas = true;
      let comp = null;
      if(f.tipo==='tarea'){
        const idx = filasT.indexOf(f);
        if(idx>=0) comp = 'act:act' + (idx+1);
      }else{
        const idx = filasI.indexOf(f);
        if(idx>=0) comp = 'integradora' + (idx+1);
      }
      if(comp && estudiantesGrado.length>0){
        const hayNota = estudiantesGrado.some(e=>{
          const v = getComp(e.id, asigId, periodo, comp);
          return v!==undefined && v!==null && v!=='';
        });
        if(!hayNota){ califPendiente = true; filasPendCalif++; }
      }
    });
  }
  return {huboFilasPasadas, huboPeriodoEnCurso, hojaPendiente, califPendiente, filasPendHoja, filasPendCalif, filasTotal};
}
function evaluarDocenteSeguimiento(docente){
  const asignaciones = (docente.asignaciones||[]).map(a=>{
    const ev = evaluarAsignacionSeguimiento(a.grado, a.asignaturaId);
    const asig = DB.asignaturas.find(x=>x.id===a.asignaturaId);
    return Object.assign({grado:a.grado, asignaturaId:a.asignaturaId, asignaturaNombre: asig?asig.nombre:a.asignaturaId}, ev);
  });
  const hojaPendiente = asignaciones.some(a=>a.hojaPendiente);
  const califPendiente = asignaciones.some(a=>a.califPendiente);
  return {asignaciones, hojaPendiente, califPendiente};
}

/* Convierte a alguien YA CARGADO en cuenta de acceso total, conservando su
   mismo usuario y contraseña — no crea una cuenta nueva. */
function darAccesoTotal(id){
  if(!isAdmin(currentUser)){ showToast('Solo un usuario de acceso total puede hacer esto.'); return; }
  const t = DB.docentes.find(x=>x.id===id);
  if(!t) return;
  if(!confirm(`¿Dar acceso total a ${t.nombre}? Va a poder ver y editar todo el sistema, con su mismo usuario y contraseña.`)) return;
  const dom = prompt('Nombre del dominio para esta cuenta (ej.: Subdirección, Coordinación Académica):');
  if(dom === null) return;
  const nombreDominio = dom.trim();
  if(!nombreDominio){ showToast('Escribe el nombre del dominio.'); return; }
  commit(doc=>{
    const d = doc.docentes.find(x=>x.id===id);
    if(!d) return;
    d.tipo = 'admin';
    d.dominio = uid('dom');
    d.dominioNombre = nombreDominio;
  });
  registrar('Docentes', 'Le dio acceso total a ' + t.nombre);
  showToast(t.nombre + ' ahora tiene acceso total.');
  closeModal();
  render();
}
/* Camino inverso: vuelve a ser un docente normal, conservando su usuario,
   contraseña y asignaturas de antes de tener acceso total. */
function quitarAccesoTotal(id){
  if(!isAdmin(currentUser)){ showToast('Solo un usuario de acceso total puede hacer esto.'); return; }
  const t = DB.docentes.find(x=>x.id===id);
  if(!t) return;
  if(t.dominio === 'direccion'){ showToast('El dominio de Dirección no se puede quitar.'); return; }
  if(!confirm(`¿Quitarle el acceso total a ${t.nombre}? Va a volver a ser un docente normal.`)) return;
  commit(doc=>{
    const d = doc.docentes.find(x=>x.id===id);
    if(!d) return;
    d.tipo = 'docente';
    d.dominio = null;
    d.dominioNombre = '';
  });
  registrar('Docentes', 'Le quitó el acceso total a ' + t.nombre);
  showToast('Acceso total retirado.');
  closeModal();
  render();
}
function agregarDominio(){
  if(!isAdmin(currentUser)) return;
  const persona = prompt('Nombre de la persona a cargo (ej.: Lic. Rosa Méndez):');
  if(persona === null) return;
  const nombrePersona = persona.trim();
  if(!nombrePersona){ showToast('Escribe el nombre de la persona.'); return; }
  const dom = prompt('Nombre del dominio (ej.: Subdirección, Consejo Académico):');
  if(dom === null) return;
  const nombreDominio = dom.trim();
  if(!nombreDominio){ showToast('Escribe el nombre del dominio.'); return; }
  const nuevo = {id:uid('t'), nombre:nombrePersona, tipo:'admin', dominio:uid('dom'),
    dominioNombre:nombreDominio, asignaciones:[], orientacion:null};
  nuevo.usuario = generarUsuarioDocente(nombrePersona, nuevo.id);
  commit(doc=>{ doc.docentes.push(nuevo); });
  showToast('Dominio agregado con acceso total.');
  render();
}
function renombrarDominio(id, nombre){
  const limpio = (nombre||'').trim();
  const t = DB.docentes.find(x=>x.id===id);
  if(!t) return;
  if(t.dominio === 'direccion'){ showToast('El dominio de Dirección no se puede renombrar.'); render(); return; }
  if(!limpio){ showToast('El dominio necesita un nombre.'); render(); return; }
  commit(doc=>{
    const d = doc.docentes.find(x=>x.id===id);
    if(d) d.dominioNombre = limpio;
  });
  showToast('Dominio renombrado.');
  render();
}
function eliminarDominio(id){
  const t = DB.docentes.find(x=>x.id===id);
  if(!t) return;
  if(t.dominio === 'direccion'){ showToast('El dominio de Dirección no se puede eliminar.'); return; }
  if(id === currentUser.id){ showToast('No puedes eliminar tu propia cuenta mientras la usas.'); return; }
  if(!confirm('¿Eliminar la cuenta de "' + t.nombre + '" (' + domainLabel(t) + ')?')) return;
  commit(doc=>{
    const i = doc.docentes.findIndex(x=>x.id===id);
    if(i>=0) doc.docentes.splice(i,1);
  });
  showToast('Dominio eliminado.');
  render();
}
function cambiarPanel(id, panelId, nivel){
  commit(doc=>{

    if(t.soloLectura && nivel === 'editar' && panelId !== 'reportes') nivel = 'ver';

  });
  render();

async function addAsigToModal(){
  const asigId = document.getElementById('new_asig_select').value;
  const grado = document.getElementById('new_grado_select').value;
  viewState.selAsig = asigId;    // se conservan tras redibujar el formulario
  viewState.selGrado = grado;
  const t = editingId ? DB.docentes.find(x=>x.id===editingId) : null;
  if(!t){ showToast('Guarda el docente primero para agregar asignaturas.'); return; }
  if(t.asignaciones.some(a=>a.grado===grado && a.asignaturaId===asigId)){ showToast('Esa asignación ya existe.'); return; }
  const objetivo = editingId;
  commit(doc=>{
    const d = doc.docentes.find(x=>x.id===objetivo);
    if(d){
      d.asignaciones = d.asignaciones||[];
      if(!d.asignaciones.some(a=>a.grado===grado && a.asignaturaId===asigId)) d.asignaciones.push({grado, asignaturaId:asigId});
    }
  });
  render();
}
async function removeAsigFromModal(index){
  const actual = DB.docentes.find(x=>x.id===editingId);
  if(!actual || !actual.asignaciones[index]) return;
  const {grado, asignaturaId} = actual.asignaciones[index];
  const objetivo = editingId;
  commit(doc=>{
    const d = doc.docentes.find(x=>x.id===objetivo);
    if(d) d.asignaciones = (d.asignaciones||[]).filter(a=>!(a.grado===grado && a.asignaturaId===asignaturaId));
  });
  render();
}
async function saveTeacher(esAdmin){
  // Evita usuarios duplicados si se hace clic varias veces seguidas
  // (mismo motivo que en guardarReporte: internet lento y clics repetidos).
  if(saveTeacher._enCurso) return;
  saveTeacher._enCurso = true;
  setTimeout(()=>{ saveTeacher._enCurso = false; }, 1500);
  const nombre = document.getElementById('t_nombre').value.trim();
  if(!nombre){ showToast('Escribe el nombre del usuario.'); saveTeacher._enCurso = false; return; }
  if(editingId){
    const objetivoActual = DB.docentes.find(x=>x.id===editingId);
    if(objetivoActual && esPropietario(objetivoActual) && !(currentUser && currentUser.id===objetivoActual.id)){
      showToast('Esta cuenta no se puede editar.'); saveTeacher._enCurso = false; return;
    }
  }
  const leerEl = id => document.getElementById(id);
  const campoCargo = leerEl('t_cargo');
  const cargo = campoCargo ? campoCargo.value.trim() : '';
  const campoFrasePersonal = leerEl('t_frase_personal');
  const frasePersonal = campoFrasePersonal ? campoFrasePersonal.value.trim() : '';
  const campoMensajePersonal = leerEl('t_mensaje_personal');
  const mensajePersonal = campoMensajePersonal ? campoMensajePersonal.value.trim() : '';
  const chkLectura = leerEl('t_lectura');
  const chkAlcance = leerEl('t_alcance');
  const soloLectura = chkLectura ? !!chkLectura.checked : false;
  const alcanceTotal = chkAlcance ? !!chkAlcance.checked : false;
  const paneles = {};
  PANELES.forEach(p=>{
    const sel = leerEl('t_pan_'+p.id);
    if(sel){
      let v = sel.value;
      if(soloLectura && v === 'editar') v = 'ver';
      paneles[p.id] = v;
    }
  });
  const orientaciones = [];
  DB.config.grados.forEach((g,i)=>{
    const chk = document.getElementById('t_ori_'+i);
    if(chk && chk.checked) orientaciones.push(g);
  });
  if(editingId){
    const objetivo = editingId;
    commit(doc=>{
      const t = doc.docentes.find(x=>x.id===objetivo);
      if(t){
        t.nombre = nombre;
        if(frasePersonal) t.fraseSaludoPersonal = frasePersonal; else delete t.fraseSaludoPersonal;
        if(mensajePersonal) t.mensajeBienvenidaPersonal = mensajePersonal; else delete t.mensajeBienvenidaPersonal;
        if(!esAdmin){
          t.orientaciones = orientaciones; delete t.orientacion;
          t.cargo = cargo;
          if(soloLectura) t.soloLectura = true; else delete t.soloLectura;
          if(alcanceTotal) t.alcanceTotal = true; else delete t.alcanceTotal;
          if(Object.keys(paneles).length) t.paneles = paneles;
        }
      }
    });
  }else{
    const nuevo = {id:uid('t'), nombre, tipo:'docente', dominio:null, asignaciones:[], orientaciones:orientaciones,
      cargo: cargo, paneles: Object.keys(paneles).length ? paneles : undefined};
    if(frasePersonal) nuevo.fraseSaludoPersonal = frasePersonal;
    if(mensajePersonal) nuevo.mensajeBienvenidaPersonal = mensajePersonal;
    nuevo.usuario = generarUsuarioDocente(nombre, nuevo.id);
    if(soloLectura) nuevo.soloLectura = true;
    if(alcanceTotal) nuevo.alcanceTotal = true;
    commit(doc=>{ doc.docentes.push(nuevo); });
  }
  registrar('Usuario', (editingId?'Editó a ':'Creó a ') + nombre);
  showToast('Usuario guardado.');
  closeModal();
}
async function deleteTeacher(id){
  const t = DB.docentes.find(x=>x.id===id);
  if(t && t.tipo==='admin'){ showToast('No se pueden eliminar las cuentas de dominio.'); return; }
  if(t && esPropietario(t)){ showToast('Esta cuenta no se puede eliminar.'); return; }
  if(id === currentUser.id){ showToast('No puedes eliminar tu propia cuenta mientras la usas.'); return; }
  if(!confirm('¿Eliminar este usuario?')) return;
  commit(doc=>{
    const i = doc.docentes.findIndex(x=>x.id===id);
    if(i>=0) doc.docentes.splice(i,1);
  });
  showToast('Usuario eliminado.');
  render();
}

function renderManualConvivencia(){
  const f1 = opcionesF1(), f2 = opcionesF2();
  const aLineas = arr => (arr||[]).join('\n');
  return `

    <p class="card-title">Manual de convivencia — categorías de faltas</p>
    <div class="note" style="margin-bottom:14px;">
      Escribe una categoría por línea (copia y pega directo desde tu manual de convivencia).
      No hace falta escribir "Otros" — el sistema siempre lo agrega al final por si un maestro
      necesita registrar una falta que no está en tu lista.
    </div>
    <p class="card-title" style="font-size:13px; margin-top:10px;">Falta leve (Formato F1)</p>
    <div class="grid grid-2">
      <div class="field"><label>Situaciones</label>
        <textarea id="mc_f1_sit" rows="6">${esc(aLineas(f1.situacion.filter(s=>s.toLowerCase()!=='otros')))}</textarea></div>
      <div class="field"><label>Antecedentes</label>
        <textarea id="mc_f1_ant" rows="6">${esc(aLineas(f1.antecedentes.filter(s=>s.toLowerCase()!=='otros')))}</textarea></div>
    </div>
    <div class="field"><label>Acciones tomadas al intervenir</label>
      <textarea id="mc_f1_acc" rows="4">${esc(aLineas(f1.acciones.filter(s=>s.toLowerCase()!=='otras')))}</textarea></div>

    <p class="card-title" style="font-size:13px; margin-top:18px;">Falta grave (Formato F2)</p>
    <div class="grid grid-2">
      <div class="field"><label>Situaciones</label>
        <textarea id="mc_f2_sit" rows="6">${esc(aLineas(f2.situacion.filter(s=>s.toLowerCase()!=='otro')))}</textarea></div>
      <div class="field"><label>Antecedentes</label>
        <textarea id="mc_f2_ant" rows="6">${esc(aLineas(f2.antecedentes.filter(s=>s.toLowerCase()!=='otro')))}</textarea></div>
    </div>

    <p class="card-title" style="font-size:13px; margin-top:18px;">Artículos o normas del manual de convivencia</p>
    <div class="note" style="margin-bottom:10px;">
      Esto es aparte de las categorías de arriba: es la lista que aparece como desplegable en
      "Nuevo reporte" para que el maestro indique a qué artículo o norma específica se refiere
      el hecho. Un artículo por línea, por ejemplo: <i>Art. 12 — Respeto a la comunidad educativa</i>.
      Si lo dejas vacío, ese desplegable simplemente no aparece en el formulario.
    </div>
    <div class="field"><label>Artículos</label>
      <textarea id="mc_articulos" rows="6" placeholder="Ej.: Art. 12 — Respeto a la comunidad educativa">${esc(aLineas(DB.ajustes && DB.ajustes.manualArticulos))}</textarea></div>

    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-primary" onclick="guardarManualConvivencia()">Guardar manual de convivencia</button>
      <button class="btn btn-danger" onclick="restablecerManualConvivencia()">Restablecer a los valores originales</button>
    </div>
  </div>`;
}
function guardarManualConvivencia(){
  const lineas = id => (document.getElementById(id).value || '')
    .split('\n').map(s=>s.trim()).filter(Boolean);
  DB.ajustes = DB.ajustes || {};
  commit(doc=>{
    doc.ajustes = doc.ajustes || {};
    doc.ajustes.manualF1 = {
      situacion: lineas('mc_f1_sit'),
      antecedentes: lineas('mc_f1_ant'),
      acciones: lineas('mc_f1_acc')
    };
    doc.ajustes.manualF2 = {
      situacion: lineas('mc_f2_sit'),
      antecedentes: lineas('mc_f2_ant')
    };
    doc.ajustes.manualArticulos = lineas('mc_articulos');
  });
  registrar('Personalizar', 'Actualizó el manual de convivencia');
  showToast('Manual de convivencia guardado.');
  render();
}
function restablecerManualConvivencia(){
  if(!confirm('¿Volver a las categorías de faltas originales del sistema? Se perderán las que hayas personalizado.')) return;
  commit(doc=>{
    if(doc.ajustes){ delete doc.ajustes.manualF1; delete doc.ajustes.manualF2; delete doc.ajustes.manualArticulos; }
  });
  showToast('Se restablecieron los valores originales.');
  render();
}

              <input type="number" id="rb_peso_${i}" min="0" max="100" step="1"
                value="${Math.round(r.peso*100)}" style="max-width:80px;text-align:center;" oninput="previewPesos()">
              <span style="color:var(--muted);">%</span></div></td>
            <td><label class="check-chip"><input type="checkbox" id="rb_tar_${i}" ${r.tarea?'checked':''}> Con fecha</label></td>
            <td><label class="check-chip"><input type="checkbox" id="rb_rec_${i}" ${r.conRecuperacion?'checked':''}> Recuperación</label></td>
            <td><button class="btn btn-sm btn-danger" onclick="quitarRubro(${i})">Quitar</button></td>
          </tr>`).join('')}
      </tbody>
      <tfoot><tr>
        <td style="font-weight:600;">Total</td>
        <td><span id="pw_total" class="pill ${ok?'pill-primary':'pill-rojo'}">${suma}%</span></td>
        <td colspan="3"></td>
      </tr></tfoot>
    </table>
    </div>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-primary" onclick="guardarPesos()">Guardar ponderación</button>
      <button class="btn" onclick="agregarRubro()">+ Agregar rubro</button>
    </div>
    ${!ok?`<div class="note" style="margin:14px 0 0; border-left-color:var(--red);">Los porcentajes deben sumar 100% para poder guardar. Ahora suman ${suma}%.</div>`:''}
  </div>`;
}
/* Lee la tabla tal como está en pantalla, sin perder lo que el usuario acaba de escribir */
function leerPonderacionFormulario(){
  const lista = rubrosActivos();
  const elAct = document.getElementById('pw_actividades');
  const actividades = elAct ? Math.max(0, Math.min(100, Number(elAct.value)||0)) : Math.round(pesoDe('actividades')*100);
  let suma = actividades;
  const rubros = lista.map((r,i)=>{
    const nom = document.getElementById('rb_nom_'+i);
    const pes = document.getElementById('rb_peso_'+i);
    const tar = document.getElementById('rb_tar_'+i);
    const rec = document.getElementById('rb_rec_'+i);
    const peso = pes ? Math.max(0, Math.min(100, Number(pes.value)||0)) : Math.round(r.peso*100);
    suma += peso;
    return {key:r.key, nombre: nom ? nom.value.trim() : r.nombre, pesoPct:peso,
      tarea: tar ? !!tar.checked : !!r.tarea,
      conRecuperacion: rec ? !!rec.checked : !!r.conRecuperacion};
  });
  return {actividades, rubros, suma};
}
function previewPesos(){
  const {suma} = leerPonderacionFormulario();
  const el = document.getElementById('pw_total');
  if(el){
    el.textContent = suma + '%';
    el.className = 'pill ' + (suma===100 ? 'pill-primary' : 'pill-rojo');
  }
}
function aplicarPonderacion(actividades, rubros){
  commit(doc=>{
    doc.config = doc.config || {};
    doc.config.pesos = {actividades: actividades/100};
    doc.config.rubros = rubros.map(r=>({key:r.key, nombre:r.nombre, peso:r.pesoPct/100, tarea:r.tarea, conRecuperacion:r.conRecuperacion}));
  });
}
function agregarRubro(){
  const {actividades, rubros} = leerPonderacionFormulario();
  rubros.push({key:uid('rb'), nombre:'Nuevo rubro', pesoPct:0, tarea:false, conRecuperacion:false});
  aplicarPonderacion(actividades, rubros);
  showToast('Rubro agregado. Ponle nombre y porcentaje, luego guarda.');
  render();
}
function quitarRubro(indice){
  const lista = rubrosActivos();
  const r = lista[indice];
  if(!r) return;
  if(lista.length <= 1){ showToast('Debe quedar al menos un rubro además de Actividades.'); return; }
  const usos = Object.keys(DB.calificaciones||{}).filter(k=>k.split('|')[3]===r.key).length;
  const aviso = usos>0
    ? '¿Quitar el rubro "'+r.nombre+'"? Se borrarán '+usos+' nota(s) ya cargada(s) en él y no se pueden recuperar.'
    : '¿Quitar el rubro "'+r.nombre+'"?';
  if(!confirm(aviso)) return;
  const {actividades, rubros} = leerPonderacionFormulario();
  const restantes = rubros.filter((x,i)=>i!==indice);
  commit(doc=>{
    doc.config = doc.config || {};
    doc.config.pesos = {actividades: actividades/100};
    doc.config.rubros = restantes.map(x=>({key:x.key, nombre:x.nombre, peso:x.pesoPct/100, tarea:x.tarea, conRecuperacion:x.conRecuperacion}));
    ['calificaciones','observaciones','estados'].forEach(mapa=>{
      if(!doc[mapa]) return;
      Object.keys(doc[mapa]).forEach(k=>{
        const c = k.split('|')[3];
        if(c===r.key || c===claveRecuperacion(r.key)) delete doc[mapa][k];
      });
    });
    if(doc.tareas) Object.keys(doc.tareas).forEach(k=>{ if(k.split('|')[2]===r.key) delete doc.tareas[k]; });
    if(doc.rubros) Object.keys(doc.rubros).forEach(k=>{ if(k.split('|')[2]===r.key) delete doc.rubros[k]; });
  });
  showToast('Rubro quitado. Revisa que los porcentajes sumen 100%.');
  render();
}
function guardarPesos(){
  const {actividades, rubros, suma} = leerPonderacionFormulario();
  if(rubros.some(r=>!r.nombre)){ showToast('Todos los rubros deben tener nombre.'); return; }
  if(suma !== 100){
    showToast('Los porcentajes deben sumar exactamente 100%. Ahora suman ' + suma + '%.');
    return;
  }
  aplicarPonderacion(actividades, rubros);
  registrar('Ponderación', 'Cambió los porcentajes del período');
  showToast('Ponderación guardada. Las notas se recalcularon.');
  render();
}

function agregarGrado(){
  const campo = document.getElementById('nuevo_grado');
  const nombre = campo.value.trim();
  if(!nombre){ showToast('Escribe el nombre del grado.'); return; }
  if((DB.config.grados||[]).some(g=>g.toLowerCase()===nombre.toLowerCase())){
    showToast('Ese grado ya existe.'); return;
  }
  commit(doc=>{
    doc.config = doc.config || {};
    doc.config.grados = doc.config.grados || [];
    doc.config.grados.push(nombre);
    doc.curriculo = doc.curriculo || {};
    doc.curriculo[nombre] = doc.curriculo[nombre] || [];
  });
  campo.value = '';
  showToast('Grado agregado.');
  render();
}
function moverGrado(i, dir){
  const destino = i + dir;
  commit(doc=>{
    const g = doc.config.grados;
    if(destino < 0 || destino >= g.length) return;
    const tmp = g[i]; g[i] = g[destino]; g[destino] = tmp;
  });
  render();
}
/* Renombrar arrastra el cambio a estudiantes, docentes, currículo, actividades y tareas */
function renombrarGrado(i, nuevo){
  const limpio = (nuevo||'').trim();
  const anterior = DB.config.grados[i];
  if(!limpio || limpio === anterior){ render(); return; }
  if(DB.config.grados.some((g,j)=>j!==i && g.toLowerCase()===limpio.toLowerCase())){
    showToast('Ya existe un grado con ese nombre.');
    render();
    return;
  }
  commit(doc=>{
    doc.config.grados[i] = limpio;
    (doc.estudiantes||[]).forEach(e=>{ if(e.grado===anterior) e.grado = limpio; });
    (doc.docentes||[]).forEach(d=>{
      if(Array.isArray(d.orientaciones)) d.orientaciones = d.orientaciones.map(x=>x===anterior?limpio:x);
      if(d.orientacion===anterior) d.orientacion = limpio;
      (d.asignaciones||[]).forEach(a=>{ if(a.grado===anterior) a.grado = limpio; });
    });
    if(doc.curriculo && doc.curriculo[anterior]){
      doc.curriculo[limpio] = doc.curriculo[anterior];
      delete doc.curriculo[anterior];
    }
    ['actividades','tareas','rubros'].forEach(mapa=>{
      if(!doc[mapa]) return;
      Object.keys(doc[mapa]).forEach(k=>{
        const p = k.split('|');
        if(p[0] === anterior){
          p[0] = limpio;
          doc[mapa][p.join('|')] = doc[mapa][k];
          delete doc[mapa][k];
        }
      });
    });
  });
  showToast('Grado renombrado en todo el sistema.');
  render();
}
function eliminarGrado(i){
  const g = DB.config.grados[i];
  const cuantos = DB.estudiantes.filter(e=>e.grado===g).length;
  if(cuantos > 0){
    showToast('No se puede eliminar: hay ' + cuantos + ' estudiante(s) en ese grado. Muévelos primero.');
    return;
  }
  if(!confirm('¿Eliminar el grado "' + g + '"? También se quitarán las asignaciones de docentes a ese grado.')) return;
  commit(doc=>{
    doc.config.grados.splice(i,1);
    if(doc.curriculo) delete doc.curriculo[g];
    (doc.docentes||[]).forEach(d=>{
      if(Array.isArray(d.orientaciones)) d.orientaciones = d.orientaciones.filter(x=>x!==g);
      if(d.orientacion===g) d.orientacion = null;
      d.asignaciones = (d.asignaciones||[]).filter(a=>a.grado!==g);
    });
    ['actividades','tareas','rubros'].forEach(mapa=>{
      if(!doc[mapa]) return;
      Object.keys(doc[mapa]).forEach(k=>{ if(k.split('|')[0] === g) delete doc[mapa][k]; });
    });
  });
  showToast('Grado eliminado.');
  render();
}

function ejecutarCierre(){
  if(document.getElementById('c_confirma').value.trim().toUpperCase() !== 'CERRAR'){
    showToast('Escribe la palabra CERRAR para confirmar.');
    return;
  }
  const grados = DB.config.grados;
  const anioNuevo = document.getElementById('c_anio').value.trim() || String(new Date().getFullYear()+1);
  const destino = {};
  grados.forEach((g,i)=>{
    const v = document.getElementById('c_dest_'+i).value;
    if(v === 'egresa') destino[g] = null;
    else if(v === 'queda') destino[g] = g;
    else destino[g] = grados[Number(v)] || g;
  });
  let promovidos = 0, egresados = 0;
  commit(doc=>{
    doc.calificaciones = {};
    doc.estados = {};
    doc.observaciones = {};
    doc.tareas = {};
    doc.estudiantes = (doc.estudiantes||[]).filter(e=>{
      const d = destino[e.grado];
      if(d === null || d === undefined){ egresados++; return false; }
      if(d !== e.grado) promovidos++;
      e.grado = d;
      return true;
    });
    doc.ajustes = doc.ajustes || {};
    doc.ajustes.anio = anioNuevo;
  });
  viewState.cierre = null;
  render();
  registrar('Cierre de año', 'Cerró el año y promovió a los estudiantes');
  showToast('Año cerrado. ' + promovidos + ' promovido(s), ' + egresados + ' egresado(s). Ya puedes trabajar el ' + anioNuevo + '.');
}

function guardarAjustes(){
  const leer = id => { const el = document.getElementById(id); return el ? String(el.value).trim() : null; };
  const nombre = leer('aj_nombre') || 'Centro Escolar';
  const anio = leer('aj_anio');
  const frase = leer('aj_frase');
  const mensaje = leer('aj_mensaje');
  const siglas = leer('aj_siglas');
  const mensajeAnterior = (DB.ajustes && DB.ajustes.mensajeBienvenida) || '';
  commit(doc=>{

    doc.ajustes.nombreColegio = nombre;
    if(anio !== null) doc.ajustes.anio = anio;
    if(frase !== null) doc.ajustes.fraseSaludo = frase;

function subirLogo(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    if(f.size > 200*1024){ showToast('La imagen supera 200 KB. Usa una más pequeña.'); return; }
    const lector = new FileReader();
    lector.onload = () => {
      commit(doc=>{ doc.ajustes = doc.ajustes || {}; doc.ajustes.logo = lector.result; });
      showToast('Logo actualizado.');
      render();
    };
    lector.readAsDataURL(f);
  };
  inp.click();
}

  u = u || currentUser;

  if(!puedeEditarPanel(u, 'estudiantes')) return false;
  return isAdmin(u) || u.permisoEstudiantes === true;
}

   grado aunque no tenga permiso completo para agregar/editar estudiantes. */
function puedeDescargarCredenciales(u){
  u = u || currentUser;
  if(!u || u.soloLectura) return false;
  if(!puedeVerPanel(u, 'estudiantes')) return false;
  return puedeGestionarEstudiantes(u) || orientacionesDe(u).length > 0;
}
function definirClave(id){
  const t0 = DB.docentes.find(x=>x.id===id);
  if(t0 && esPropietario(t0)){ showToast('Esta cuenta no se puede modificar desde aquí.'); return; }
  const campo = document.getElementById('cl_'+id);
  const txt = campo.value.trim();
  if(txt.length < 4){ showToast('La contraseña debe tener al menos 4 caracteres.'); return; }
  const h = hashClave(txt);
  commit(doc=>{
    const t = doc.docentes.find(x=>x.id===id);

}
function regenerarUsuarioDocente(id){

/* Cada usuario cambia la suya desde "Mi cuenta" */
function cambiarMiClave(){
  const actual = document.getElementById('mi_actual');
  const nueva = document.getElementById('mi_nueva').value.trim();
  const repetir = document.getElementById('mi_repetir').value.trim();
  if(tieneClave(currentUser)){
    if(!actual || hashClave(actual.value.trim()) !== currentUser.clave){
      showToast('La contraseña actual no es correcta.');
      return;
    }
  }
  if(nueva.length < 4){ showToast('La nueva contraseña debe tener al menos 4 caracteres.'); return; }
  if(nueva !== repetir){ showToast('Las dos contraseñas nuevas no coinciden.'); return; }
  const h = hashClave(nueva);
  const yo = currentUser.id;
  commit(doc=>{
    const t = doc.docentes.find(x=>x.id===yo);
    if(t){ t.clave = h; t.claveTexto = nueva; }
  });
  viewState.abrirClave = false;
  showToast('Tu contraseña quedó actualizada.');
  render();
}
function quitarMiClave(){
  if(!confirm('¿Quitar tu contraseña? Entrarás solo con seleccionar tu nombre.')) return;
  const yo = currentUser.id;
  commit(doc=>{
    const t = doc.docentes.find(x=>x.id===yo);
    if(t){ delete t.clave; delete t.claveTexto; }
  });
  viewState.abrirClave = false;
  showToast('Contraseña eliminada.');
  render();
}

/* Configuración de la boleta: se guarda una vez y queda como valor por defecto
   para todas las siguientes. Cada edición reemplaza a la anterior. */
const BOLETA_DEF = {
  casillasPadres: ['Relación padre de familia / escuela','Asistencia a reuniones',
    'Responsabilidad con la escuela','Aportes a la escuela','Escuela de Padres'],
  conducta: ['Valores Cristianos','Acepta y Valora la Diversidad',
    'Toma decisiones de forma autónoma y responsable',
    'Se expresa y participa con respeto por nuestra cultura',
    'Evidencia actitudes favorables para la convivencia y cultura de paz'],
  escala: [{nombre:'EXCELENTE', rango:'90-100'},{nombre:'MUY BUENO', rango:'80-89'},
    {nombre:'BUENO', rango:'70-79'},{nombre:'REPROBADO', rango:'0-69'}],
  firmas: [{nombre:'', cargo:'Coordinadora Académica'},{nombre:'', cargo:'Directora'},
    {nombre:'', cargo:'Orientadora de grado'}]
};
function boletaCfg(){
  const c = (DB.config && DB.config.boleta) || {};
  return {
    casillasPadres: Array.isArray(c.casillasPadres) ? c.casillasPadres : BOLETA_DEF.casillasPadres.slice(),
    conducta:       Array.isArray(c.conducta)       ? c.conducta       : BOLETA_DEF.conducta.slice(),
    escala:         Array.isArray(c.escala)         ? c.escala         : BOLETA_DEF.escala.map(x=>Object.assign({},x)),
    firmas:         Array.isArray(c.firmas)         ? c.firmas         : BOLETA_DEF.firmas.map(x=>Object.assign({},x))
  };
}
function guardarBoletaCfg(mutador){
  const actual = boletaCfg();
  mutador(actual);
  commit(doc=>{
    doc.config = doc.config || {};
    doc.config.boleta = actual;
  });
}
/* Datos propios de cada estudiante dentro de la boleta */
function boletaDatos(estId){
  const d = (DB.boletaDatos || {})[estId] || {};
  return {
    padres: d.padres || {}, conducta: d.conducta || {},
    notaConducta: d.notaConducta || {}, inasistencias: d.inasistencias || {},
    observaciones: d.observaciones || ''
  };
}
function setBoletaDato(estId, grupo, clave, valor){
  commit(doc=>{
    doc.boletaDatos = doc.boletaDatos || {};
    doc.boletaDatos[estId] = doc.boletaDatos[estId] || {};
    if(grupo === 'observaciones'){ doc.boletaDatos[estId].observaciones = valor; return; }
    doc.boletaDatos[estId][grupo] = doc.boletaDatos[estId][grupo] || {};
    if(valor === '' || valor === null) delete doc.boletaDatos[estId][grupo][clave];
    else doc.boletaDatos[estId][grupo][clave] = valor;
  });
}
function puedeEditarBoleta(grado){
  return puedeEditarPanel(currentUser, 'boletas') &&
    (isAdmin(currentUser) || esOrientador(currentUser, grado));
}
/* Promedio del aula-estudiante en un período, sobre todas sus asignaturas */
function promedioPeriodoEstudiante(estId, grado, periodo){
  const vals = asignaturasDeGrado(grado)
    .map(a=>periodInfo(estId, a.id, periodo, grado).valor)
    .filter(v=>v!==null);
  if(vals.length===0) return null;
  return vals.reduce((s,v)=>s+v,0)/vals.length;
}

/* Tabla de criterios con su casilla de letra, ambos editables */
function bloqueCriterios(titulo, lista, valores, estId, grupo, edit){
  return `
  <table class="bol-mini">
    <thead><tr><th colspan="${edit?3:2}">${esc(titulo)}</th></tr></thead>
    <tbody>
      ${lista.map((txt,i)=>`
        <tr>
          <td>${edit
            ? `<input class="bol-in" value="${esc(txt)}" onchange="editarCriterio('${grupo}',${i},this.value)">`
            : esc(txt)}</td>
          <td class="bol-num col-valor">${edit
            ? `<input class="bol-in" style="text-align:center;" value="${esc(valores[i]||'')}"
                 onchange="setBoletaDato('${estId}','${grupo}','${i}',this.value)">`
            : esc(valores[i]||'')}</td>
          ${edit?`<td class="col-x"><button class="icon-btn" onclick="quitarCriterio('${grupo}',${i})">×</button></td>`:''}
        </tr>`).join('')}
    </tbody>
  </table>
  ${edit?`<div class="btn-row" style="margin:-2px 0 4px;"><button class="btn btn-sm" onclick="agregarCriterio('${grupo}')">+ Agregar criterio</button></div>`:''}`;
}
function editarCriterio(grupo, i, valor){
  const limpio = (valor||'').trim();
  if(!limpio) return;
  guardarBoletaCfg(c=>{ const lista = grupo==='padres' ? c.casillasPadres : c.conducta; lista[i] = limpio; });
  render();
}
function agregarCriterio(grupo){
  guardarBoletaCfg(c=>{ (grupo==='padres' ? c.casillasPadres : c.conducta).push('Nuevo criterio'); });
  render();
}
function quitarCriterio(grupo, i){
  guardarBoletaCfg(c=>{ (grupo==='padres' ? c.casillasPadres : c.conducta).splice(i,1); });
  render();
}
function editarEscala(i, campo, valor){
  guardarBoletaCfg(c=>{ if(c.escala[i]) c.escala[i][campo] = (valor||'').trim(); });
  render();
}
function agregarEscala(){
  guardarBoletaCfg(c=>{ c.escala.push({nombre:'NUEVO NIVEL', rango:'0-0'}); });
  render();
}
function quitarEscala(i){
  guardarBoletaCfg(c=>{ c.escala.splice(i,1); });
  render();
}
function editarFirma(i, campo, valor){
  guardarBoletaCfg(c=>{ if(c.firmas[i]) c.firmas[i][campo] = (valor||'').trim(); });
  render();
}
function agregarFirma(){
  guardarBoletaCfg(c=>{ c.firmas.push({nombre:'', cargo:'Cargo'}); });
  render();
}
function quitarFirma(i){
  guardarBoletaCfg(c=>{ c.firmas.splice(i,1); });
  render();
}

/* Genera las boletas en una ventana de impresión horizontal.
   Desde el diálogo del navegador se elige "Guardar como PDF". */
function descargarBoletasPdf(grado, soloEstId){
  const cfg = boletaCfg();
  const aj = DB.ajustes || {};
  let estudiantes = ordenarEstudiantes(DB.estudiantes.filter(e=>e.grado===grado), getPref('ordenEst','apellidos'));
  if(soloEstId) estudiantes = estudiantes.filter(e=>e.id===soloEstId);
  if(estudiantes.length===0){ showToast('No hay estudiantes en esta aula.'); return; }

  const asigs = asignaturasDeGrado(grado);
  const n1 = v => v===null||v===undefined ? '' : v.toFixed(0);
  const q = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const hoja = (est)=>{
    const dat = boletaDatos(est.id);
    const g = studentInfo(est.id, grado);
    return `
    <div class="pagina"><div class="hoja">

        <div style="text-align:right;"><span class="ident-lbl">Grado / aula</span><span class="ident-dato">${q(grado)}</span></div>
      </div>
      <div class="cuerpo">
        <div class="izq">
          <div class="tbl">
          <table>
            <colgroup><col class="mat"><col class="per"><col class="per"><col class="per"><col class="per"><col class="fin"></colgroup>
            <tr><th>MATERIAS</th><th>I PER&Iacute;ODO</th><th>II PER&Iacute;ODO</th><th>III PER&Iacute;ODO</th><th>IV PER&Iacute;ODO</th><th>PROMEDIO FINAL</th></tr>
            ${asigs.map(a=>`<tr>
              <td class="izqtxt">${q(a.nombre.toUpperCase())}</td>
              ${[1,2,3,4].map(p=>`<td class="c">${n1(periodInfo(est.id,a.id,p,grado).valor)}</td>`).join('')}
              <td class="c b">${n1(subjectInfo(est.id,a.id,grado).valor)}</td>
            </tr>`).join('')}
            <tr class="tot">
              <td class="izqtxt">PROMEDIO DE PER&Iacute;ODO</td>
              ${[1,2,3,4].map(p=>`<td class="c">${n1(promedioPeriodoEstudiante(est.id,grado,p))}</td>`).join('')}
              <td class="c verde">${n1(g.valor)}</td>
            </tr>
            <tr>
              <td class="izqtxt">INASISTENCIAS POR PER&Iacute;ODO</td>
              ${[1,2,3,4,'final'].map(p=>`<td class="c">${q(dat.inasistencias[p]||'')}</td>`).join('')}
            </tr>
          </table>
          </div>
          <div class="obs"><b>OBSERVACIONES:</b> ${q(dat.observaciones)}</div>
          <div class="firmas">
            ${cfg.firmas.map(f=>`<div><span></span><p class="fn">${q(f.nombre)}</p><p>${q(f.cargo)}</p></div>`).join('')}
          </div>
        </div>
        <div class="der">
          <div class="bloque" style="flex:${cfg.casillasPadres.length + 1}">
          <table><tr><th colspan="2">CASILLAS PADRES</th></tr>
            ${cfg.casillasPadres.map((t,i)=>`<tr><td>${q(t)}</td><td class="c w">${q(dat.padres[i]||'')}</td></tr>`).join('')}
          </table></div>
          <div class="bloque" style="flex:${cfg.conducta.length + 1}">
          <table><tr><th colspan="2">EVALUACI&Oacute;N DE CONDUCTA DEL ESTUDIANTE</th></tr>
            ${cfg.conducta.map((t,i)=>`<tr><td>${q(t)}</td><td class="c w">${q(dat.conducta[i]||'')}</td></tr>`).join('')}
          </table></div>
          <div class="bloque" style="flex:5">
          <table><tr><th colspan="2">NOTA DE CONDUCTA</th></tr>
            ${['I-P','II-P','III-P','IV-P'].map((et,i)=>`<tr><td>${et}</td><td class="c w">${q(dat.notaConducta[i+1]||'')}</td></tr>`).join('')}
          </table></div>
          <div class="bloque" style="flex:${cfg.escala.length + 1}">

            ${cfg.escala.map(e=>`<tr><td>${q(e.nombre)}</td><td class="c w">${q(e.rango)}</td></tr>`).join('')}
          </table></div>
        </div>
      </div>
    </div></div>`;
  };

  const cierre = '<' + '/script>';
  /* La hoja es carta horizontal: 279.4 x 215.9 mm, menos 12 mm de margen por lado.
     La letra y el relleno de las celdas se ajustan a cuántas materias tenga el aula. */
  const n = asigs.length;
  const escalaFuente = n > 14 ? '8.5px' : (n > 12 ? '9.5px' : (n > 10 ? '10.5px' : (n > 8 ? '11px' : '12px')));
  const relleno     = n > 14 ? '1.6px' : (n > 12 ? '2.2px' : (n > 10 ? '3px'    : (n > 8 ? '3.6px' : '4.4px')));
  /* Carta horizontal (215.9 mm de alto) menos 14 mm de margen arriba y abajo */
  const altoHoja = '187mm';
  /* El alto lo reparte el navegador entre las tablas, así nada se corta.
     La tabla de materias usa celdas de 1 cm exacto siempre que quepan. */

     haya pocas o muchas asignaturas. */
  const estiloFilas = '.tbl{ flex:0 0 auto; } .tbl table{ height:83mm; table-layout:fixed; }';

    : 'BOLETAS DE NOTAS ' + grado.toUpperCase();

  const html = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">' +
  '<title>' + q(tituloArchivo) + '</title><style>' +
  '@page{ size: letter landscape; margin: 14mm; }' +
  'html,body{ height:100%; }' +
  '@media screen{' +
  '  body{ background:#d8d8d8; padding:18px 0; height:auto; }' +
  '  .pagina{ width:279.4mm; height:215.9mm; padding:14mm; margin:0 auto 18px;' +
  '    background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.28); }' +
  '}' +
  '@media print{ .pagina{ width:auto; height:auto; padding:0; box-shadow:none; }' +
  '  .pagina{ page-break-after: always; } .pagina:last-child{ page-break-after: auto; } }' +
  '*{ box-sizing:border-box; }' +
  'body{ font-family: Arial, Helvetica, sans-serif; font-size:' + escalaFuente + '; color:#000; margin:0; }' +
  '.hoja{ page-break-inside: avoid; height:' + altoHoja + ';' +
  ' display:flex; flex-direction:column; overflow:hidden; }' +
  '.hoja:last-child{ page-break-after: auto; }' +
  '.cab{ display:flex; align-items:center; gap:10px; padding-bottom:4px; margin-bottom:6px; }' +
  '.ident-fila{ display:flex; justify-content:space-between; align-items:flex-end;' +
  ' border-bottom:1px solid #000; padding-bottom:5px; margin-bottom:7px; }' +
  '.ident-lbl{ font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:#666; display:block; }' +
  '.ident-dato{ font-size:16px; font-weight:bold; }' +
  '.logo{ width:68px; height:68px; object-fit:contain; }' +
  '.colegio{ font-size:17px; font-weight:bold; margin:0; letter-spacing:.02em; }' +

  '.sub{ font-size:13px; margin:4px 0 0; font-weight:bold; letter-spacing:.04em; }' +
  '.ident{ margin-left:auto; text-align:right; }' +
  '.ident p{ margin:1px 0; font-size:10px; }' +
  '.cuerpo{ display:flex; gap:10px; align-items:stretch; flex:1; min-height:0; }' +
  '.izq{ flex:1.55; display:flex; flex-direction:column; min-width:0; }' +
  '.der{ flex:1; display:flex; flex-direction:column; gap:2.5mm; min-width:0; }' +
  '.bloque{ display:flex; min-height:0; }' +
  '.bloque table{ height:100%; }' +
  '.der tr{ max-height:10mm; }' +
  '.der td, .der th{ vertical-align:middle; }' +
  'table{ width:100%; border-collapse:collapse; }' +
  '.izq table{ margin-bottom:0; }' +
  estiloFilas +
  '.tbl td, .tbl th{ vertical-align:middle; }' +
  'th,td{ border:1px solid #000; padding:' + relleno + ' 5px; line-height:1.25;' +
  ' word-break:break-word; overflow-wrap:anywhere; }' +
  '.tbl th{ font-size:.92em; }' +
  '.tbl col.mat{ width:30%; } .tbl col.per{ width:13%; } .tbl col.fin{ width:18%; }' +
  'th{ text-align:center; font-weight:bold; }' +
  '.c{ text-align:center; } .b{ font-weight:bold; } .w{ width:62px; }' +
  '.tbl table{ table-layout:fixed; }' +
  '.tbl th:first-child, .tbl td:first-child{ width:30%; }' +
  '.tbl td:not(:first-child){ white-space:nowrap; }' +
  '.tbl th{ white-space:normal; }' +
  '.verde{ color:#0a7a3f; font-weight:bold; }' +
  '.tot td{ font-weight:bold; }' +
  '.izqtxt{ text-align:left; }' +
  '.obs{ border:none; padding:0; margin:10px 0 0; line-height:1.5; text-align:justify;' +
  ' font-size:11px; max-height:40mm; overflow:hidden; flex:0 1 auto; }' +
  '.firmas{ display:flex; gap:16px; margin-top:auto; padding-top:12px; flex:0 0 auto; }' +
  '.firmas > div{ flex:1; text-align:center; }' +
  '.firmas span{ display:block; border-top:1px solid #000; margin-bottom:3px; }' +
  '.firmas p{ margin:0; font-size:10px; }' +

  '</style></head><body>' + estudiantes.map(hoja).join('') +
  '<script>window.onload=function(){setTimeout(function(){window.print();},350);};' + cierre +
  '</body></html>';

  const v = window.open('', '_blank');
  if(!v){ showToast('El navegador bloqueó la ventana emergente. Permítela e intenta de nuevo.'); return; }

  v.document.close();
  showToast('En el diálogo de impresión elige "Guardar como PDF".');

  return `

  <div class="card" style="border-radius:0 var(--radius) var(--radius) var(--radius);">
    <p class="hj-titulo">HOJA DE TAREAS ${esc(PERIODO_PALABRA[periodo]||'')} PERIODO ${esc((asig?asig.nombre:'').toUpperCase())}.</p>

    <div class="table-wrap">

      <thead><tr>

        ${edit?'<th style="width:64px;"></th>':''}
      </tr></thead>
      <tbody>
        ${hoja.filas.map(filaHtml).join('')}
        <tr class="hj-examenes">
          <td>${edit?`<input type="date" class="hj-in" value="${esc(hoja.examen.fecha||'')}" onchange="editarExamen('fecha',this.value)">`:esc(hoja.examen.fecha||'')}</td>
          <td colspan="${edit?8:7}" class="hj-centro">
            ${edit?`<input class="hj-in hj-centro hj-etiqueta" value="${esc(hoja.examen.texto||'')}" onchange="editarExamen('texto',this.value)">`:esc(hoja.examen.texto||'')}
          </td>

    <p class="nota-chica">Las firmas se configuran una vez y quedan por defecto: ${cfg.firmas.map(f=>esc(f)).join(' · ')}.
      ${edit?`<button class="btn btn-sm" style="margin-left:8px;" onclick="editarFirmasHoja()">Cambiar firmas</button>`:''}</p>
