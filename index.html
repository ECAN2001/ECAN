<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Escolar — Cuaderno de Calificaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEEE6;
    --ink:#1C2B2A;
    --panel:#FFFFFF;
    --panel-2:#F7F7F1;
    --line:#D9DACD;
    --line-strong:#BFC1B0;
    --primary:#2F6F5E;
    --primary-dark:#1F4E41;
    --primary-light:#DCEAE4;
    --gold:#B98A2E;
    --gold-light:#F3E6C9;
    --red:#A63D2E;
    --red-light:#F4DCD6;
    --blue:#2E5C7A;
    --blue-light:#DCE7EE;
    --muted:#6E6E62;
    --margin-red:#C0574A;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,43,42,.06), 0 4px 14px rgba(28,43,42,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-.01em; }
  button, input, select{ font-family:'Inter',sans-serif; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  #app{ min-height:100vh; }

  /* ---------- LOGIN ---------- */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:40px 36px; width:100%; max-width:460px; box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  .login-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--margin-red);
  }
  .login-eyebrow{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin:0 0 6px; }
  .login-title{ font-size:28px; margin:0 0 4px; }
  .login-sub{ color:var(--muted); font-size:14px; margin:0 0 28px; }
  .user-list{ display:flex; flex-direction:column; gap:8px; max-height:360px; overflow-y:auto; padding-right:4px;}
  .user-pick{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--line);
    border-radius:10px; background:var(--panel-2); cursor:pointer; text-align:left; width:100%;
    transition:border-color .15s, background .15s;
  }
  .user-pick:hover{ border-color:var(--primary); background:var(--primary-light); }
  .user-avatar{
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; color:#fff; flex-shrink:0;
  }
  .user-meta{ min-width:0; }
  .user-name{ font-weight:600; font-size:14px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .user-role{ font-size:12px; color:var(--muted); margin:0; }
  .badge{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.03em; text-transform:uppercase; margin-left:auto; flex-shrink:0;}
  .badge-direccion{ background:var(--gold-light); color:#7A5A1C; }
  .badge-coordinacion{ background:var(--blue-light); color:var(--blue); }
  .badge-secretaria{ background:var(--primary-light); color:var(--primary-dark); }
  .badge-docente{ background:var(--panel); color:var(--muted); border:1px solid var(--line);}

  /* ---------- LAYOUT ---------- */
  .layout{ display:flex; min-height:100vh; }
  .sidebar{
    width:230px; background:var(--panel); border-right:1px solid var(--line); flex-shrink:0;
    display:flex; flex-direction:column; padding:22px 0;
  }
  .brand{ padding:0 20px 20px; border-bottom:1px solid var(--line); margin-bottom:14px;}
  .brand-title{ font-size:19px; margin:0; line-height:1.15;}
  .brand-sub{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:4px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 20px; font-size:14px; font-weight:500;
    color:var(--ink); cursor:pointer; border-left:3px solid transparent; opacity:.75;
  }
  .nav-item:hover{ background:var(--panel-2); opacity:1; }
  .nav-item.active{ border-left-color:var(--primary); background:var(--primary-light); opacity:1; color:var(--primary-dark); font-weight:600;}
  .nav-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.5; flex-shrink:0;}
  .sidebar-footer{ margin-top:auto; padding:14px 20px 0; border-top:1px solid var(--line); }
  .who{ display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .who .user-name{ font-size:13px; }
  .who .user-role{ font-size:11px; }
  .num-est{ color:var(--muted); font-size:12px; text-align:center; }
  .pill-rojo{ background:var(--red-light); color:var(--red); }
  .pill-naranja{ background:#FBE3CE; color:#8A4A16; }
  .alerta-amarilla{ border-left:4px solid #E0B93C; }
  .alerta-naranja{ border-left:4px solid #D9822B; }
  .alerta-roja{ border-left:4px solid var(--red); }
  .acts-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:10px; }
  .act-chip{ background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
  .act-chip-top{ display:flex; align-items:center; gap:2px; }
  .act-nombre{ border:none; background:transparent; padding:2px; font-size:12.5px; font-weight:600; width:100%; color:var(--ink); }
  .act-nombre:focus{ outline:1px solid var(--primary); border-radius:4px; }
  .act-fecha-lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:6px 0 3px; display:block; }
  .act-fecha{ width:100%; padding:4px 6px; font-size:12px; border:1px solid var(--line-strong); border-radius:6px; background:#fff; }
  .matriz-detalle th{ text-align:center; }
  .matriz-detalle .col-materia{ background:var(--primary-light); color:var(--primary-dark);
    border-left:2px solid var(--line-strong); text-align:center; }
  .matriz-detalle td.col-final, .matriz-detalle th.col-final{ background:var(--panel-2); font-weight:700; }
  .avg-cell.col-global{ background:var(--gold-light); font-weight:700; }
  .num-est{ color:var(--muted); }
  .marca-parcial{ display:block; font-size:9.5px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.03em; margin-top:2px; font-family:'Inter',sans-serif; }
  .nota-chica{ font-size:11.5px; color:var(--muted); margin:10px 0 0; }
  .celda-nota{ display:flex; align-items:center; gap:3px; }
  .obs-btn{ border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:5px;
    width:20px; height:24px; font-size:11px; cursor:pointer; line-height:1; flex-shrink:0; }
  .obs-btn:hover{ border-color:var(--primary); color:var(--primary); }
  .obs-btn.con-obs{ background:var(--gold-light); border-color:#E3C98A; color:#7A5A1C; }
  .estado-sel{ width:100%; margin-top:4px; padding:3px 4px; font-size:11px; border-radius:5px;
    border:1px solid var(--line-strong); background:#fff; }
  .estado-sel.estado-entregada{ background:var(--primary-light); color:var(--primary-dark); }
  .estado-sel.estado-tardia{ background:var(--gold-light); color:#7A5A1C; }
  .estado-sel.estado-no{ background:var(--red-light); color:var(--red); }
  .clave-actual{ display:flex; align-items:center; gap:4px; font-family:'JetBrains Mono',monospace;
    font-size:12.5px; color:var(--primary-dark); margin-bottom:5px; }
  .check-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; padding:6px 11px; font-size:12.5px;
    font-weight:500; color:var(--ink); cursor:pointer; }
  .check-chip input{ width:auto; margin:0; cursor:pointer; }
  .login-logo{ width:60px; height:60px; object-fit:contain; margin-bottom:12px; border-radius:8px; }
  .brand-logo{ width:38px; height:38px; object-fit:contain; margin-bottom:8px; display:block; border-radius:6px; }
  .candado{ font-size:11px; margin-left:auto; opacity:.6; }
  .candado + .badge{ margin-left:6px; }
  textarea{ font-size:13.5px; line-height:1.5; }
  .aviso-motor{
    background:var(--gold-light); border:1px solid #E3C98A; border-radius:var(--radius);
    padding:11px 15px; font-size:13px; color:#6B4E10; margin-bottom:18px; line-height:1.55;
  }
  .aviso-motor.aviso-grave{ background:var(--red-light); border-color:#E0B3A9; color:#7A2A1C; }
  .btn-respaldo{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .sync-row{
    display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted);
    margin-bottom:9px; cursor:pointer; user-select:none;
  }
  .sync-row:hover{ color:var(--ink); }
  .sync-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .logout-btn{
    width:100%; padding:8px; border:1px solid var(--line); background:var(--panel-2); border-radius:8px;
    font-size:12.5px; cursor:pointer; color:var(--muted); font-weight:600;
  }
  .logout-btn:hover{ border-color:var(--red); color:var(--red); }

  .main{ flex:1; min-width:0; padding:32px 40px; max-width:1200px; }
  .page-head{ margin-bottom:26px; }
  .page-eyebrow{ font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin:0 0 6px;}
  .page-title{ font-size:21px; margin:0; }
  .saludo-grande{ font-family:'Fraunces',serif; font-size:26px; font-weight:600;
    letter-spacing:-.01em; color:var(--gold); text-transform:none; margin:0 0 4px; }
  .page-desc{ color:var(--muted); font-size:14px; margin:6px 0 0; max-width:640px; }

  /* ---------- GENERIC ---------- */
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; margin-bottom:18px;}
  .card-title{ font-size:15px; margin:0 0 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .grid{ display:grid; gap:14px; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  @media(max-width:900px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } .main{padding:20px;} .sidebar{width:190px;} }

  .stat{ background:var(--panel-2); border-radius:var(--radius); padding:16px 18px; }
  .stat-label{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:0 0 6px;}
  .stat-value{ font-size:26px; font-weight:700; margin:0; font-family:'Fraunces',serif; }

  label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:5px; }
  input[type=text], input[type=number], select, textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line-strong); border-radius:8px; font-size:13.5px;
    background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary); }
  .field{ margin-bottom:12px; }
  .btn{
    padding:9px 16px; border-radius:8px; border:1px solid var(--line-strong); background:#fff; font-size:13.5px;
    font-weight:600; cursor:pointer; color:var(--ink); display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{ border-color:var(--primary); }
  .btn-primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .btn-primary:hover{ background:var(--primary-dark); border-color:var(--primary-dark); }
  .btn-danger{ color:var(--red); border-color:var(--red-light); background:var(--red-light); }
  .btn-danger:hover{ background:var(--red); color:#fff; }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:8px 10px; border-bottom:2px solid var(--line-strong); white-space:nowrap;}
  td{ padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:hover td{ background:var(--panel-2); }
  .table-wrap{ overflow-x:auto; }
  .empty{ text-align:center; color:var(--muted); padding:30px 10px; font-size:13.5px; }
  .pill{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; display:inline-block; }
  .pill-primary{ background:var(--primary-light); color:var(--primary-dark); }
  .pill-gold{ background:var(--gold-light); color:#7A5A1C; }
  .pill-blue{ background:var(--blue-light); color:var(--blue); }
  .pill-muted{ background:var(--panel-2); color:var(--muted); border:1px solid var(--line);}
  .tag-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .icon-btn{ background:none; border:none; cursor:pointer; color:var(--muted); padding:4px 6px; border-radius:6px; font-size:13px;}
  .icon-btn:hover{ background:var(--panel-2); color:var(--ink); }

  /* period tabs - ledger tab look */
  .period-tabs{ display:flex; gap:0; margin-bottom:0; }
  .period-tab{
    padding:9px 20px; font-size:13px; font-weight:700; cursor:pointer; color:var(--muted);
    background:var(--panel-2); border:1px solid var(--line); border-bottom:none;
    border-radius:10px 10px 0 0; margin-right:4px; position:relative; top:1px;
  }
  .period-tab.active{ background:var(--panel); color:var(--primary-dark); border-color:var(--line-strong); }

  /* notebook-style score matrix */
  .ledger{ border:1px solid var(--line-strong); border-radius:0 var(--radius) var(--radius) var(--radius); background:var(--panel); overflow:hidden; }
  .ledger-table{ width:100%; border-collapse:collapse; }
  .ledger-table th{ background:var(--panel-2); border-bottom:2px solid var(--line-strong); }
  .ledger-table td, .ledger-table th{ position:relative; }
  .ledger-table td:first-child, .ledger-table th:first-child{
    border-right:2px solid var(--margin-red);
  }
  .score-input{
    width:64px; padding:5px 6px; text-align:center; border:1px solid var(--line-strong); border-radius:6px;
    font-family:'JetBrains Mono',monospace; font-size:13px;
  }
  .score-input.deficiente{ color:var(--red); border-color:#e0b3a9; background:var(--red-light);}
  .avg-cell{ font-family:'JetBrains Mono',monospace; font-weight:700; }
  .avg-good{ color:var(--primary-dark); }
  .avg-bad{ color:var(--red); }
  .avg-pending{ color:var(--muted); font-weight:400; font-style:italic; }

  .modal-bg{ position:fixed; inset:0; background:rgba(28,43,42,.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:50;}
  .modal{ background:#fff; border-radius:14px; padding:26px 26px 22px; width:100%; max-width:520px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .modal-title{ font-size:18px; margin:0 0 16px; }
  .modal-close{ float:right; background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); line-height:1;}
  .assign-row{ display:flex; gap:8px; align-items:end; margin-bottom:8px; }
  .assign-list-item{ display:flex; align-items:center; justify-content:space-between; padding:7px 10px; background:var(--panel-2); border-radius:7px; margin-bottom:6px; font-size:13px;}
  .toast{ position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:11px 18px; border-radius:9px; font-size:13.5px; box-shadow:var(--shadow); z-index:100; opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none;}
  .toast.show{ opacity:1; transform:translateY(0); }
  .note{ font-size:12px; color:var(--muted); background:var(--panel-2); border-left:3px solid var(--gold); padding:8px 12px; border-radius:6px; margin-bottom:14px;}
  .loading{ padding:60px; text-align:center; color:var(--muted); }
  select.grado-select{ max-width:260px; }
  .filters{ display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:16px;}
  .filters .field{ margin-bottom:0; min-width:170px; }
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando sistema…</div></div>
<div id="toast" class="toast"></div>

<script>
/* ============================= ESTADO ============================= */
let DB = { estudiantes:[], asignaturas:[], docentes:[], calificaciones:{}, config:{ grados:[], periodos:4 }, actividades:{} };
/* Ponderación fija de cada período de evaluación */
const RUBROS_DEF = [
  {key:'integradora1', nombre:'Integradora 1', peso:0.15, tarea:true},
  {key:'integradora2', nombre:'Integradora 2', peso:0.15, tarea:true},
  {key:'examen', nombre:'Examen', peso:0.40, conRecuperacion:true},
  {key:'cuaderno', nombre:'Cuaderno', peso:0.10},
];
const PESO_ACTIVIDADES_DEF = 0.20;
/* La lista de rubros vive en la configuración: Dirección puede agregar y quitar.
   "Actividades" es aparte porque su nota es el promedio de las casillas. */
function rubrosActivos(){
  if(DB.config && Array.isArray(DB.config.rubros) && DB.config.rubros.length) return DB.config.rubros;
  const viejos = (DB.config && DB.config.pesos) || null;   // configuración anterior
  return RUBROS_DEF.map(r=>Object.assign({}, r, {
    peso: (viejos && typeof viejos[r.key] === 'number') ? viejos[r.key] : r.peso
  }));
}
function esRubroTarea(key){
  const r = rubrosActivos().find(x=>x.key===key);
  return !!(r && r.tarea);
}
function rubrosTarea(){ return rubrosActivos().filter(r=>r.tarea); }
/* Los pesos por defecto se pueden cambiar desde Personalizar (Dirección) */
function pesoDe(key){
  if(key === 'actividades'){
    const p = (DB.config && DB.config.pesos) ? DB.config.pesos.actividades : undefined;
    return (typeof p === 'number' && !isNaN(p)) ? p : PESO_ACTIVIDADES_DEF;
  }
  const r = rubrosActivos().find(x=>x.key===key);
  return r ? r.peso : 0;
}
function sumaPesos(){
  return pesoDe('actividades') + rubrosActivos().reduce((s,r)=>s+r.peso, 0);
}
let currentUser = null;
let currentView = 'panel';
let viewState = {}; // scratch state per view (selected grado, periodo, etc.)
let editingId = null;

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

/* ============================= STORAGE ============================= */

/* ---------------------------------------------------------------
   Todos los datos viven en UNA sola clave. Antes se usaban 6 claves y
   la app hacía 6 lecturas cada pocos segundos: eso superaba el límite
   de peticiones y provocaba el error "No se pudo guardar".
   --------------------------------------------------------------- */
const DOC_KEY = 'escuela_doc';
const CLAVES_ANTIGUAS = ['estudiantes','asignaturas','docentes','calificaciones','config','actividades'];
const TIEMPO_LIMITE = 8000;   // ninguna operación puede quedarse colgada

let pendientes = [];      // cambios hechos y aún no confirmados
let guardando = false;
let flushTimer = null;
let intentosFallidos = 0;
let motor = null;         // 'compartido' | 'local' | 'memoria'
let memoria = {};

/* Toda operación se corta a los 8 s. Sin esto, una petición que nunca
   responde dejaba el indicador en "Guardando…" para siempre. */
function conLimite(promesa, ms){
  return Promise.race([
    promesa,
    new Promise((_,rechazar)=>setTimeout(()=>rechazar(new Error('tiempo agotado')), ms||TIEMPO_LIMITE))
  ]);
}

/* ---------------------------------------------------------------
   Se detecta dónde se pueden guardar los datos:
   1. compartido  -> almacenamiento común: todos los dispositivos ven lo mismo
   2. local       -> solo este navegador (el archivo se abrió por fuera)
   3. memoria     -> nada se conserva al cerrar; se avisa en pantalla
   --------------------------------------------------------------- */
/* =====================================================================
   ENLACE DE SINCRONIZACIÓN DEL CENTRO ESCOLAR
   Pega aquí, entre las comillas, el enlace que termina en /exec.
   Al hacerlo, cualquiera que abra esta página verá los datos del centro
   escolar sin tener que configurar nada.
   ===================================================================== */
const ENLACE_FIJO = '';

function getSyncUrl(){
  try{
    const guardado = window.localStorage.getItem('sync_url');
    if(guardado) return guardado;              // lo que el usuario haya puesto manda
  }catch(e){}
  return ENLACE_FIJO;                          // si no, el del centro escolar
}
function setSyncUrl(u){
  try{ if(u) window.localStorage.setItem('sync_url', u); else window.localStorage.removeItem('sync_url'); }catch(e){}
}
/* Lee el documento común alojado en el Google Drive del centro escolar */
/* Versión de esta copia del sistema. El Apps Script del centro escolar
   puede exigir una versión mínima y así dejar fuera las copias viejas. */
const VERSION_APP = 5;
let versionRechazada = false;

async function nubeLeer(){
  const url = getSyncUrl();
  const r = await conLimite(fetch(url + '?v=' + VERSION_APP + '&t=' + Date.now(),
    {method:'GET', redirect:'follow'}), 12000);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const txt = await r.text();
  if(!txt || txt.trim()==='' || txt.trim()==='null') return null;
  const doc = JSON.parse(txt);
  if(doc && doc.versionObsoleta){          // el centro escolar desactivó esta copia
    versionRechazada = true;
    throw new Error('version');
  }
  versionRechazada = false;
  return (doc && doc.vacio) ? null : doc;
}
async function nubeEscribir(valor){
  const url = getSyncUrl();
  // text/plain evita la petición previa de CORS, que Apps Script no responde
  const r = await conLimite(fetch(url + '?v=' + VERSION_APP, {method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body: valor}), 15000);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const resp = await r.text();
  if(resp && resp.indexOf('versionObsoleta') >= 0){
    versionRechazada = true;
    throw new Error('version');
  }
  return true;
}

async function detectarMotor(){
  if(getSyncUrl()){
    try{
      await nubeLeer();               // basta con que responda
      motor = 'nube';
      return;
    }catch(e){ console.warn('sincronización en la nube no disponible', e); }
  }
  if(typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function'){
    // se intenta más de una vez: un fallo momentáneo no debe dejar sin sincronización toda la sesión
    for(let i=0; i<2; i++){
      try{
        await conLimite(window.storage.set('__prueba', '1', true), 5000);
        motor = 'compartido';
        return;
      }catch(e){ console.warn('almacenamiento compartido no disponible', e); }
      await new Promise(r=>setTimeout(r, 600));
    }
  }
  try{
    window.localStorage.setItem('__prueba','1');
    window.localStorage.removeItem('__prueba');
    motor = 'local';
    return;
  }catch(e){ console.warn('almacenamiento local no disponible', e); }
  motor = 'memoria';
}
/* Si se degradó por un problema pasajero, se vuelve a intentar el modo compartido */
async function intentarPromocion(){
  if(motor === 'compartido' || motor === 'nube') return false;
  if(getSyncUrl()){
    try{ await nubeLeer(); motor='nube'; iniciarSync(); setSyncStatus('ok'); if(currentUser) render(); return true; }catch(e){}
  }
  if(!(typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function')) return false;
  try{
    await conLimite(window.storage.set('__prueba', '1', true), 5000);
    motor = 'compartido';
    iniciarSync();
    setSyncStatus('ok');
    if(currentUser) render();
    return true;
  }catch(e){ return false; }
}

async function leerCrudo(clave, compartido){
  if(motor === 'nube' && clave === DOC_KEY){
    const doc = await nubeLeer();
    return doc ? JSON.stringify(doc) : null;
  }
  if(motor === 'nube'){  // sesión y ajustes siguen siendo de cada equipo
    try{ return window.localStorage.getItem(clave); }catch(e){ return null; }
  }
  if(motor === 'compartido'){
    const r = await conLimite(window.storage.get(clave, compartido!==false));
    return r ? r.value : null;
  }
  if(motor === 'local'){ return window.localStorage.getItem(clave); }
  return memoria[clave] || null;
}
async function escribirCrudo(clave, valor, compartido){
  if(motor === 'nube' && clave === DOC_KEY){
    await nubeEscribir(valor);
    try{ window.localStorage.setItem(DOC_KEY, valor); }catch(e){}  // copia local por si se cae la red
    return true;
  }
  if(motor === 'nube'){
    try{ window.localStorage.setItem(clave, valor); }catch(e){}
    return true;
  }
  if(motor === 'compartido'){
    const r = await conLimite(window.storage.set(clave, valor, compartido!==false));
    if(!r) throw new Error('respuesta vacía');
    return true;
  }
  if(motor === 'local'){ window.localStorage.setItem(clave, valor); return true; }
  memoria[clave] = valor; return true;
}

/* Aplica el cambio en pantalla al instante y lo encola para guardarlo. */
function commit(mutador){
  mutador(docActual());
  pendientes.push(mutador);
  setSyncStatus('pendiente');
  programarGuardado(250);
}
function programarGuardado(ms){
  if(flushTimer) clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, ms);
}
async function flush(){
  if(guardando || pendientes.length===0) return;
  guardando = true;
  const lote = pendientes.slice();
  let exito = false;
  try{
    const remoto = await leerDoc();
    const base = remoto || docActual();
    lote.forEach(m=>{ try{ m(base); }catch(e){ console.error('reaplicar', e); } });
    await escribirDoc(base);
    adoptarDoc(base);
    pendientes = pendientes.slice(lote.length);
    intentosFallidos = 0;
    exito = true;
  }catch(e){
    console.error('guardar', e);
    intentosFallidos++;
  }finally{
    // pase lo que pase, nunca queda bloqueado
    guardando = false;
  }
  if(exito){
    if(pendientes.length>0){ programarGuardado(300); }
    else{ setSyncStatus('ok'); if(currentUser) render(); }
  }else{
    setSyncStatus('error');
    if(intentosFallidos % 3 === 0) intentarPromocion();
    const espera = Math.min(800 * Math.pow(2, intentosFallidos-1), 20000);
    if(intentosFallidos === 3){
      showToast('No se está pudiendo guardar. Usa "Descargar respaldo" para no perder nada.');
    }
    programarGuardado(espera);
  }
}
/* Reintento manual desde el indicador */
async function reintentarGuardado(){
  intentosFallidos = 0;
  await intentarPromocion();
  if(pendientes.length>0){ programarGuardado(0); showToast('Reintentando…'); }
  else pullCambios(false);
}

/* ===================== GENERADOR DE ARCHIVOS .XLSX =====================
   Escribe un libro de Excel real (ZIP + XML), sin librerías externas.
   ===================================================================== */
const TABLA_CRC = (()=>{
  const t = new Uint32Array(256);
  for(let n=0; n<256; n++){
    let c = n;
    for(let k=0; k<8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0; i<bytes.length; i++) c = TABLA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function textoABytes(txt){
  if(typeof TextEncoder !== 'undefined') return new TextEncoder().encode(txt);
  const arr = [];
  for(let i=0;i<txt.length;i++){
    let c = txt.charCodeAt(i);
    if(c < 0x80) arr.push(c);
    else if(c < 0x800){ arr.push(0xC0|(c>>6), 0x80|(c&63)); }
    else { arr.push(0xE0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63)); }
  }
  return new Uint8Array(arr);
}
/* ZIP sin compresión (método "store"): suficiente y muy simple */
function crearZip(archivos){
  const partes = [], central = [];
  let offset = 0;
  const d = new Date();
  const fechaDos = {
    hora: [ (((d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1)) & 0xFF),
            ((((d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1)) >> 8) & 0xFF) ],
    fecha:[ ((((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) & 0xFF),
            (((((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) >> 8) & 0xFF) ]
  };
  const u16 = v => [v & 0xFF, (v>>8) & 0xFF];
  const u32 = v => [v & 0xFF, (v>>8) & 0xFF, (v>>16) & 0xFF, (v>>24) & 0xFF];

  archivos.forEach(f=>{
    const nombre = textoABytes(f.nombre);
    const datos = textoABytes(f.contenido);
    const crc = crc32(datos);
    const local = [].concat(
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), fechaDos.hora, fechaDos.fecha,
      u32(crc), u32(datos.length), u32(datos.length),
      u16(nombre.length), u16(0)
    );
    partes.push(new Uint8Array(local), nombre, datos);
    central.push([].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), fechaDos.hora, fechaDos.fecha,
      u32(crc), u32(datos.length), u32(datos.length),
      u16(nombre.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
    ), nombre);
    offset += local.length + nombre.length + datos.length;
  });

  const centralBytes = [];
  for(let i=0; i<central.length; i+=2){
    centralBytes.push(new Uint8Array(central[i]), central[i+1]);
  }
  const tamCentral = centralBytes.reduce((s,b)=>s+b.length, 0);
  const fin = new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0), u16(archivos.length), u16(archivos.length),
    u32(tamCentral), u32(offset), u16(0)
  ));

  const todo = partes.concat(centralBytes, [fin]);
  const total = todo.reduce((s,b)=>s+b.length, 0);
  const salida = new Uint8Array(total);
  let pos = 0;
  todo.forEach(b=>{ salida.set(b, pos); pos += b.length; });
  return salida;
}
function escaparXml(txt){
  return String(txt).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function letraColumna(n){
  let s = '';
  while(n > 0){ const r = (n-1) % 26; s = String.fromCharCode(65+r) + s; n = Math.floor((n-1)/26); }
  return s;
}
function hojaXml(encabezados, filas){
  const fila = (celdas, nf, estilo) => {
    const cs = celdas.map((v,i)=>{
      const ref = letraColumna(i+1) + nf;
      const est = estilo ? ' s="'+estilo+'"' : '';
      if(v === null || v === undefined || v === '') return '<c r="'+ref+'"'+est+'/>';
      if(typeof v === 'number' && isFinite(v)) return '<c r="'+ref+'"'+est+'><v>'+v+'</v></c>';
      return '<c r="'+ref+'"'+est+' t="inlineStr"><is><t xml:space="preserve">'+escaparXml(v)+'</t></is></c>';
    }).join('');
    return '<row r="'+nf+'">'+cs+'</row>';
  };
  const anchos = encabezados.map((h,i)=>{
    let max = String(h).length;
    filas.forEach(f=>{ const v = f[i]; if(v!==undefined && v!==null) max = Math.max(max, String(v).length); });
    return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+Math.min(46, Math.max(8, max+3))+'" customWidth="1"/>';
  }).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<cols>'+anchos+'</cols><sheetData>' +
    fila(encabezados, 1, 1) +
    filas.map((f,i)=>fila(f, i+2, 0)).join('') +
    '</sheetData></worksheet>';
}
/* hojas = [{nombre, encabezados, filas}] */

      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +

      '<Relationship Id="rId'+(hojas.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +

function descargarXlsx(nombreArchivo, hojas){
  try{
    const bytes = construirXlsx(hojas);
    const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo.replace(/[\\\/:\*\?"<>\|]/g,' ').trim() + '.xlsx';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    showToast('Descargado: ' + nombreArchivo + '.xlsx');
    return true;
  }catch(e){
    console.error('xlsx', e);
    showToast('No se pudo generar el archivo de Excel.');
    return false;
  }
}

        const acts = getActividades(e.grado, asig.id);
        for(let p=1;p<=4;p++){
          acts.forEach(a=>{
            const nota = getComp(e.id, asig.id, p, 'act:'+a.id);
            const est = getEstado(e.id, asig.id, p, a.id);
            const fec = getFechaTarea(e.grado, asig.id, a.id, p);
            const ob = getObs(e.id, asig.id, p, 'act:'+a.id);
            if(nota!==undefined || est || fec || ob)
              fNotas.push([e.grado, e.nombre, asig.nombre, p, a.nombre,
                nota!==undefined?nota:'', est?ESTADOS[est].nombre:'', fec||'', ob||'']);
          });
          rubrosActivos().forEach(r=>{
            if(r.conRecuperacion){
              const rec = getComp(e.id, asig.id, p, claveRecuperacion(r.key));
              if(rec!==undefined)
                fNotas.push([e.grado, e.nombre, asig.nombre, p, 'Recuperación de '+getNombreRubro(e.grado, asig.id, r.key), rec, '', '', '']);
            }
            const nota = getComp(e.id, asig.id, p, r.key);
            const ob = getObs(e.id, asig.id, p, r.key);
            const esTarea = esRubroTarea(r.key);
            const est = esTarea ? getEstado(e.id, asig.id, p, r.key) : '';
            const fec = esTarea ? getFechaTarea(e.grado, asig.id, r.key, p) : '';
            if(nota!==undefined || ob || est || fec)
              fNotas.push([e.grado, e.nombre, asig.nombre, p, getNombreRubro(e.grado, asig.id, r.key),
                nota!==undefined?nota:'', est?ESTADOS[est].nombre:'', fec||'', ob||'']);
          });
        }
      });
    });

    const hRes = ['Grado','Estudiante','Asignatura','Período 1','Período 2','Período 3','Período 4','Promedio final','Estado'];
    const fRes = [];
    estVisibles.forEach(e=>{
      asignaturasVisibles(e.grado).forEach(asig=>{
        const ps = [1,2,3,4].map(p=>{
          const i = periodInfo(e.id, asig.id, p, e.grado);
          return i.valor===null?'':Number(i.valor.toFixed(1));
        });
        const si = subjectInfo(e.id, asig.id, e.grado);
        if(ps.some(v=>v!=='') )
          fRes.push([e.grado, e.nombre, asig.nombre].concat(ps,
            [si.valor===null?'':Number(si.valor.toFixed(1)), si.completo?'Completo':'Parcial']));
      });
    });

    const hMat = ['N°','Grado','Apellidos','Nombres','Promedio general del año'];
    const fMat = [];
    grados.forEach(g=>{
      ordenarEstudiantes(DB.estudiantes.filter(e=>e.grado===g), 'apellidos')
        .forEach((e,i)=>{
          const prom = studentFinalAverage(e.id, g);
          fMat.push([i+1, g, apellidosDe(e), nombresDe(e), prom===null?'':Number(prom.toFixed(1))]);
        });
    });

    const guardado = currentUser;
    const hTar = ['Fecha','Grado','Materia','Estudiante','Nombre de la tarea','Tipo','Período','Estado','Observaciones'];
    const fTar = listaTareas({}).map(f=>[f.fecha||'', f.grado, f.materia, f.estudiante, f.tarea,
      f.tipo||'Actividad', f.periodo, f.estado?ESTADOS[f.estado].nombre:'', f.obs||'']);

    const hAl = ['Nivel','Estudiante','Grado','Tareas pendientes','Materias'];
    const fAl = calcularAlertas({}).map(a=>[a.alerta.nombre, a.estudiante, a.grado, a.cantidad, a.materias.join(', ')]);

    const hDoc = ['Docente','Perfil','Grado de orientación','Asignaturas asignadas'];
    const fDoc = (isAdmin(currentUser)?DB.docentes:[currentUser]).map(d=>[d.nombre, domainLabel(d), orientacionesDe(d).join(', '),
      (d.asignaciones||[]).map(a=>(nombreAsig[a.asignaturaId]||'?')+' ('+a.grado+')').join(', ')]);

    const hojas = [
      ['Estudiantes', hEst, fEst], ['Notas', hNotas, fNotas], ['Resumen', hRes, fRes],
      ['Matriz', hMat, fMat], ['Tareas', hTar, fTar], ['Alertas', hAl, fAl], ['Docentes', hDoc, fDoc]
    ];
    const anioArch = (DB.ajustes && DB.ajustes.anio) || new Date().getFullYear();
    descargarXlsx('Base escolar ' + anioArch,
      hojas.map(h=>({nombre:h[0], encabezados:h[1], filas:h[2]})));
  }catch(e){ console.error(e); showToast('No se pudo generar el archivo de Excel.'); }
}

async function pullCambios(silencioso){
  if(motor !== 'compartido' && motor !== 'nube') return false;   // sin lugar común no hay nada que traer
  if(pendientes.length>0 || guardando) return false;
  const doc = await leerDoc();
  if(!doc){ setSyncStatus('error'); return false; }
  const cambio = JSON.stringify(docActual()) !== JSON.stringify(doc);
  if(cambio){
    adoptarDoc(doc);
    if(currentUser){
      const u = DB.docentes.find(t=>t.id===currentUser.id);
      currentUser = u || null;
    }
    if(!hayEdicionEnCurso()){
      setSyncStatus('ok');
      render();
      if(!silencioso) showToast('Datos actualizados.');
      return true;
    }
  }
  setSyncStatus('ok');
  return cambio;
}
function iniciarSync(){
  if(syncTimer) clearInterval(syncTimer);
  if(motor !== 'compartido' && motor !== 'nube') return;
  syncTimer = setInterval(()=>{ if(currentUser && !document.hidden) pullCambios(true); }, 15000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && currentUser) pullCambios(true); });
}

/* Combina lo que este equipo tiene con lo que ya está en el Drive.
   Regla: nunca se borra nada de nadie. Ante una nota repetida en la misma
   casilla, se conserva la que ya estaba en el Drive y se reporta el choque. */
function combinarDocs(local, nube){
  const res = {
    estudiantes: (nube.estudiantes||[]).slice(),
    asignaturas: (nube.asignaturas||[]).slice(),
    docentes: (nube.docentes||[]).slice(),
    calificaciones: Object.assign({}, nube.calificaciones||{}),
    config: nube.config || local.config,
    actividades: Object.assign({}, nube.actividades||{}),
    curriculo: Object.assign({}, nube.curriculo||{}),
    tareas: Object.assign({}, nube.tareas||{}),
    estados: Object.assign({}, nube.estados||{}),
    observaciones: Object.assign({}, nube.observaciones||{}),
    rubros: Object.assign({}, nube.rubros||{}),
    ajustes: (local.ajustes && local.ajustes.nombreColegio &&
              local.ajustes.nombreColegio !== 'Centro Escolar') ? local.ajustes : (nube.ajustes || local.ajustes)
  };
  const cuenta = {estudiantes:0, docentes:0, asignaturas:0, notas:0, choques:0};
  const mapaIds = {};   // id local -> id definitivo en el Drive

  (local.asignaturas||[]).forEach(a=>{
    const ya = res.asignaturas.find(x=>x.id===a.id || x.nombre.toLowerCase()===a.nombre.toLowerCase());
    if(ya){ mapaIds[a.id] = ya.id; }
    else { res.asignaturas.push(a); mapaIds[a.id] = a.id; cuenta.asignaturas++; }
  });
  (local.estudiantes||[]).forEach(e=>{
    const ya = res.estudiantes.find(x=>x.id===e.id ||
      (x.nombre.trim().toLowerCase()===e.nombre.trim().toLowerCase() && x.grado===e.grado));
    if(ya){ mapaIds[e.id] = ya.id; }
    else { res.estudiantes.push(e); mapaIds[e.id] = e.id; cuenta.estudiantes++; }
  });
  (local.docentes||[]).forEach(d=>{
    if(d.id === 'u_inicial') return;        // usuario de ejemplo: no se sube nunca
    const ya = res.docentes.find(x=>x.id===d.id || x.nombre.trim().toLowerCase()===d.nombre.trim().toLowerCase());
    if(!ya){ res.docentes.push(d); cuenta.docentes++; }
    else if(d.asignaciones){       // se suman asignaciones que el Drive no tenga
      ya.asignaciones = ya.asignaciones || [];
      d.asignaciones.forEach(a=>{
        const aid = mapaIds[a.asignaturaId] || a.asignaturaId;
        if(!ya.asignaciones.some(z=>z.grado===a.grado && z.asignaturaId===aid))
          ya.asignaciones.push({grado:a.grado, asignaturaId:aid});
      });
      const orientUnion = new Set(orientacionesDe(ya).concat(orientacionesDe(d)));
      if(orientUnion.size){ ya.orientaciones = Array.from(orientUnion); delete ya.orientacion; }
    }
  });
  Object.keys(local.actividades||{}).forEach(k=>{ if(!res.actividades[k]) res.actividades[k] = local.actividades[k]; });
  Object.keys(local.tareas||{}).forEach(k=>{ if(!res.tareas[k]) res.tareas[k] = local.tareas[k]; });
  Object.keys(local.observaciones||{}).forEach(k=>{ if(!res.observaciones[k]) res.observaciones[k] = local.observaciones[k]; });
  Object.keys(local.rubros||{}).forEach(k=>{ if(!res.rubros[k]) res.rubros[k] = local.rubros[k]; });
  Object.keys(local.curriculo||{}).forEach(g=>{
    res.curriculo[g] = res.curriculo[g] || [];
    (local.curriculo[g]||[]).forEach(id=>{ const d=mapaIds[id]||id; if(res.curriculo[g].indexOf(d)<0) res.curriculo[g].push(d); });
  });
  Object.keys(local.estados||{}).forEach(k=>{
    const p = k.split('|');
    const nueva = [mapaIds[p[0]]||p[0], mapaIds[p[1]]||p[1], p[2], p[3]].join('|');
    if(!(nueva in res.estados)) res.estados[nueva] = local.estados[k];
  });
  Object.keys(local.calificaciones||{}).forEach(k=>{
    const p = k.split('|');
    const nueva = [mapaIds[p[0]]||p[0], mapaIds[p[1]]||p[1], p[2], p[3]].join('|');
    if(!(nueva in res.calificaciones)){ res.calificaciones[nueva] = local.calificaciones[k]; cuenta.notas++; }
    else if(res.calificaciones[nueva] !== local.calificaciones[k]){
      res.calificaciones[nueva] = local.calificaciones[k];   // este equipo actualiza el Drive
      cuenta.choques++;
    }
  });
  return {doc:res, cuenta};
}

async function guardarSyncUrl(){
  const v = document.getElementById('sync_input').value.trim();
  if(!v){ showToast('Pega el enlace que termina en /exec.'); return; }
  if(!/^https:\/\/.+\/exec$/.test(v)){ showToast('El enlace debe empezar con https:// y terminar en /exec.'); return; }
  setSyncUrl(v);
  showToast('Conectando…');
  try{
    const doc = await nubeLeer();
    const mio = JSON.parse(JSON.stringify(docActual()));
    motor = 'nube';
    if(doc){
      // Un equipo recién abierto (sin datos propios) solo adopta lo del centro escolar,
      // sin subir el usuario de ejemplo ni pisar el nombre del colegio.
      const sinDatosPropios = (mio.estudiantes||[]).length === 0 &&
        (mio.docentes||[]).length <= 1 &&
        Object.keys(mio.calificaciones||{}).length === 0;
      if(sinDatosPropios){
        adoptarDoc(doc);
        setSyncStatus('ok');
        iniciarSync();
        showToast('Conectado con los datos del centro escolar.');
        render();
        return;
      }
      // Este equipo actualiza el Drive: se sube lo suyo y se conserva lo que ya había allá.
      const {doc:combinado, cuenta} = combinarDocs(mio, doc);
      adoptarDoc(combinado);
      await nubeEscribir(JSON.stringify(combinado));
      const aporto = cuenta.estudiantes + cuenta.docentes + cuenta.asignaturas + cuenta.notas;
      showToast(aporto > 0
        ? 'Conectado. Se subieron ' + aporto + ' dato(s) de este equipo al Drive.'
        : 'Conectado con los datos del centro escolar.');
    }else{
      await nubeEscribir(JSON.stringify(mio));  // primer equipo: sube lo que tiene
      showToast('Conectado. Se subieron los datos actuales.');
    }
    setSyncStatus('ok');
    iniciarSync();
    render();
  }catch(e){
    console.error(e);
    setSyncUrl('');
    showToast('No se pudo conectar. Revisa que el acceso sea "Cualquier usuario".');
    render();
  }
}
function quitarSyncUrl(){
  if(!confirm('¿Desconectar este equipo? Los datos dejarán de compartirse.')) return;
  setSyncUrl('');
  if(ENLACE_FIJO){ showToast('Este sistema trae el enlace del centro escolar integrado: volverá a conectarse solo.'); }
  motor = null;
  detectarMotor().then(()=>{ setSyncStatus('ok'); render(); });
}

/* ============================= PERMISOS ============================= */
/* Clave guardada como número derivado, no como texto plano.
   Es una barrera de uso interno, no cifrado de grado bancario. */
function hashClave(txt){
  let h = 5381;
  for(let i=0;i<txt.length;i++){ h = ((h*33) ^ txt.charCodeAt(i)) >>> 0; }
  return 'h' + h.toString(36);
}
function tieneClave(u){ return !!(u && u.clave); }

/* Los estudiantes guardan nombres y apellidos por separado.
   El campo "nombre" se mantiene sincronizado para el resto del sistema. */
function nombreCompleto(nombres, apellidos){
  return ((nombres||'').trim() + ' ' + (apellidos||'').trim()).trim();
}
function separarNombre(completo){
  const partes = (completo||'').trim().split(/\s+/).filter(Boolean);
  if(partes.length <= 1) return {nombres: partes[0]||'', apellidos:''};
  if(partes.length === 2) return {nombres: partes[0], apellidos: partes[1]};
  if(partes.length === 3) return {nombres: partes.slice(0,2).join(' '), apellidos: partes[2]};
  return {nombres: partes.slice(0, partes.length-2).join(' '), apellidos: partes.slice(-2).join(' ')};
}
/* Rellena nombres/apellidos en registros creados antes de esta versión */
function normalizarEstudiante(e){
  if(e.nombres === undefined || e.apellidos === undefined){
    const p = separarNombre(e.nombre);
    e.nombres = p.nombres;
    e.apellidos = p.apellidos;
  }
  e.nombre = nombreCompleto(e.nombres, e.apellidos) || e.nombre;
  return e;
}
function apellidosDe(e){ return (e.apellidos||'').trim() || (e.nombre||''); }
function nombresDe(e){ return (e.nombres||'').trim() || (e.nombre||''); }
/* Ordena por nombres o por apellidos, según lo elegido en pantalla */
function ordenarEstudiantes(lista, criterio){
  const col = new Intl.Collator('es', {sensitivity:'base'});
  return lista.slice().sort((a,b)=>{
    if(criterio === 'apellidos'){
      return col.compare(apellidosDe(a), apellidosDe(b)) || col.compare(nombresDe(a), nombresDe(b));
    }
    return col.compare(nombresDe(a), nombresDe(b)) || col.compare(apellidosDe(a), apellidosDe(b));
  });
}

/* Un docente puede tener más de un grado de orientación */
function orientacionesDe(u){
  if(!u) return [];
  if(Array.isArray(u.orientaciones)) return u.orientaciones.filter(Boolean);
  return u.orientacion ? [u.orientacion] : [];
}
function esOrientador(u, grado){ return orientacionesDe(u).indexOf(grado) >= 0; }

/* Para el saludo: omite el tratamiento (Lic., Profa., Miss…) y usa el nombre */
const TRATAMIENTOS = ['lic','lic.','licda','licda.','prof','prof.','profa','profa.','sra','sra.','sr','sr.',
  'srta','srta.','ing','ing.','miss','mtro','mtro.','mtra','mtra.','dr','dr.','dra','dra.'];
function nombrePila(completo){
  const partes = String(completo||'').trim().split(/\s+/).filter(Boolean);
  if(partes.length > 1 && TRATAMIENTOS.indexOf(partes[0].toLowerCase()) >= 0) return partes[1];
  return partes[0] || '';
}
/* Saludo: las dos primeras palabras del nombre tal como está registrado */
function saludoNombre(completo){
  const partes = String(completo||'').trim().split(/\s+/).filter(Boolean);
  return partes.slice(0, 2).join(' ');
}

function isAdmin(u){ return u && u.tipo === 'admin'; }
function isDireccion(u){ return u && u.dominio === 'direccion'; }
function canAccessGrado(u, grado){
  if(!u) return false;
  if(isAdmin(u)) return true;
  if(esOrientador(u, grado)) return true;
  return u.asignaciones.some(a=>a.grado===grado);
}
function canEditGrades(u, grado, asignaturaId){
  if(!u) return false;
  if(isAdmin(u)) return true;
  if(esOrientador(u, grado)) return true;
  return u.asignaciones.some(a=>a.grado===grado && a.asignaturaId===asignaturaId);
}
function canManageAcademicData(u){ return isAdmin(u); }
function canEditTeacherAccount(u, target){
  if(isDireccion(u)) return true;
  if(isAdmin(u) && target.tipo === 'docente') return true;
  return false;
}
function misGrados(u){
  if(isAdmin(u)) return DB.config.grados.slice();
  const set = new Set(u.asignaciones.map(a=>a.grado));
  orientacionesDe(u).forEach(g=>set.add(g));
  return DB.config.grados.filter(g=>set.has(g));
}
/* Materias que este usuario puede ver en un grado:
   administración y orientador(a) ven todas; el resto, solo las que imparte. */
function asignaturasVisibles(grado, u){
  u = u || currentUser;
  const todas = asignaturasDeGrado(grado);
  if(!u) return [];
  if(isAdmin(u) || esOrientador(u, grado)) return todas;
  return todas.filter(a=>(u.asignaciones||[]).some(x=>x.grado===grado && x.asignaturaId===a.id));
}
function verGradoCompleto(grado, u){
  u = u || currentUser;
  return !!u && (isAdmin(u) || esOrientador(u, grado));
}
function asignaturasDeGrado(grado){
  const ids = new Set((DB.curriculo && DB.curriculo[grado]) || []);
  DB.docentes.forEach(d=>d.asignaciones.forEach(a=>{ if(a.grado===grado) ids.add(a.asignaturaId); }));
  return DB.asignaturas.filter(s=>ids.has(s.id));
}
function docenteDeAsignatura(grado, asignaturaId){
  return DB.docentes.find(d=>d.asignaciones.some(a=>a.grado===grado && a.asignaturaId===asignaturaId));
}

/* ============================= ACTIVIDADES (casillas 20%) ============================= */
function actividadesKey(grado, asigId){ return grado+'|'+asigId; }
/* SOLO LECTURA: nunca escribe. Las casillas por defecto usan ids fijos, así todos
   los dispositivos coinciden aunque todavía no se hayan guardado. */
function getActividades(grado, asigId){
  if(!DB.actividades) DB.actividades = {};
  const key = actividadesKey(grado, asigId);
  if(!DB.actividades[key]){
    DB.actividades[key] = [1,2,3,4,5,6].map(n=>({id:'act'+n, nombre:'Actividad '+n}));
  }
  return DB.actividades[key];
}
function mutarActividades(grado, asigId, fn){
  const key = actividadesKey(grado, asigId);
  const base = getActividades(grado, asigId);
  return commit(doc=>{
    if(!doc.actividades) doc.actividades = {};
    if(!doc.actividades[key]) doc.actividades[key] = base.map(a=>({id:a.id, nombre:a.nombre}));
    fn(doc.actividades[key]);
  });
}
async function addActividad(grado, asigId){
  await mutarActividades(grado, asigId, lista=>{
    let n = lista.length+1;
    while(lista.some(a=>a.id==='act'+n)) n++;
    lista.push({id:'act'+n, nombre:'Actividad '+n});
  });
  render();
}
async function renameActividad(grado, asigId, actId, nombre){
  const limpio = nombre.trim();
  if(!limpio) return;
  await mutarActividades(grado, asigId, lista=>{
    const a = lista.find(x=>x.id===actId);
    if(a) a.nombre = limpio;
  });
  render();
}
async function removeActividad(grado, asigId, actId){
  if(!confirm('¿Eliminar esta casilla de actividad? Se perderán las notas registradas en ella.')) return;
  await mutarActividades(grado, asigId, lista=>{
    const i = lista.findIndex(a=>a.id===actId);
    if(i>=0) lista.splice(i,1);
  });
  const compKey = 'act:'+actId;
  commit(doc=>{
    Object.keys(doc.calificaciones).forEach(k=>{
      const p = k.split('|');
      if(p[1]===asigId && p[3]===compKey) delete doc.calificaciones[k];
    });
  });
  render();
}

/* Construye el registro de tareas a partir de lo cargado en Calificaciones */
function listaTareas(filtro){
  filtro = filtro || {};
  const filas = [];
  const gradosVisibles = misGrados(currentUser);
  DB.estudiantes.forEach(est=>{
    if(gradosVisibles.indexOf(est.grado) < 0) return;
    if(filtro.grado && est.grado !== filtro.grado) return;
    if(filtro.estudiante && est.id !== filtro.estudiante) return;
    asignaturasDeGrado(est.grado).forEach(asig=>{
      if(filtro.asigId && asig.id !== filtro.asigId) return;
      if(!isAdmin(currentUser) && !esOrientador(currentUser, est.grado) &&
         !currentUser.asignaciones.some(a=>a.grado===est.grado && a.asignaturaId===asig.id)) return;
      const acts = getActividades(est.grado, asig.id);
      for(let p=1; p<=4; p++){
        if(filtro.periodo && Number(filtro.periodo) !== p) continue;
        const entradas = acts.map(a=>({id:a.id, nombre:a.nombre, comp:'act:'+a.id, tipo:'Actividad'}))
          .concat(rubrosTarea().map(r=>({id:r.key, nombre:getNombreRubro(est.grado, asig.id, r.key), comp:r.key, tipo:r.nombre})));
        entradas.forEach(ent=>{
          const estado = getEstado(est.id, asig.id, p, ent.id);
          const fecha = getFechaTarea(est.grado, asig.id, ent.id, p);
          const nota = getComp(est.id, asig.id, p, ent.comp);
          const obs = getObs(est.id, asig.id, p, ent.comp);
          if(!estado && !fecha && nota===undefined && !obs) return;  // aún sin usar
          if(filtro.estado && estado !== filtro.estado) return;
          filas.push({fecha, grado:est.grado, materia:asig.nombre, asigId:asig.id,
            estudiante:est.nombre, estId:est.id, tarea:ent.nombre, tipo:ent.tipo, periodo:p,
            estado, nota, obs});
        });
      }
    });
  });
  filas.sort((a,b)=>{
    if(a.fecha && b.fecha && a.fecha !== b.fecha) return b.fecha.localeCompare(a.fecha);
    if(a.fecha && !b.fecha) return -1;
    if(!a.fecha && b.fecha) return 1;
    return a.estudiante.localeCompare(b.estudiante,'es');
  });
  return filas;
}
/* Alertas: 2 pendientes = amarilla, 3 = naranja, 4 o más = roja */
function nivelAlerta(cantidad){
  if(cantidad >= 4) return {nivel:'roja', nombre:'Roja', clase:'alerta-roja'};
  if(cantidad === 3) return {nivel:'naranja', nombre:'Naranja', clase:'alerta-naranja'};
  if(cantidad === 2) return {nivel:'amarilla', nombre:'Amarilla', clase:'alerta-amarilla'};
  return null;
}
function calcularAlertas(filtro){
  const pendientes = listaTareas(filtro).filter(f=>f.estado === 'no');
  const porEstudiante = {};
  pendientes.forEach(f=>{
    if(!porEstudiante[f.estId]) porEstudiante[f.estId] = {estudiante:f.estudiante, grado:f.grado, filas:[], materias:{}};
    porEstudiante[f.estId].filas.push(f);
    porEstudiante[f.estId].materias[f.materia] = true;
  });
  const orden = {roja:0, naranja:1, amarilla:2};
  return Object.keys(porEstudiante).map(id=>{
    const g = porEstudiante[id];
    const al = nivelAlerta(g.filas.length);
    return al ? Object.assign({}, g, {alerta:al, cantidad:g.filas.length,
      materias:Object.keys(g.materias)}) : null;
  }).filter(Boolean).sort((a,b)=> orden[a.alerta.nivel]-orden[b.alerta.nivel] ||
      a.estudiante.localeCompare(b.estudiante,'es'));
}

/* ============================= CALCULOS ============================= */
function getComp(estId, asigId, periodo, comp){
  return DB.calificaciones[estId+'|'+asigId+'|'+periodo+'|'+comp];
}
function setComp(estId, asigId, periodo, comp, value){
  const key = estId+'|'+asigId+'|'+periodo+'|'+comp;
  if(value===null || value===undefined || value===''){ delete DB.calificaciones[key]; }
  else { DB.calificaciones[key] = Number(value); }
}
/* Nota efectiva de un rubro. Si tiene recuperación, vale la más alta de las dos. */
function claveRecuperacion(key){ return key + '_rec'; }
function notaRubro(estId, asigId, periodo, rubro){
  const base = getComp(estId, asigId, periodo, rubro.key);
  if(!rubro.conRecuperacion) return (base===undefined||base===null||isNaN(base)) ? null : base;
  const rec = getComp(estId, asigId, periodo, claveRecuperacion(rubro.key));
  const vals = [base, rec].filter(v=>v!==undefined && v!==null && !isNaN(v));
  return vals.length ? Math.max.apply(null, vals) : null;
}
/* Calcula la nota del período con lo que ya esté cargado.
   Devuelve {valor, completo, avance}: el promedio se muestra desde la primera nota,
   repartiendo proporcionalmente entre los rubros ya calificados. */
function periodInfo(estId, asigId, periodo, grado){
  const acts = getActividades(grado, asigId);
  let suma = 0, pesoUsado = 0, pesoTotal = 0, completo = true;

  const pesoAct = pesoDe('actividades');
  pesoTotal += pesoAct;
  if(acts.length > 0){
    const vals = acts.map(a=>getComp(estId, asigId, periodo, 'act:'+a.id))
                     .filter(v=>v!==undefined && v!==null && !isNaN(v));
    if(vals.length > 0){
      const actAvg = vals.reduce((s,v)=>s+v,0)/vals.length;
      suma += actAvg * pesoAct;
      pesoUsado += pesoAct;
    }
    if(vals.length < acts.length) completo = false;
  }else{
    completo = false;
  }

  for(const r of rubrosActivos()){
    const p = pesoDe(r.key);
    pesoTotal += p;
    const v = notaRubro(estId, asigId, periodo, r);
    if(v === null){ completo = false; continue; }
    suma += v * p;
    pesoUsado += p;
  }

  if(pesoUsado === 0) return {valor:null, completo:false, avance:0};
  return {
    valor: suma / pesoUsado,           // promedio de lo calificado hasta ahora
    completo: completo,
    avance: pesoTotal>0 ? pesoUsado/pesoTotal : 0
  };
}
/* Compatibilidad: la nota del período tal como se muestra */
function periodScore(estId, asigId, periodo, grado){
  return periodInfo(estId, asigId, periodo, grado).valor;
}
function periodScoreCompleto(estId, asigId, periodo, grado){
  const i = periodInfo(estId, asigId, periodo, grado);
  return i.completo ? i.valor : null;
}
/* Promedio de la asignatura con los períodos que ya tengan nota */
function subjectInfo(estId, asigId, grado){
  const infos = [1,2,3,4].map(p=>periodInfo(estId, asigId, p, grado));
  const conNota = infos.filter(i=>i.valor !== null);
  if(conNota.length === 0) return {valor:null, completo:false, periodos:0};
  return {
    valor: conNota.reduce((s,i)=>s+i.valor,0)/conNota.length,
    completo: conNota.length === 4 && conNota.every(i=>i.completo),
    periodos: conNota.length
  };
}
function subjectFinal(estId, asigId, grado){
  return subjectInfo(estId, asigId, grado).valor;
}
function studentInfo(estId, grado){
  const asigs = asignaturasDeGrado(grado);
  const infos = asigs.map(a=>subjectInfo(estId, a.id, grado)).filter(i=>i.valor!==null);
  if(infos.length===0) return {valor:null, completo:false};
  return {
    valor: infos.reduce((s,i)=>s+i.valor,0)/infos.length,
    completo: infos.length === asigs.length && infos.every(i=>i.completo)
  };
}
function studentFinalAverage(estId, grado){
  return studentInfo(estId, grado).valor;
}

let selloVisto = '';
function hoyTexto(){ return new Date().toISOString().slice(0,10); }
/* Huella del mensaje: si Dirección lo cambia, se vuelve a mostrar el mismo día */
function huellaMensaje(txt){
  let h = 5381;
  for(let i=0;i<txt.length;i++) h = ((h*33) ^ txt.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
/* El sello incluye al usuario: si en este dispositivo entra alguien que
   todavía no lo ha visto, el mensaje le aparece aunque otro ya lo haya aceptado. */
function selloActual(){
  const txt = (DB.ajustes && DB.ajustes.mensajeBienvenida) || '';
  const quien = currentUser ? currentUser.id : 'nadie';
  return quien + '|' + hoyTexto() + '|' + huellaMensaje(txt);
}
/* Lee el registro de "ya lo vi". Si viene en un formato viejo o dañado,
   se descarta y se empieza de cero en lugar de fallar. */
function leerVistos(){
  try{
    const crudo = window.localStorage.getItem('mensaje_visto');
    if(!crudo) return {};
    const dato = JSON.parse(crudo);
    if(dato && typeof dato === 'object' && !Array.isArray(dato)) return dato;
    window.localStorage.removeItem('mensaje_visto');   // formato anterior: se descarta
    return {};
  }catch(e){
    try{ window.localStorage.removeItem('mensaje_visto'); }catch(e2){}  // valor dañado
    return {};
  }
}
function quienSoy(){ return currentUser ? currentUser.id : 'nadie'; }
function debeMostrarMensaje(){
  const txt = (DB.ajustes && DB.ajustes.mensajeBienvenida) || '';
  if(!txt) return false;
  const sello = selloActual();
  if(selloVisto === sello) return false;       // ya se aceptó en esta sesión
  return leerVistos()[quienSoy()] !== sello;   // ya se aceptó hoy en este dispositivo
}
function cerrarMensajeBienvenida(){
  selloVisto = selloActual();
  const vistos = leerVistos();
  vistos[quienSoy()] = selloVisto;
  const hoy = hoyTexto();
  Object.keys(vistos).forEach(k=>{             // se limpian registros de días anteriores
    const partes = String(vistos[k]).split('|');
    if(partes[1] && partes[1] !== hoy) delete vistos[k];
  });
  try{ window.localStorage.setItem('mensaje_visto', JSON.stringify(vistos)); }
  catch(e){ console.error('no se pudo registrar el mensaje visto', e); }
  render();
}

function descargarListado(){

async function saveStudent(){
  if(!puedeGestionarEstudiantes(currentUser)){ showToast('No tienes permiso para modificar estudiantes.'); return; }
  const nombres = document.getElementById('f_nombres').value.trim();
  const apellidos = document.getElementById('f_apellidos').value.trim();
  const grado = document.getElementById('f_grado').value;
  if(!nombres){ showToast('Escribe los nombres del estudiante.'); return; }
  if(!apellidos){ showToast('Escribe los apellidos del estudiante.'); return; }
  const nombre = nombreCompleto(nombres, apellidos);
  let item;
  if(editingId){
    const e = DB.estudiantes.find(x=>x.id===editingId) || {id:editingId};
    item = Object.assign({}, e, {nombres, apellidos, nombre, grado});
  }else{
    item = {id:uid('est'), nombres, apellidos, nombre, grado};
  }
  commit(doc=>{
    const i = doc.estudiantes.findIndex(x=>x.id===item.id);
    if(i>=0) doc.estudiantes[i] = item; else doc.estudiantes.push(item);
  });
  showToast('Estudiante guardado. Ya es visible para los demás docentes de '+grado+'.');
  closeModal();
}
async function deleteStudent(id){
  if(!puedeGestionarEstudiantes(currentUser)){ showToast('No tienes permiso para eliminar estudiantes.'); return; }
  if(!confirm('¿Eliminar este estudiante? También se borrarán sus calificaciones.')) return;
  commit(doc=>{
    const i = doc.estudiantes.findIndex(x=>x.id===id);
    if(i>=0) doc.estudiantes.splice(i,1);
    Object.keys(doc.calificaciones).forEach(k=>{ if(k.startsWith(id+'|')) delete doc.calificaciones[k]; });
  });
  showToast('Estudiante eliminado.');
  render();
}

async function addSubject(){
  const input = document.getElementById('new_subject');
  const nombre = input.value.trim();
  if(!nombre){ showToast('Escribe el nombre de la asignatura.'); return; }
  const grados = [];
  DB.config.grados.forEach((g,i)=>{
    const chk = document.getElementById('ng_'+i);
    if(chk && chk.checked) grados.push(g);
  });
  if(grados.length===0){ showToast('Selecciona al menos un grado.'); return; }
  const nueva = {id:uid('asig'), nombre};
  commit(doc=>{
    doc.asignaturas.push(nueva);
    if(!doc.curriculo) doc.curriculo = {};
    grados.forEach(g=>{
      doc.curriculo[g] = doc.curriculo[g] || [];
      if(doc.curriculo[g].indexOf(nueva.id)<0) doc.curriculo[g].push(nueva.id);
    });
  });
  showToast('Asignatura agregada.');
  render();
}
function toggleGradoAsignatura(asigId, grado){
  const docenteAsignado = DB.docentes.some(d=>d.asignaciones.some(a=>a.grado===grado && a.asignaturaId===asigId));
  const estaba = asignaturasDeGrado(grado).some(x=>x.id===asigId);
  if(estaba && docenteAsignado){
    showToast('Primero quita la asignación del docente en la pantalla Docentes.');
    return;
  }
  commit(doc=>{
    if(!doc.curriculo) doc.curriculo = {};
    doc.curriculo[grado] = doc.curriculo[grado] || [];
    const i = doc.curriculo[grado].indexOf(asigId);
    if(i>=0) doc.curriculo[grado].splice(i,1); else doc.curriculo[grado].push(asigId);
  });
  render();
}
async function deleteSubject(id){
  if(!confirm('¿Eliminar esta asignatura? Se quitará de las asignaciones de los docentes.')) return;
  commit(doc=>{
    const i = doc.asignaturas.findIndex(x=>x.id===id);
    if(i>=0) doc.asignaturas.splice(i,1);
    doc.docentes.forEach(d=> d.asignaciones = (d.asignaciones||[]).filter(a=>a.asignaturaId!==id));
    Object.keys(doc.calificaciones).forEach(k=>{ if(k.split('|')[1]===id) delete doc.calificaciones[k]; });
    Object.keys(doc.actividades).forEach(k=>{ if(k.split('|')[1]===id) delete doc.actividades[k]; });
  });
  showToast('Asignatura eliminada.');
  render();
}

function agregarDominio(){
  if(!isDireccion(currentUser)) return;
  const persona = prompt('Nombre de la persona a cargo (ej.: Lic. Rosa Méndez):');
  if(persona === null) return;
  const nombrePersona = persona.trim();
  if(!nombrePersona){ showToast('Escribe el nombre de la persona.'); return; }
  const dom = prompt('Nombre del dominio (ej.: Subdirección, Consejo Académico):');
  if(dom === null) return;
  const nombreDominio = dom.trim();
  if(!nombreDominio){ showToast('Escribe el nombre del dominio.'); return; }
  const nuevo = {id:uid('t'), nombre:nombrePersona, tipo:'admin', dominio:uid('dom'),
    dominioNombre:nombreDominio, asignaciones:[], orientacion:null};
  commit(doc=>{ doc.docentes.push(nuevo); });
  showToast('Dominio agregado con acceso total.');
  render();
}
function renombrarDominio(id, nombre){
  const limpio = (nombre||'').trim();
  const t = DB.docentes.find(x=>x.id===id);
  if(!t) return;
  if(t.dominio === 'direccion'){ showToast('El dominio de Dirección no se puede renombrar.'); render(); return; }
  if(!limpio){ showToast('El dominio necesita un nombre.'); render(); return; }
  commit(doc=>{
    const d = doc.docentes.find(x=>x.id===id);
    if(d) d.dominioNombre = limpio;
  });
  showToast('Dominio renombrado.');
  render();
}
function eliminarDominio(id){
  const t = DB.docentes.find(x=>x.id===id);
  if(!t) return;
  if(t.dominio === 'direccion'){ showToast('El dominio de Dirección no se puede eliminar.'); return; }
  if(id === currentUser.id){ showToast('No puedes eliminar tu propia cuenta mientras la usas.'); return; }
  if(!confirm('¿Eliminar la cuenta de "' + t.nombre + '" (' + domainLabel(t) + ')?')) return;
  commit(doc=>{
    const i = doc.docentes.findIndex(x=>x.id===id);
    if(i>=0) doc.docentes.splice(i,1);
  });
  showToast('Dominio eliminado.');
  render();
}

async function addAsigToModal(){
  const asigId = document.getElementById('new_asig_select').value;
  const grado = document.getElementById('new_grado_select').value;
  const t = editingId ? DB.docentes.find(x=>x.id===editingId) : null;
  if(!t){ showToast('Guarda el docente primero para agregar asignaturas.'); return; }
  if(t.asignaciones.some(a=>a.grado===grado && a.asignaturaId===asigId)){ showToast('Esa asignación ya existe.'); return; }
  const objetivo = editingId;
  commit(doc=>{
    const d = doc.docentes.find(x=>x.id===objetivo);
    if(d){
      d.asignaciones = d.asignaciones||[];
      if(!d.asignaciones.some(a=>a.grado===grado && a.asignaturaId===asigId)) d.asignaciones.push({grado, asignaturaId:asigId});
    }
  });
  render();
}
async function removeAsigFromModal(index){
  const actual = DB.docentes.find(x=>x.id===editingId);
  if(!actual || !actual.asignaciones[index]) return;
  const {grado, asignaturaId} = actual.asignaciones[index];
  const objetivo = editingId;
  commit(doc=>{
    const d = doc.docentes.find(x=>x.id===objetivo);
    if(d) d.asignaciones = (d.asignaciones||[]).filter(a=>!(a.grado===grado && a.asignaturaId===asignaturaId));
  });
  render();
}
async function saveTeacher(esAdmin){
  const nombre = document.getElementById('t_nombre').value.trim();
  if(!nombre){ showToast('Escribe el nombre del docente.'); return; }
  const orientaciones = [];
  DB.config.grados.forEach((g,i)=>{
    const chk = document.getElementById('t_ori_'+i);
    if(chk && chk.checked) orientaciones.push(g);
  });
  if(editingId){
    const objetivo = editingId;
    commit(doc=>{
      const t = doc.docentes.find(x=>x.id===objetivo);
      if(t){ t.nombre = nombre; if(!esAdmin){ t.orientaciones = orientaciones; delete t.orientacion; } }
    });
  }else{
    const nuevo = {id:uid('t'), nombre, tipo:'docente', dominio:null, asignaciones:[], orientaciones:orientaciones};
    commit(doc=>{ doc.docentes.push(nuevo); });
  }
  showToast('Docente guardado.');
  closeModal();
}
async function deleteTeacher(id){
  const t = DB.docentes.find(x=>x.id===id);
  if(t && t.tipo==='admin'){ showToast('No se pueden eliminar las cuentas de dominio.'); return; }
  if(id === currentUser.id){ showToast('No puedes eliminar tu propia cuenta mientras la usas.'); return; }
  if(!confirm('¿Eliminar este docente?')) return;
  commit(doc=>{
    const i = doc.docentes.findIndex(x=>x.id===id);
    if(i>=0) doc.docentes.splice(i,1);
  });
  showToast('Docente eliminado.');
  render();
}

/* Lee la tabla tal como está en pantalla, sin perder lo que el usuario acaba de escribir */
function leerPonderacionFormulario(){
  const lista = rubrosActivos();
  const elAct = document.getElementById('pw_actividades');
  const actividades = elAct ? Math.max(0, Math.min(100, Number(elAct.value)||0)) : Math.round(pesoDe('actividades')*100);
  let suma = actividades;
  const rubros = lista.map((r,i)=>{
    const nom = document.getElementById('rb_nom_'+i);
    const pes = document.getElementById('rb_peso_'+i);
    const tar = document.getElementById('rb_tar_'+i);
    const rec = document.getElementById('rb_rec_'+i);
    const peso = pes ? Math.max(0, Math.min(100, Number(pes.value)||0)) : Math.round(r.peso*100);
    suma += peso;
    return {key:r.key, nombre: nom ? nom.value.trim() : r.nombre, pesoPct:peso,
      tarea: tar ? !!tar.checked : !!r.tarea,
      conRecuperacion: rec ? !!rec.checked : !!r.conRecuperacion};
  });
  return {actividades, rubros, suma};
}
function previewPesos(){
  const {suma} = leerPonderacionFormulario();
  const el = document.getElementById('pw_total');
  if(el){
    el.textContent = suma + '%';
    el.className = 'pill ' + (suma===100 ? 'pill-primary' : 'pill-rojo');
  }
}
function aplicarPonderacion(actividades, rubros){
  commit(doc=>{
    doc.config = doc.config || {};
    doc.config.pesos = {actividades: actividades/100};
    doc.config.rubros = rubros.map(r=>({key:r.key, nombre:r.nombre, peso:r.pesoPct/100, tarea:r.tarea, conRecuperacion:r.conRecuperacion}));
  });
}
function agregarRubro(){
  const {actividades, rubros} = leerPonderacionFormulario();
  rubros.push({key:uid('rb'), nombre:'Nuevo rubro', pesoPct:0, tarea:false, conRecuperacion:false});
  aplicarPonderacion(actividades, rubros);
  showToast('Rubro agregado. Ponle nombre y porcentaje, luego guarda.');
  render();
}
function quitarRubro(indice){
  const lista = rubrosActivos();
  const r = lista[indice];
  if(!r) return;
  if(lista.length <= 1){ showToast('Debe quedar al menos un rubro además de Actividades.'); return; }
  const usos = Object.keys(DB.calificaciones||{}).filter(k=>k.split('|')[3]===r.key).length;
  const aviso = usos>0
    ? '¿Quitar el rubro "'+r.nombre+'"? Se borrarán '+usos+' nota(s) ya cargada(s) en él y no se pueden recuperar.'
    : '¿Quitar el rubro "'+r.nombre+'"?';
  if(!confirm(aviso)) return;
  const {actividades, rubros} = leerPonderacionFormulario();
  const restantes = rubros.filter((x,i)=>i!==indice);
  commit(doc=>{
    doc.config = doc.config || {};
    doc.config.pesos = {actividades: actividades/100};
    doc.config.rubros = restantes.map(x=>({key:x.key, nombre:x.nombre, peso:x.pesoPct/100, tarea:x.tarea, conRecuperacion:x.conRecuperacion}));
    ['calificaciones','observaciones','estados'].forEach(mapa=>{
      if(!doc[mapa]) return;
      Object.keys(doc[mapa]).forEach(k=>{
        const c = k.split('|')[3];
        if(c===r.key || c===claveRecuperacion(r.key)) delete doc[mapa][k];
      });
    });
    if(doc.tareas) Object.keys(doc.tareas).forEach(k=>{ if(k.split('|')[2]===r.key) delete doc.tareas[k]; });
    if(doc.rubros) Object.keys(doc.rubros).forEach(k=>{ if(k.split('|')[2]===r.key) delete doc.rubros[k]; });
  });
  showToast('Rubro quitado. Revisa que los porcentajes sumen 100%.');
  render();
}
function guardarPesos(){
  const {actividades, rubros, suma} = leerPonderacionFormulario();
  if(rubros.some(r=>!r.nombre)){ showToast('Todos los rubros deben tener nombre.'); return; }
  if(suma !== 100){
    showToast('Los porcentajes deben sumar exactamente 100%. Ahora suman ' + suma + '%.');
    return;
  }
  aplicarPonderacion(actividades, rubros);
  showToast('Ponderación guardada. Las notas se recalcularon.');
  render();
}

            </td>
            <td><button class="btn btn-sm btn-danger" onclick="eliminarGrado(${i})">Eliminar</button></td>
          </tr>`).join('')}

function agregarGrado(){
  const campo = document.getElementById('nuevo_grado');
  const nombre = campo.value.trim();
  if(!nombre){ showToast('Escribe el nombre del grado.'); return; }
  if((DB.config.grados||[]).some(g=>g.toLowerCase()===nombre.toLowerCase())){
    showToast('Ese grado ya existe.'); return;
  }
  commit(doc=>{
    doc.config = doc.config || {};
    doc.config.grados = doc.config.grados || [];
    doc.config.grados.push(nombre);
    doc.curriculo = doc.curriculo || {};
    doc.curriculo[nombre] = doc.curriculo[nombre] || [];
  });
  campo.value = '';
  showToast('Grado agregado.');
  render();
}
function moverGrado(i, dir){
  const destino = i + dir;
  commit(doc=>{
    const g = doc.config.grados;
    if(destino < 0 || destino >= g.length) return;
    const tmp = g[i]; g[i] = g[destino]; g[destino] = tmp;
  });
  render();
}
/* Renombrar arrastra el cambio a estudiantes, docentes, currículo, actividades y tareas */
function renombrarGrado(i, nuevo){
  const limpio = (nuevo||'').trim();
  const anterior = DB.config.grados[i];
  if(!limpio || limpio === anterior){ render(); return; }
  if(DB.config.grados.some((g,j)=>j!==i && g.toLowerCase()===limpio.toLowerCase())){
    showToast('Ya existe un grado con ese nombre.');
    render();
    return;
  }
  commit(doc=>{
    doc.config.grados[i] = limpio;
    (doc.estudiantes||[]).forEach(e=>{ if(e.grado===anterior) e.grado = limpio; });
    (doc.docentes||[]).forEach(d=>{
      if(Array.isArray(d.orientaciones)) d.orientaciones = d.orientaciones.map(x=>x===anterior?limpio:x);
      if(d.orientacion===anterior) d.orientacion = limpio;
      (d.asignaciones||[]).forEach(a=>{ if(a.grado===anterior) a.grado = limpio; });
    });
    if(doc.curriculo && doc.curriculo[anterior]){
      doc.curriculo[limpio] = doc.curriculo[anterior];
      delete doc.curriculo[anterior];
    }
    ['actividades','tareas','rubros'].forEach(mapa=>{
      if(!doc[mapa]) return;
      Object.keys(doc[mapa]).forEach(k=>{
        const p = k.split('|');
        if(p[0] === anterior){
          p[0] = limpio;
          doc[mapa][p.join('|')] = doc[mapa][k];
          delete doc[mapa][k];
        }
      });
    });
  });
  showToast('Grado renombrado en todo el sistema.');
  render();
}
function eliminarGrado(i){
  const g = DB.config.grados[i];
  const cuantos = DB.estudiantes.filter(e=>e.grado===g).length;
  if(cuantos > 0){
    showToast('No se puede eliminar: hay ' + cuantos + ' estudiante(s) en ese grado. Muévelos primero.');
    return;
  }
  if(!confirm('¿Eliminar el grado "' + g + '"? También se quitarán las asignaciones de docentes a ese grado.')) return;
  commit(doc=>{
    doc.config.grados.splice(i,1);
    if(doc.curriculo) delete doc.curriculo[g];
    (doc.docentes||[]).forEach(d=>{
      if(Array.isArray(d.orientaciones)) d.orientaciones = d.orientaciones.filter(x=>x!==g);
      if(d.orientacion===g) d.orientacion = null;
      d.asignaciones = (d.asignaciones||[]).filter(a=>a.grado!==g);
    });
    ['actividades','tareas','rubros'].forEach(mapa=>{
      if(!doc[mapa]) return;
      Object.keys(doc[mapa]).forEach(k=>{ if(k.split('|')[0] === g) delete doc[mapa][k]; });
    });
  });
  showToast('Grado eliminado.');
  render();
}

function ejecutarCierre(){
  if(document.getElementById('c_confirma').value.trim().toUpperCase() !== 'CERRAR'){
    showToast('Escribe la palabra CERRAR para confirmar.');
    return;
  }
  const grados = DB.config.grados;
  const anioNuevo = document.getElementById('c_anio').value.trim() || String(new Date().getFullYear()+1);
  const destino = {};
  grados.forEach((g,i)=>{
    const v = document.getElementById('c_dest_'+i).value;
    if(v === 'egresa') destino[g] = null;
    else if(v === 'queda') destino[g] = g;
    else destino[g] = grados[Number(v)] || g;
  });
  let promovidos = 0, egresados = 0;
  commit(doc=>{
    doc.calificaciones = {};
    doc.estados = {};
    doc.observaciones = {};
    doc.tareas = {};
    doc.estudiantes = (doc.estudiantes||[]).filter(e=>{
      const d = destino[e.grado];
      if(d === null || d === undefined){ egresados++; return false; }
      if(d !== e.grado) promovidos++;
      e.grado = d;
      return true;
    });
    doc.ajustes = doc.ajustes || {};
    doc.ajustes.anio = anioNuevo;
  });
  viewState.cierre = null;
  render();
  showToast('Año cerrado. ' + promovidos + ' promovido(s), ' + egresados + ' egresado(s). Ya puedes trabajar el ' + anioNuevo + '.');
}

function subirLogo(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    if(f.size > 200*1024){ showToast('La imagen supera 200 KB. Usa una más pequeña.'); return; }
    const lector = new FileReader();
    lector.onload = () => {
      commit(doc=>{ doc.ajustes = doc.ajustes || {}; doc.ajustes.logo = lector.result; });
      showToast('Logo actualizado.');
      render();
    };
    lector.readAsDataURL(f);
  };
  inp.click();
}
