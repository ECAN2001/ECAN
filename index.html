}
/* --- edición --- */
/* Resuelve el aula, la asignatura y el período que se están viendo.
   La pantalla y las funciones de edición usan esto mismo, para que lo que
   se escribe se guarde siempre en la hoja que está a la vista. */
function contextoHoja(){
  const gradosVisibles = misGrados(currentUser);
  const pg = getPref('hojaGrado','');
  const grado = (pg && gradosVisibles.includes(pg)) ? pg : (gradosVisibles[0] || '');
  const posibles = !grado ? [] : (isAdmin(currentUser) || esOrientador(currentUser, grado)
    ? asignaturasDeGrado(grado)
    : asignaturasDeGrado(grado).filter(x=>currentUser.asignaciones.some(a=>a.grado===grado && a.asignaturaId===x.id)));
  const pa = getPref('hojaAsig','');
  const asigId = (pa && posibles.some(x=>x.id===pa)) ? pa : (posibles[0] ? posibles[0].id : '');
  const periodo = Number(getPref('hojaPeriodo',1)) || 1;
  return {grado, asigId, periodo, posibles, gradosVisibles};
}
function hojaActual(){ return contextoHoja(); }
let ultimoRegistroHoja = '';
function editarFilaHoja(i, campo, valor){
  const {grado, asigId, periodo} = hojaActual();
  const marca = grado + '|' + asigId + '|' + periodo;
  if(ultimoRegistroHoja !== marca){
    ultimoRegistroHoja = marca;
    const nom = (DB.asignaturas.find(a=>a.id===asigId)||{}).nombre || '';
    registrar('Hoja de tareas', 'Editó la hoja de ' + nom + ' — ' + grado + ' (período ' + periodo + ')');
  }
  mutarHoja(grado, asigId, periodo, h=>{ if(h.filas[i]) h.filas[i][campo] = valor; });
  render();
}
function editarCriterioHoja(i, j, campo, valor){
  const {grado, asigId, periodo} = hojaActual();
  mutarHoja(grado, asigId, periodo, h=>{
    if(!h.filas[i] || !h.filas[i].rubrica[j]) return;
    h.filas[i].rubrica[j][campo] = campo==='peso' ? (parseInt(valor,10)||0) : valor;
  });
  render();
}
function agregarCriterioHoja(i){
  const {grado, asigId, periodo} = hojaActual();
  mutarHoja(grado, asigId, periodo, h=>{
    if(h.filas[i]){ h.filas[i].rubrica = h.filas[i].rubrica || []; h.filas[i].rubrica.push({nombre:'Nuevo criterio', peso:0}); }
  });
  render();
}
function quitarCriterioHoja(i, j){
  const {grado, asigId, periodo} = hojaActual();
  mutarHoja(grado, asigId, periodo, h=>{ if(h.filas[i]) h.filas[i].rubrica.splice(j,1); });
  render();
}
function seleccionarFila(i, ev){
  // Si el clic fue sobre un campo editable, no se selecciona la fila:
  // el docente está escribiendo, no eligiendo dónde insertar.
  if(ev && ev.target && typeof ev.target.closest === 'function'){
    if(ev.target.closest('input, textarea, select, button, a')) return;
  }
  viewState.filaSel = (viewState.filaSel === i) ? null : i;
  render();
}
function agregarFilaHoja(tipo){
  const {grado, asigId, periodo} = hojaActual();
  const cfg = hojaCfg();
  const donde = (typeof viewState.filaSel === 'number') ? viewState.filaSel : null;
  mutarHoja(grado, asigId, periodo, h=>{
    const cuantas = h.filas.filter(f=>f.tipo==='integradora').length;
    const nueva = tipo==='integradora'
      ? {tipo:'integradora', fecha:'', contenido:'', tarea:'', etiqueta: cfg.etiquetas[cuantas]||('INTEGRADORA '+(cuantas+1)), rubrica:[], nota:'', obs:''}
      : {tipo:'tarea', fecha:'', contenido:'', tarea:'', etiqueta:'', rubrica: cfg.rubrica.map(r=>Object.assign({},r)), nota:'', obs:''};
    if(donde !== null && donde >= 0 && donde < h.filas.length) h.filas.splice(donde + 1, 0, nueva);
    else h.filas.push(nueva);
  });
  viewState.filaSel = (donde !== null) ? donde + 1 : null;
  render();
}
function quitarFilaHoja(i){
  if(!confirm('¿Quitar esta fila? Si tenía notas cargadas en Calificaciones, se recorrerán las casillas.')) return;
  const {grado, asigId, periodo} = hojaActual();
  mutarHoja(grado, asigId, periodo, h=>{ h.filas.splice(i,1); });
  render();
}
function cambiarTipoFila(i){
  const {grado, asigId, periodo} = hojaActual();
  const cfg = hojaCfg();
  mutarHoja(grado, asigId, periodo, h=>{
    const f = h.filas[i];
    if(!f) return;
    if(f.tipo === 'tarea'){
      const cuantas = h.filas.filter(x=>x.tipo==='integradora').length;
      f.tipo = 'integradora';
      f.etiqueta = f.etiqueta || cfg.etiquetas[cuantas] || ('INTEGRADORA '+(cuantas+1));
      f.rubrica = [];
    }else{
      f.tipo = 'tarea';
      f.rubrica = cfg.rubrica.map(r=>Object.assign({},r));
    }
  });
  render();
}
function editarExamen(campo, valor){
  const {grado, asigId, periodo} = hojaActual();
  mutarHoja(grado, asigId, periodo, h=>{ h.examen = h.examen || {}; h.examen[campo] = valor; });
  if(campo === 'texto') guardarHojaCfg(c=>{ c.textoExamenes = valor; });   // queda por defecto
  render();
}
function editarEncabezadoHoja(clave, valor){
  const limpio = (valor||'').trim();
  if(!limpio) { render(); return; }
  guardarHojaCfg(c=>{ c.encabezados[clave] = limpio; });
  render();
}
function editarFirmasHoja(){
  const cfg = hojaCfg();
  const v = prompt('Escribe las firmas separadas por punto y coma:', cfg.firmas.join('; '));
  if(v === null) return;
  const lista = v.split(';').map(x=>x.trim()).filter(Boolean);
  if(!lista.length){ showToast('Debe quedar al menos una firma.'); return; }
  guardarHojaCfg(c=>{ c.firmas = lista; });
  render();
}

/* Imprime la hoja de tareas en PDF horizontal, con el logo como marca de agua */
function imprimirHoja(grado, asigId, periodo, alcance){
  const cfg = hojaCfg();
  const aj = DB.ajustes || {};
  const q = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  let combos = [];
  if(alcance === 'todas'){
    misGrados(currentUser).forEach(g=>{
      const asigs = isAdmin(currentUser) || esOrientador(currentUser, g)
        ? asignaturasDeGrado(g)
        : asignaturasDeGrado(g).filter(x=>currentUser.asignaciones.some(a=>a.grado===g && a.asignaturaId===x.id));
      asigs.forEach(a=>combos.push({grado:g, asig:a}));
    });
  }else{
    const a = DB.asignaturas.find(x=>x.id===asigId);
    if(a) combos = [{grado:grado, asig:a}];
  }
  if(combos.length===0){ showToast('No hay asignaturas para imprimir.'); return; }

  const hojaHtml = (grado, asig)=>{
    const h = getHoja(grado, asig.id, periodo);
    const nf = h.filas.length;
    const largo = h.filas.reduce((t,f)=>t + (f.contenido||'').length + (f.tarea||'').length + (f.obs||'').length, 0);
    let pt = 8;
    if(nf > 8 || largo > 900) pt = 7;
    if(nf > 10 || largo > 1400) pt = 6.2;
    if(nf > 12 || largo > 2000) pt = 5.6;
    const doc = docenteDeAsignatura(grado, asig.id);
    const filas = h.filas.map(f=>{
      if(f.tipo === 'integradora'){
        return `<tr>
          <td class="c neg">${q(f.fecha)}</td>
          <td>${q(f.contenido)}</td>
          <td colspan="4" class="c integ">
            <div class="et">${q(f.etiqueta)}</div><div>${q(f.tarea)}</div>
          </td>
          <td>${q(f.nota)}</td>
          <td class="celda-firma"><div class="celfir">${cfg.firmas.map(x=>'<div class="fir">'+q(x)+'</div>').join('')}</div></td>
          <td>${q(f.obs)}</td>
        </tr>`;
      }
      const rub = (f.rubrica||[]).map(r=>
        `<tr><td class="rn">${q(r.nombre)}</td><td class="rp">${q(r.peso)}%</td><td class="rv"></td></tr>`).join('');
      return `<tr>
        <td class="c neg">${q(f.fecha)}</td>
        <td>${q(f.contenido)}</td>
        <td class="c">${q(f.tarea)}</td>
        <td colspan="2" class="sinpad"><table class="rub">${rub}</table></td>
        <td>${q(f.nota)}</td>
        <td class="celda-firma"><div class="celfir">${cfg.firmas.map(x=>'<div class="fir">'+q(x)+'</div>').join('')}</div></td>
        <td>${q(f.obs)}</td>
      </tr>`;
    }).join('');
    return `
    <div class="pagina"><div class="hoja" style="font-size:${pt}pt;">
      ${aj.logo?`<img src="${aj.logo}" class="marca">`:''}
      <p class="titulo">HOJA DE TAREAS ${q(PERIODO_PALABRA[periodo]||'')} PERIODO ${q(asig.nombre.toUpperCase())}.</p>
      <table class="th">
        <tr><td class="grado">Grado: ${q(grado)}</td>
            <td class="doc">DOCENTE: ${q(doc ? doc.nombre : '')}</td></tr>
      </table>
      <table class="tabla">
        <tr>
          <th style="width:7%">${q(cfg.encabezados.fecha)}</th>
          <th style="width:14%">${q(cfg.encabezados.contenidos)}</th>
          <th style="width:20%">${q(cfg.encabezados.tareas)}</th>
          <th colspan="2" style="width:25%">${q(cfg.encabezados.rubrica)}</th>
          <th style="width:7%">${q(cfg.encabezados.nota)}</th>
          <th style="width:11%">${q(cfg.encabezados.firma)}</th>
          <th style="width:16%">${q(cfg.encabezados.observaciones)}</th>
        </tr>
        ${filas}
        <tr><td class="c neg">${q(h.examen.fecha||'')}</td>
            <td colspan="7" class="c examen">${q(h.examen.texto||'')}</td></tr>
      </table>
    </div></div>`;
  };

  const cierre = '<' + '/script>';
  const html = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">' +
  '<title>HOJA DE TAREAS ' + q(PERIODO_PALABRA[periodo]||'') + ' PERIODO ' +
    q(alcance==='todas' ? 'TODAS MIS AULAS' : (grado + ' ' + (combos[0].asig.nombre))).toUpperCase() + '</title><style>' +
  '@page{ size: letter landscape; margin: 12mm; }' +
  '*{ box-sizing:border-box; }' +
  'body{ font-family: Arial, Helvetica, sans-serif; font-size:8pt; color:#000; margin:0; }' +
  '@media screen{ body{ background:#d8d8d8; padding:18px 0; }' +
  '  .pagina{ width:279.4mm; height:215.9mm; padding:12mm; margin:0 auto 18px; background:#fff;' +
  '    box-shadow:0 2px 12px rgba(0,0,0,.28); } }' +
  '@media print{ .pagina{ width:auto; height:auto; padding:0; page-break-after:always; }' +
  '  .pagina:last-child{ page-break-after:auto; } }' +
  '.hoja{ position:relative; height:100%; overflow:hidden; }' +
  '.titulo{ font-size:1.45em; }' +
  '.marca{ position:absolute; top:50%; left:50%; width:120mm; transform:translate(-50%,-50%);' +
  '  opacity:.10; z-index:0; pointer-events:none; }' +
  '.titulo{ text-align:center; font-style:italic; font-weight:bold; font-size:12pt; margin:0 0 5px; }' +
  '.th{ width:100%; border-collapse:collapse; margin-bottom:0; position:relative; z-index:1; }' +
  '.th td{ border:1px solid #000; padding:2px 6px; }' +
  '.grado{ width:16%; background:#FFFF00; font-weight:bold; font-size:11pt; }' +
  '.doc{ text-align:center; font-weight:bold; letter-spacing:.18em; }' +
  '.tabla{ width:100%; border-collapse:collapse; position:relative; z-index:1; table-layout:fixed; }' +
  '.tabla td.celda-firma{ padding:0; }' +
  '.tabla th, .tabla td{ border:1px solid #000; padding:2px 4px; vertical-align:top;' +
  '  word-break:break-word; overflow-wrap:anywhere; }' +
  '.tabla th{ text-align:center; font-weight:bold; font-size:8pt; }' +
  '.c{ text-align:center; } .neg{ font-weight:bold; }' +
  '.sinpad{ padding:0 !important; }' +
  '.rub{ width:100%; border-collapse:collapse; }' +
  '.rub td{ border:1px solid #000; padding:2px 4px; }' +
  '.rn{ width:60%; } .rp{ width:16%; text-align:center; } .rv{ width:24%; }' +
  '.integ{ color:#c00000; font-weight:bold; vertical-align:middle; }' +
  '.integ .et{ text-transform:uppercase; }' +
  '.examen{ font-weight:bold; font-size:10pt; vertical-align:middle; }' +
  '.celfir{ display:flex; flex-direction:column; min-height:56px; height:100%; }' +
  '.fir{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center; }' +
  '</style></head><body>' +
  combos.map(c=>hojaHtml(c.grado, c.asig)).join('') +
  '<script>window.onload=function(){setTimeout(function(){window.print();},350);};' + cierre +
  '</body></html>';

  const v = window.open('', '_blank');
  if(!v){ showToast('El navegador bloqueó la ventana emergente. Permítela e intenta de nuevo.'); return; }
  v.document.write(html);
  v.document.close();
  showToast('En el diálogo de impresión elige "Guardar como PDF".');
}

/* ============================= CALIFICACIONES ============================= */
function renderCalificaciones(){

  if(gradosVisibles.length===0){
    return `<div class="page-head"><p class="page-eyebrow">Evaluación</p><h1 class="page-title">Calificaciones</h1><p class="page-desc">No tienes grados ni asignaturas asignadas todavía. Contacta a Dirección o Coordinación académica.</p></div>`;
  }
  const grado = getPref('califGrado', gradosVisibles[0]);
  const asignaturasPosibles = isAdmin(currentUser) || esOrientador(currentUser, grado)
    ? asignaturasDeGrado(grado)
    : asignaturasDeGrado(grado).filter(s=>currentUser.asignaciones.some(a=>a.grado===grado && a.asignaturaId===s.id));
  const asignatura = getPref('califAsig','') && asignaturasPosibles.some(s=>s.id===getPref('califAsig','')) ? getPref('califAsig','') : (asignaturasPosibles[0] ? asignaturasPosibles[0].id : '');
  const periodo = Number(getPref('califPeriodo',1)) || 1;
  const puedeEditar = asignatura && canEditGrades(currentUser, grado, asignatura);
  const acts = asignatura ? getActividades(grado, asignatura, periodo) : [];

  const estudiantes = ordenarEstudiantes(DB.estudiantes.filter(e=>e.grado===grado), getPref('ordenEst','apellidos'));

  return `
  <div class="page-head">
    <p class="page-eyebrow">Evaluación</p>
    <h1 class="page-title">Calificaciones</h1>
    <p class="page-desc">Cada período se compone de: Actividades ${Math.round(pesoDe('actividades')*100)}% (repartido entre las casillas que definas), ${rubrosActivos().map(r=>esc(r.nombre)+' '+Math.round(r.peso*100)+'%').join(', ')}. La nota final del año promedia los 4 períodos.</p>
  </div>
  ${puedeEditar?renderGuardarManualBanner():''}
  <div class="filters">
    <div class="field">
      <label>Aula</label>
      <select class="grado-select" onchange="setPref('califAsig',''); setPref('califGrado', this.value)">
        ${gradosVisibles.map(g=>`<option value="${esc(g)}" ${grado===g?'selected':''}>${esc(g)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Asignatura</label>
      <select onchange="setPref('califAsig', this.value)">
        ${asignaturasPosibles.length===0?'<option value="">Sin asignaturas disponibles</option>':''}
        ${asignaturasPosibles.map(s=>`<option value="${s.id}" ${asignatura===s.id?'selected':''}>${esc(s.nombre)}</option>`).join('')}
      </select>
    </div>
  </div>

  ${asignaturasPosibles.length===0 ? `<div class="card"><p class="empty">No tienes asignaturas asignadas en esta aula.</p></div>` : `
  <div class="period-tabs">
    ${[1,2,3,4].map(p=>`<div class="period-tab ${periodo==p?'active':''}" onclick="setPref('califPeriodo', ${p})">Período ${p}</div>`).join('')}
    <button class="btn btn-sm" style="margin-left:auto; align-self:center;"
      onclick="descargarCalificaciones('${esc(grado)}','${asignatura}',${periodo})">Descargar en PDF</button>
  </div>

  <div class="card" style="border-radius:0 var(--radius) var(--radius) var(--radius); margin-top:0;">
    <p class="card-title">Actividades (${Math.round(pesoDe('actividades')*100)}% del período)
      ${puedeVerPanel(currentUser,'hojas')?`<button class="btn btn-sm" onclick="setPref('hojaGrado','${esc(grado)}'); setPref('hojaAsig','${asignatura}'); setPref('hojaPeriodo',${periodo}); goTo('hojas')">Editar en Hoja de tareas</button>`:''}</p>
    <div class="acts-grid">
      ${acts.map(a=>{
        const fecha = getFechaTarea(grado, asignatura, a.id, periodo);
        return `
        <div class="act-chip">
          <div class="act-chip-top">
            <span class="pill pill-primary" style="margin-right:6px;">${esc(etiquetaCorta(a.id)||'')}</span>
            <span class="act-nombre" style="padding:3px 2px;" title="${esc(a.nombre)}">${esc(a.nombre)}</span>
          </div>
          <label class="act-fecha-lbl">Fecha solicitada</label>
          <input type="date" class="act-fecha" value="${esc(fecha)}" disabled>
        </div>`;
      }).join('')}
      ${acts.length===0?'<span class="empty" style="padding:4px 0;">Sin casillas de actividades — agrega al menos una.</span>':''}
    </div>
    <p class="nota-chica">Los nombres y las fechas vienen de la <b>Hoja de tareas</b> de este período; ahí se editan.</p>
  </div>

  <div class="card" style="margin-top:-4px;">
    <p class="card-title">Integradoras (${Math.round(rubrosTarea().reduce((t,r)=>t+r.peso,0)*100)}% del período)</p>
    <div class="acts-grid">
      ${rubrosTarea().map(rt=>{
        const k = rt.key;
        const fecha = getFechaTarea(grado, asignatura, k, periodo);
        const nom = getNombreRubro(grado, asignatura, k, periodo);
        return `
        <div class="act-chip">
          <div class="act-chip-top">
            <span class="pill pill-primary" style="margin-right:6px;">${esc(etiquetaCorta(k)||'')}</span>
            <span class="act-nombre" style="padding:3px 2px;" title="${esc(nom)}">${esc(nom)}</span>
          </div>
          <label class="act-fecha-lbl">Fecha solicitada</label>
          <input type="date" class="act-fecha" value="${esc(fecha)}" disabled>
        </div>`;
      }).join('')}
    </div>
    <p class="nota-chica">El nombre y la fecha salen de la <b>Hoja de tareas</b>. Los rubros y sus porcentajes se definen en Personalizar → Ponderación del período.</p>
  </div>

  <div class="ledger">
    <div class="table-wrap">
    <table class="ledger-table">
      <thead><tr>
        <th style="width:44px;">N°</th>
        <th>Estudiante</th>
        ${acts.map(a=>`<th style="width:84px;" title="${esc(a.nombre)}">${esc(etiquetaCorta(a.id)||a.nombre)}</th>`).join('')}
        ${rubrosActivos().map(r=>{
          const nom = esc(getNombreRubro(grado,asignatura,r.key,periodo));
          const corta = etiquetaCorta(r.key);
          let th = `<th style="width:80px;" title="${nom}">${corta ? esc(corta) : nom} (${Math.round(r.peso*100)}%)</th>`;
          if(r.conRecuperacion) th += `<th style="width:80px;" title="Recuperación de ${nom}">Recup.<br><span style="font-weight:400;text-transform:none;">${corta?esc(corta):nom}</span></th>`;
          return th;
        }).join('')}
        <th style="width:100px;">Nota período ${periodo}</th>
        <th style="width:110px;">Promedio final</th>
      </tr></thead>
      <tbody>
        ${estudiantes.length===0?`<tr><td colspan="${acts.length+rubrosActivos().length+rubrosActivos().filter(r=>r.conRecuperacion).length+4}" class="empty">No hay estudiantes en esta aula.</td></tr>`:''}
        ${estudiantes.map((e,idxEst)=>{
          const pInfo = periodInfo(e.id, asignatura, periodo, grado);
          const pScore = pInfo.valor;
          const sInfo = subjectInfo(e.id, asignatura, grado);
          const final = sInfo.valor;
          const cell = (comp) => {
            const val = getComp(e.id, asignatura, periodo, comp);
            const deficiente = val!==undefined && val<60;
            const obs = getObs(e.id, asignatura, periodo, comp);
            const btnObs = `<button class="obs-btn ${obs?'con-obs':''}" title="${obs?esc(obs):'Agregar observación'}"
                onclick="abrirObs('${e.id}','${asignatura}',${periodo},'${comp}')">${obs?'✎':'+'}</button>`;
            const input = puedeEditar
              ? `<input class="score-input ${deficiente?'deficiente':''}" type="text" inputmode="decimal" autocomplete="off"
                  value="${val!==undefined?val:''}" placeholder="—"
                  onchange="updateComp('${e.id}','${asignatura}',${periodo},'${comp}',this.value)">`
              : `<span class="mono">${val!==undefined?val:'—'}</span>`;
            return `<div class="celda-nota">${input}${puedeEditar?btnObs:''}</div>`;
          };
          const selectorEstado = (idTarea) => {
            const estado = getEstado(e.id, asignatura, periodo, idTarea);
            return puedeEditar
              ? `<select class="estado-sel estado-${estado||'vacio'}" onchange="setEstado('${e.id}','${asignatura}',${periodo},'${idTarea}',this.value)">
                   <option value="">Estado…</option>
                   <option value="entregada" ${estado==='entregada'?'selected':''}>Entregada</option>
                   <option value="tardia" ${estado==='tardia'?'selected':''}>Entrega tardía</option>
                   <option value="no" ${estado==='no'?'selected':''}>No entregada</option>
                 </select>`
              : (estado?`<span class="pill ${ESTADOS[estado].pill}">${ESTADOS[estado].nombre}</span>`:'<span class="mono">—</span>');
          };
          const celdaAct = (a) => {
            const estado = getEstado(e.id, asignatura, periodo, a.id);
            const sel = puedeEditar
              ? `<select class="estado-sel estado-${estado||'vacio'}" onchange="setEstado('${e.id}','${asignatura}',${periodo},'${a.id}',this.value)">
                   <option value="">Estado…</option>
                   <option value="entregada" ${estado==='entregada'?'selected':''}>Entregada</option>
                   <option value="tardia" ${estado==='tardia'?'selected':''}>Entrega tardía</option>
                   <option value="no" ${estado==='no'?'selected':''}>No entregada</option>
                 </select>`
              : (estado?`<span class="pill ${ESTADOS[estado].pill}">${ESTADOS[estado].nombre}</span>`:'<span class="mono">—</span>');
            return `<td>${cell('act:'+a.id)}${sel}</td>`;
          };
          return `<tr>
            <td class="mono num-est">${idxEst+1}</td>
            <td>${esc(e.nombre)}</td>
            ${acts.map(celdaAct).join('')}
            ${rubrosActivos().map(r=>{
              let td = `<td>${cell(r.key)}${r.tarea?selectorEstado(r.key):''}</td>`;
              if(r.conRecuperacion){
                const base = getComp(e.id, asignatura, periodo, r.key);
                const rec = getComp(e.id, asignatura, periodo, claveRecuperacion(r.key));
                const usada = notaRubro(e.id, asignatura, periodo, r);
                const gana = rec!==undefined && usada===rec && (base===undefined || rec>base);
                td += `<td>${cell(claveRecuperacion(r.key))}
                  ${gana?'<span class="pill pill-primary" style="margin-top:4px;display:inline-block;">Cuenta esta</span>':''}</td>`;
              }
              return td;
            }).join('')}
            <td class="avg-cell ${pScore===null?'avg-pending':(pScore>=60?'avg-good':'avg-bad')}"
                title="${pInfo.completo?'Nota definitiva del período':'Promedio con lo calificado hasta ahora ('+Math.round(pInfo.avance*100)+'% del período)'}">
              ${pScore===null?'Pendiente':pScore.toFixed(1)}
              ${pScore!==null && !pInfo.completo?`<span class="marca-parcial">parcial ${Math.round(pInfo.avance*100)}%</span>`:''}
            </td>
            <td class="avg-cell ${final===null?'avg-pending':(final>=60?'avg-good':'avg-bad')}">
              ${final===null?'Pendiente':final.toFixed(1)}
              ${final!==null && !sInfo.completo?`<span class="marca-parcial">${sInfo.periodos} de 4 per.</span>`:''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>
  </div>
  <div class="note" style="margin-top:12px;">El promedio se calcula desde la primera nota que cargues, repartiendo proporcionalmente entre lo ya calificado; la etiqueta <b>parcial</b> indica que aún faltan notas. En los rubros con recuperación se toma automáticamente la nota más alta.</div>
  ${!puedeEditar ? `<div class="note" style="margin-top:12px;">Solo puedes consultar esta asignatura. La edición está reservada al docente asignado, a su orientador(a) o a administración.</div>`:''}
  `}
  ${renderObsModal()}`;
}
/* Descarga en PDF el cuadro que está en pantalla, horizontal y con encabezado
   repetido en cada página. */
function descargarCalificaciones(grado, asigId, periodo){
  const asig = DB.asignaturas.find(a=>a.id===asigId);
  if(!asig){ showToast('Selecciona una asignatura.'); return; }
  const aj = DB.ajustes || {};
  const q = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const acts = getActividades(grado, asigId, periodo);
  const rubros = rubrosActivos();
  const estudiantes = ordenarEstudiantes(DB.estudiantes.filter(e=>e.grado===grado), getPref('ordenEst','apellidos'));
  const num = v => (v===undefined || v===null || isNaN(v)) ? '' : v;

  const cols = [];
  cols.push({t:'N°', w:'4%'}, {t:'Estudiante', w:'20%'});
  acts.forEach(a=>cols.push({t: etiquetaCorta(a.id) || a.nombre, w:'', sub:a.nombre}));
  rubros.forEach(r=>{
    const nom = getNombreRubro(grado, asigId, r.key, periodo);
    cols.push({t: (etiquetaCorta(r.key) || nom) + ' ' + Math.round(r.peso*100) + '%', w:'', sub:nom});
    if(r.conRecuperacion) cols.push({t:'Recup.', w:'', sub:'Recuperación de ' + nom});
  });
  cols.push({t:'NOTA PER. ' + periodo, w:'7%'}, {t:'PROM. FINAL', w:'7%'});

  const filas = estudiantes.map((e,i)=>{
    const celdas = [i+1, apellidosDe(e) + ', ' + nombresDe(e)];
    acts.forEach(a=>celdas.push(num(getComp(e.id, asigId, periodo, 'act:'+a.id))));
    rubros.forEach(r=>{
      celdas.push(num(getComp(e.id, asigId, periodo, r.key)));
      if(r.conRecuperacion) celdas.push(num(getComp(e.id, asigId, periodo, claveRecuperacion(r.key))));
    });
    const pi = periodInfo(e.id, asigId, periodo, grado);
    const si = subjectInfo(e.id, asigId, grado);
    celdas.push(pi.valor===null ? '' : pi.valor.toFixed(1));
    celdas.push(si.valor===null ? '' : si.valor.toFixed(1));
    return celdas;
  });

  const encabezado = `
    <tr class="cabpag"><td colspan="${cols.length}">
      <div class="cab">
        ${aj.logo?`<img src="${aj.logo}" class="logo">`:''}
        <div style="flex:1; text-align:center;">
          <p class="colegio">${q((aj.nombreColegio||'Centro Escolar').toUpperCase())}</p>
          <p class="sub">AÑO ESCOLAR ${q(aj.anio||'')}</p>
          <p class="materia">Calificaciones de ${q(asig.nombre)} &middot; ${q(grado)} &middot; Período ${periodo}</p>
        </div>
        ${aj.logo?'<span style="width:52px;"></span>':''}
      </div>
    </td></tr>
    <tr>${cols.map(c=>`<th ${c.w?'style="width:'+c.w+'"':''} title="${q(c.sub||c.t)}">${q(c.t)}</th>`).join('')}</tr>`;

  const cierre = '<' + '/script>';
  const html = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">' +
  '<title>CALIFICACIONES ' + q((asig.nombre + ' ' + grado + ' PERIODO ' + periodo).toUpperCase()) + '</title><style>' +
  '@page{ size: letter landscape; margin: 12mm; }' +
  '*{ box-sizing:border-box; }' +
  'body{ font-family: Arial, Helvetica, sans-serif; font-size:8.5pt; color:#000; margin:0; }' +
  '@media screen{ body{ background:#d8d8d8; padding:18px 0; }' +
  '  .pagina{ width:279.4mm; padding:12mm; margin:0 auto 18px; background:#fff;' +
  '    box-shadow:0 2px 12px rgba(0,0,0,.28); } }' +
  '@media print{ .pagina{ width:auto; padding:0; } }' +
  'table{ width:100%; border-collapse:collapse; }' +
  'thead{ display:table-header-group; }' +          // el encabezado se repite en cada página
  'tr{ page-break-inside:avoid; }' +
  'th, td{ border:1px solid #000; padding:3px 4px; text-align:center; }' +
  'th{ font-size:7.5pt; }' +
  'td.nom{ text-align:left; }' +
  '.cabpag td{ border:none; padding:0 0 6px; }' +
  '.cab{ display:flex; align-items:center; gap:10px; border-bottom:2px solid #000; padding-bottom:5px; }' +
  '.logo{ width:52px; height:52px; object-fit:contain; }' +
  '.colegio{ font-size:14pt; font-weight:bold; margin:0; }' +
  '.sub{ font-size:9pt; margin:2px 0 0; }' +
  '.materia{ font-size:11pt; font-weight:bold; margin:3px 0 0; }' +
  '</style></head><body><div class="pagina">' +
  '<table><thead>' + encabezado + '</thead><tbody>' +
  filas.map(f=>'<tr>' + f.map((v,i)=>'<td class="' + (i===1?'nom':'') + '">' + q(v) + '</td>').join('') + '</tr>').join('') +
  '</tbody></table></div>' +
  '<script>window.onload=function(){setTimeout(function(){window.print();},350);};' + cierre +
  '</body></html>';

  const v = window.open('', '_blank');
  if(!v){ showToast('El navegador bloqueó la ventana emergente. Permítela e intenta de nuevo.'); return; }
  v.document.write(html);
  v.document.close();
  showToast('En el diálogo de impresión elige "Guardar como PDF".');
}

/* Descarga en PDF la tabla de notas por aula, horizontal y con encabezado repetido */
function descargarMatriz(grado){

      tds += `<td class="fin">${r1(subjectInfo(e.id,a.id,grado).valor)}</td>`;
    });
    if(completo) tds += `<td class="glob">${r1(studentInfo(e.id,grado).valor)}</td>`;
    return '<tr>' + tds + '</tr>';
  }).join('');

  const cierre = '<' + '/script>';
  const html = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">' +
  '<title>NOTAS POR AULA ' + q(grado.toUpperCase()) + '</title><style>' +
  '@page{ size: letter landscape; margin: 12mm; }' +
  '*{ box-sizing:border-box; }' +
  'body{ font-family: Arial, Helvetica, sans-serif; font-size:8pt; color:#000; margin:0; }' +
  '@media screen{ body{ background:#d8d8d8; padding:18px 0; }' +
  '  .pagina{ width:279.4mm; padding:12mm; margin:0 auto 18px; background:#fff;' +
  '    box-shadow:0 2px 12px rgba(0,0,0,.28); } }' +
  '@media print{ .pagina{ width:auto; padding:0; } }' +
  'table{ width:100%; border-collapse:collapse; }' +
  'thead{ display:table-header-group; }' +
  'tr{ page-break-inside:avoid; }' +
  'th, td{ border:1px solid #000; padding:2.5px 4px; text-align:center; }' +
  'th{ font-size:7pt; } td.nom, th.nom{ text-align:left; }' +
  'th.mat{ background:#EDEEE6; } td.fin, th.fin{ font-weight:bold; background:#F7F7F1; }' +
  'td.glob, th.glob{ font-weight:bold; background:#F3E6C9; }' +
  '.cabpag td{ border:none; padding:0 0 6px; }' +
  '.cab{ display:flex; align-items:center; gap:10px; border-bottom:2px solid #000; padding-bottom:5px; }' +
  '.logo{ width:52px; height:52px; object-fit:contain; }' +
  '.colegio{ font-size:14pt; font-weight:bold; margin:0; }' +
  '.sub{ font-size:9pt; margin:2px 0 0; }' +
  '.titu{ font-size:11pt; font-weight:bold; margin:3px 0 0; }' +
  '</style></head><body><div class="pagina"><table><thead>' +
  '<tr class="cabpag"><td colspan="60"><div class="cab">' +
  (aj.logo?'<img src="'+aj.logo+'" class="logo">':'') +
  '<div style="flex:1; text-align:center;">' +
  '<p class="colegio">' + q((aj.nombreColegio||'Centro Escolar').toUpperCase()) + '</p>' +
  '<p class="sub">AÑO ESCOLAR ' + q(aj.anio||'') + '</p>' +
  '<p class="titu">Notas por aula &middot; ' + q(grado) + '</p></div>' +
  (aj.logo?'<span style="width:52px;"></span>':'') +
  '</div></td></tr><tr>' + cabezas1 + '</tr>' + (cabezas2 ? '<tr>' + cabezas2 + '</tr>' : '') +
  '</thead><tbody>' + filas + '</tbody></table></div>' +
  '<script>window.onload=function(){setTimeout(function(){window.print();},350);};' + cierre +
  '</body></html>';

  const v = window.open('', '_blank');
  if(!v){ showToast('El navegador bloqueó la ventana emergente. Permítela e intenta de nuevo.'); return; }
  v.document.write(html);
  v.document.close();
  showToast('En el diálogo de impresión elige "Guardar como PDF".');
}

function abrirObs(estId, asigId, periodo, comp){
  viewState.obs = {estId, asigId, periodo, comp};
  render();
}
function renderObsModal(){
  if(!viewState.obs) return '';
  const {estId, asigId, periodo, comp} = viewState.obs;
  const est = DB.estudiantes.find(e=>e.id===estId);
  const asig = DB.asignaturas.find(a=>a.id===asigId);
  let nombreComp = comp;
  if(comp.indexOf('act:')===0){
    const acts = getActividades(est.grado, asigId, periodo);
    const a = acts.find(x=>'act:'+x.id===comp);
    nombreComp = a ? a.nombre : 'Actividad';
  }else{
    nombreComp = getNombreRubro(est.grado, asigId, comp, periodo);
  }
  return `
  <div class="modal-bg" onclick="if(event.target===this) cerrarObs()">
    <div class="modal">
      <button class="modal-close" onclick="cerrarObs()">×</button>
      <h3 class="modal-title">Observación</h3>
      <p style="font-size:13px;color:var(--muted);margin:-8px 0 14px;">
        ${esc(est?est.nombre:'')} · ${esc(asig?asig.nombre:'')} · ${esc(nombreComp)} · Período ${periodo}
      </p>
      <div class="field">
        <textarea id="obs_texto" rows="4" placeholder="Ej.: entregó incompleta, se le dio prórroga…">${esc(getObs(estId, asigId, periodo, comp))}</textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="guardarObs()">Guardar</button>
        <button class="btn" onclick="cerrarObs()">Cancelar</button>
      </div>
    </div>
  </div>`;
}
function cerrarObs(){ viewState.obs = null; render(); }
function guardarObs(){
  const {estId, asigId, periodo, comp} = viewState.obs;
  setObs(estId, asigId, periodo, comp, document.getElementById('obs_texto').value);
  viewState.obs = null;
  render();
}
let ultimoRegistroNota = '';
async function updateComp(estId, asigId, periodo, comp, value){
  const asigNom = (DB.asignaturas.find(a=>a.id===asigId)||{}).nombre || '';
  const marca = asigId + '|' + periodo;
  if(ultimoRegistroNota !== marca){
    ultimoRegistroNota = marca;
    registrar('Calificaciones', 'Cargó notas de ' + asigNom + ' (período ' + periodo + ')');
  }
  const limpio = String(value).trim().replace(',', '.');
  if(limpio !== '' && !/^\d{1,3}(\.\d+)?$/.test(limpio)){
    showToast('Escribe solo un número entre 0 y 100 (ej.: 85 o 85.5).');
    render();   // vuelve a pintar la celda con el último valor válido guardado
    return;
  }
  const v = limpio===''? null : Math.max(0, Math.min(100, Number(limpio)));
  const key = estId+'|'+asigId+'|'+periodo+'|'+comp;
  setComp(estId, asigId, periodo, comp, v); // se refleja en pantalla de inmediato
  render();
  commit(doc=>{
    if(v===null) delete doc.calificaciones[key]; else doc.calificaciones[key] = v;
  });
}

/* ============================= MATRIZ POR AULA ============================= */
function renderMatriz(){
  const gradosVisibles = misGrados(currentUser);
  if(gradosVisibles.length===0){
    return `<div class="page-head"><p class="page-eyebrow">Reportes</p><h1 class="page-title">Notas por aula</h1><p class="page-desc">No tienes aulas visibles todavía.</p></div>`;
  }
  const grado = getPref('matrizGrado','') && gradosVisibles.includes(getPref('matrizGrado','')) ? getPref('matrizGrado','') : gradosVisibles[0];
  const vista = getPref('matrizVista','periodos');
  const asigs = asignaturasVisibles(grado);
  const completo = verGradoCompleto(grado);
  const estudiantes = ordenarEstudiantes(DB.estudiantes.filter(e=>e.grado===grado), getPref('ordenEst','apellidos'));

  const celda = (valor, completo, extra) => {
    if(valor===null) return `<td class="avg-cell avg-pending">—</td>`;
    return `<td class="avg-cell ${valor>=60?'avg-good':'avg-bad'} ${extra||''}">${valor.toFixed(1)}${completo?'':'<span class="marca-parcial">parcial</span>'}</td>`;
  };

  let tabla;
  if(vista === 'periodos'){
    tabla = `
    <table class="matriz-detalle">
      <thead>
        <tr>
          <th rowspan="2" style="vertical-align:bottom;">N°</th>
          <th rowspan="2" style="vertical-align:bottom;">Estudiante</th>
          ${asigs.map(a=>`<th colspan="5" class="col-materia">${esc(a.nombre)}</th>`).join('')}
          ${completo?`<th rowspan="2" style="vertical-align:bottom;">PROMEDIO<br>GLOBAL</th>`:''}
        </tr>
        <tr>
          ${asigs.map(()=>`<th>P1</th><th>P2</th><th>P3</th><th>P4</th><th class="col-final">Final</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${estudiantes.length===0?`<tr><td colspan="${asigs.length*5+(completo?3:2)}" class="empty">No hay estudiantes en esta aula.</td></tr>`:''}
        ${asigs.length===0 && estudiantes.length>0 ? `<tr><td colspan="3" class="empty">Esta aula todavía no tiene asignaturas vinculadas.</td></tr>`:''}
        ${estudiantes.map((e,i)=>{
          const gInfo = studentInfo(e.id, grado);
          return `<tr>
            <td class="mono num-est">${i+1}</td>
            <td>${esc(nombreCompleto(e.nombres, e.apellidos) || e.nombre)}</td>
            ${asigs.map(a=>{
              const celdas = [1,2,3,4].map(p=>{
                const pi = periodInfo(e.id, a.id, p, grado);
                return celda(pi.valor, pi.completo);
              }).join('');
              const si = subjectInfo(e.id, a.id, grado);
              return celdas + celda(si.valor, si.completo, 'col-final');
            }).join('')}
            ${completo?celda(gInfo.valor, gInfo.completo, 'col-global'):''}
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }else{
    tabla = `
    <table>
      <thead><tr>
        <th style="width:48px;">N°</th><th>Estudiante</th>
        ${asigs.map(a=>`<th>${esc(a.nombre)}</th>`).join('')}
        ${completo?`<th>PROMEDIO GLOBAL</th>`:''}
      </tr></thead>
      <tbody>
        ${estudiantes.length===0?`<tr><td colspan="${asigs.length+(completo?3:2)}" class="empty">No hay estudiantes en esta aula.</td></tr>`:''}
        ${estudiantes.map((e,i)=>{
          const gInfo = studentInfo(e.id, grado);
          return `<tr>
            <td class="mono num-est">${i+1}</td>
            <td>${esc(nombreCompleto(e.nombres, e.apellidos) || e.nombre)}</td>
            ${asigs.map(a=>{ const si = subjectInfo(e.id, a.id, grado); return celda(si.valor, si.completo); }).join('')}
            ${completo?celda(gInfo.valor, gInfo.completo, 'col-global'):''}
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }

  return `
  <div class="page-head">
    <p class="page-eyebrow">Reportes</p>
    <h1 class="page-title">Notas por aula</h1>
    <p class="page-desc">Notas de cada período por materia y promedio final de cada materia${completo?', además del promedio global del estudiante':''}.</p>
  </div>
  <div class="filters">
    <div class="field">
      <label>Aula</label>
      <select class="grado-select" onchange="setPref('matrizGrado', this.value)">
        ${gradosVisibles.map(g=>`<option value="${esc(g)}" ${grado===g?'selected':''}>${esc(g)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Detalle</label>
      <select onchange="setPref('matrizVista', this.value)">
        <option value="periodos" ${vista==='periodos'?'selected':''}>Períodos y final por materia</option>
        <option value="resumen" ${vista==='resumen'?'selected':''}>Solo promedio final por materia</option>
      </select>
    </div>
    <div class="field">
      <label>Ordenar por</label>
      <select onchange="setPref('ordenEst', this.value)">
        <option value="apellidos" ${(getPref('ordenEst','apellidos'))==='apellidos'?'selected':''}>Apellidos</option>
        <option value="nombres" ${getPref('ordenEst','apellidos')==='nombres'?'selected':''}>Nombres</option>
      </select>
    </div>
  </div>
  <div class="card">
    <p class="card-title">${esc(grado)} <span class="pill pill-muted">${estudiantes.length} estudiante(s)</span>
      <button class="btn btn-sm" onclick="descargarMatriz('${esc(grado)}')">Descargar en PDF</button>
    </p>
    <div class="table-wrap">${tabla}</div>
    <p class="nota-chica">La marca <b>parcial</b> señala que todavía faltan notas por cargar; el valor mostrado es el promedio de lo calificado hasta ahora.
    ${!completo?'<br>Ves únicamente las materias que impartes en esta aula. El promedio global del estudiante lo consultan Dirección y el orientador(a) del grado.':''}</p>
  </div>`;
}
/* ============================= INICIO ============================= */
(async function init(){
  cargarPrefs();
  try{
    await detectarMotor();
    await restaurarSesion();
    setSyncStatus('ok');
  }catch(e){ console.error('init', e); }
  render();
  iniciarSync();
})();
</script>
