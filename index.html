<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escuela Cristiana Cristo a las Naciones</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#16233F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ECAN">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEEE6;
    --ink:#1C2B2A;
    --panel:#FFFFFF;
    --panel-2:#F7F7F1;
    --line:#D9DACD;
    --line-strong:#BFC1B0;
    --primary:#2F6F5E;
    --primary-dark:#1F4E41;
    --primary-light:#DCEAE4;
    --gold:#B98A2E;
    --gold-light:#F3E6C9;
    --red:#A63D2E;
    --red-light:#F4DCD6;
    --blue:#2E5C7A;
    --blue-light:#DCE7EE;
    --muted:#6E6E62;
    --margin-red:#C0574A;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,43,42,.06), 0 4px 14px rgba(28,43,42,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-.01em; }
  button, input, select{ font-family:'Inter',sans-serif; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  #app{ min-height:100vh; }

  /* ---------- LOGIN ---------- */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:40px 36px; width:100%; max-width:460px; box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  .login-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--margin-red);
  }
  .login-eyebrow{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin:0 0 6px; }
  .login-title{ font-size:28px; margin:0 0 4px; }
  .login-sub{ color:var(--muted); font-size:14px; margin:0 0 28px; }
  .user-list{ display:flex; flex-direction:column; gap:8px; max-height:360px; overflow-y:auto; padding-right:4px;}
  .user-pick{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--line);
    border-radius:10px; background:var(--panel-2); cursor:pointer; text-align:left; width:100%;
    transition:border-color .15s, background .15s;
  }
  .user-pick:hover{ border-color:var(--primary); background:var(--primary-light); }
  .user-avatar{
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; color:#fff; flex-shrink:0;
  }
  .user-meta{ min-width:0; }
  .user-name{ font-weight:600; font-size:14px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .user-role{ font-size:12px; color:var(--muted); margin:0; }
  .badge{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.03em; text-transform:uppercase; margin-left:auto; flex-shrink:0;}
  .badge-direccion{ background:var(--gold-light); color:#7A5A1C; }
  .badge-coordinacion{ background:var(--blue-light); color:var(--blue); }
  .badge-secretaria{ background:var(--primary-light); color:var(--primary-dark); }
  .badge-docente{ background:var(--panel); color:var(--muted); border:1px solid var(--line);}

  /* ---------- LAYOUT ---------- */
  .layout{ display:flex; min-height:100vh; }
  .sidebar{
    width:230px; background:var(--panel); border-right:1px solid var(--line); flex-shrink:0;
    display:flex; flex-direction:column; padding:22px 0;
    position:sticky; top:0; height:100vh; overflow:hidden;
  }
  .nav-list{ flex:1 1 auto; overflow-y:auto; min-height:0; }
  .brand{ padding:0 20px 20px; border-bottom:1px solid var(--line); margin-bottom:14px;}
  .brand-title{ font-size:19px; margin:0; line-height:1.15;}
  .brand-sub{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:4px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 20px; font-size:14px; font-weight:500;
    color:var(--ink); cursor:pointer; border-left:3px solid transparent; opacity:.75;
  }
  .nav-item:hover{ background:var(--panel-2); opacity:1; }
  .nav-item.active{ border-left-color:var(--primary); background:var(--primary-light); opacity:1; color:var(--primary-dark); font-weight:600;}
  .nav-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.5; flex-shrink:0;}
  .nav-badge{ margin-left:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:700;
    border-radius:999px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center;
    padding:0 5px; line-height:1; }
  .sidebar-footer{ margin-top:auto; padding:14px 20px 0; border-top:1px solid var(--line); flex-shrink:0; }
  .who{ display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .who .user-name{ font-size:13px; }
  .who .user-role{ font-size:11px; }
  .num-est{ color:var(--muted); font-size:12px; text-align:center; }
  .pill-rojo{ background:var(--red-light); color:var(--red); }
  .pill-naranja{ background:#FBE3CE; color:#8A4A16; }
  .alerta-amarilla{ border-left:4px solid #E0B93C; }
  .alerta-naranja{ border-left:4px solid #D9822B; }
  .alerta-roja{ border-left:4px solid var(--red); }
  .acts-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:10px; }
  .act-chip{ background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
  .act-chip-top{ display:flex; align-items:center; gap:2px; }
  .act-nombre{ border:none; background:transparent; padding:2px; font-size:12.5px; font-weight:600; width:100%; color:var(--ink); }
  .act-nombre:focus{ outline:1px solid var(--primary); border-radius:4px; }
  .act-fecha-lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:6px 0 3px; display:block; }
  .act-fecha{ width:100%; padding:4px 6px; font-size:12px; border:1px solid var(--line-strong); border-radius:6px; background:#fff; }
  .matriz-detalle th{ text-align:center; }
  .matriz-detalle .col-materia{ background:var(--primary-light); color:var(--primary-dark);
    border-left:2px solid var(--line-strong); text-align:center; }
  .matriz-detalle td.col-final, .matriz-detalle th.col-final{ background:var(--panel-2); font-weight:700; }
  .avg-cell.col-global{ background:var(--gold-light); font-weight:700; }
  .num-est{ color:var(--muted); }
  .marca-parcial{ display:block; font-size:9.5px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.03em; margin-top:2px; font-family:'Inter',sans-serif; }
  .panel-fila{ display:flex; align-items:center; gap:6px; margin-bottom:3px; font-size:11.5px; }
  .panel-fila > span{ flex:1; color:var(--muted); }
  .panel-sel{ width:auto; min-width:96px; padding:2px 5px; font-size:11px; border-radius:5px; }
  .panel-sel.nivel-no{ background:var(--panel-2); color:var(--muted); }
  .panel-sel.nivel-ver{ background:var(--blue-light); color:var(--blue); }
  .panel-sel.nivel-editar{ background:var(--primary-light); color:var(--primary-dark); }
  .boleta-hoja{ overflow:visible; }
  .boleta-ident{ display:flex; justify-content:space-between; align-items:flex-end;
    gap:20px; padding:0 2px 12px; margin-bottom:12px; border-bottom:1px solid var(--line); }
  .boleta-sub2{ display:none; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin:4px 0 0; }
  /* La pantalla replica la estructura de la hoja impresa:
     dos columnas fijas, filas parejas y nombres de materia en una sola línea. */
  .boleta-hoja{ max-width:1060px; }
  .bol-tabla th, .bol-mini th{ font-weight:700; }
  .boleta-cuerpo{ display:flex; gap:14px; align-items:stretch; }
  .boleta-col{ flex:1.55; min-width:0; display:flex; flex-direction:column; }
  .boleta-col-lateral{ flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }
  @media(max-width:1000px){
    .boleta-cuerpo{ flex-direction:column; }
    .boleta-col, .boleta-col-lateral{ flex:none; }
  }
  .bol-tabla, .bol-mini{ width:100%; border-collapse:collapse; margin-bottom:0; font-size:12.5px;
    table-layout:fixed; }
  .bol-tabla{ height:314px; }          /* equivale a los 8.3 cm de la hoja impresa */
  .bol-tabla th, .bol-tabla td, .bol-mini th, .bol-mini td{ border:1px solid var(--line-strong);
    padding:3px 7px; vertical-align:middle; }
  .bol-tabla tr, .bol-mini tr{ height:38px; }
  .bol-tabla th, .bol-mini th{ text-align:center; background:var(--panel-2); color:var(--ink);
    font-size:10px; letter-spacing:.01em; white-space:normal; word-break:break-word; line-height:1.2; }
  .bol-tabla th:first-child{ width:30%; }
  .bol-tabla td:not(:first-child){ text-align:center; white-space:nowrap; }
  .bol-tabla th:not(:first-child){ text-align:center; white-space:normal; }
  .bol-mini th:first-child, .bol-mini td:first-child{ text-align:left; }
  .bol-mat{ font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bol-mini td:first-child{ font-size:12px; }
  .bol-mini .col-valor{ width:58px; text-align:center; }
  .bol-mini .col-x{ width:30px; }
  .bol-num{ text-align:center; font-family:'JetBrains Mono',monospace; }
  .bol-fuerte{ font-weight:700; }
  .bol-total td{ font-weight:700; background:var(--panel-2); }
  .bol-verde{ color:var(--primary-dark); }
  .bol-in{ width:100%; padding:2px 5px; font-size:11.5px; border:1px solid transparent;
    background:transparent; border-radius:4px; }
  .bol-in:hover{ border-color:var(--line); background:#fff; }
  .bol-in:focus{ border-color:var(--primary); background:#fff; }
  .bol-obs{ border:1px solid var(--line-strong); border-radius:6px; padding:9px 11px;
    font-size:12.5px; line-height:1.5; margin:12px 0 14px; }
  .boleta-col .boleta-firmas{ margin-top:auto; }
  .bol-obs-txt{ overflow:hidden; }
  .bol-obs-txt{ width:100%; border:none; padding:4px 0 0; font-size:12.5px; resize:vertical; }
  .bol-obs-txt:focus{ outline:none; }
  .bol-firma-nom{ text-align:center; font-weight:600; font-size:12px; }
  .bol-firma-cargo{ text-align:center; font-size:11px; color:var(--muted); }
  .bol-firma-nom-txt{ font-weight:600; font-size:12px; margin:0; }
  .hj-titulo{ text-align:center; font-style:italic; font-weight:700; font-size:15px; margin:0 0 10px; }
  .hj-cab2{ display:flex; align-items:stretch; border:1px solid var(--line-strong); margin-bottom:0; }
  .hj-grado{ background:#FFF3B0; font-weight:700; padding:5px 12px; border-right:1px solid var(--line-strong); }
  .hj-docente{ flex:1; text-align:center; font-weight:700; letter-spacing:.15em; padding:5px 12px; font-size:12.5px; }
  .hj-tabla{ width:100%; border-collapse:collapse; font-family:Arial,Helvetica,sans-serif; font-size:11px; }
  .hj-tabla tr.hj-sel > td{ box-shadow: inset 0 0 0 2px var(--primary); }
  .hj-tabla th, .hj-tabla td{ border:1px solid var(--line-strong); padding:4px 6px; vertical-align:top; }
  .hj-tabla th{ background:var(--panel-2); text-align:center; font-size:11px; white-space:normal;
    font-family:Arial,Helvetica,sans-serif; }
  .hj-in{ width:100%; padding:3px 5px; font-family:Arial,Helvetica,sans-serif; font-size:11px; border:1px solid transparent;
    background:transparent; border-radius:4px; }
  .hj-in:hover{ border-color:var(--line); background:#fff; }
  .hj-in:focus{ border-color:var(--primary); background:#fff; }
  .hj-area{ resize:vertical; line-height:1.4; }
  .hj-enc{ width:100%; border:none; background:transparent; text-align:center; font-size:11px;
    font-family:Arial,Helvetica,sans-serif;
    font-weight:700; text-transform:uppercase; color:var(--muted); }
  .hj-centro{ text-align:center; }
  .hj-etiqueta{ color:var(--red); font-weight:700; text-align:center; text-transform:uppercase; }
  .hj-etiqueta-txt{ color:var(--red); font-weight:700; text-transform:uppercase; }
  .hj-integradora td{ background:#FDF6F4; }
  .hj-rubrica{ width:100%; border-collapse:collapse; }
  .hj-rubrica td{ border:1px solid var(--line); padding:2px 4px; font-size:11px; }
  .hj-rubrica td:first-child{ min-width:170px; }
  .hj-peso{ width:54px; text-align:center; }
  .hj-vacio{ width:44px; }
  .hj-x{ width:26px; }
  .hj-rub{ padding:0 !important; }
  .hj-firmas{ display:flex; flex-direction:column; height:100%; min-height:74px; }
  .hj-firma{ flex:1; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:var(--muted); text-align:center; }
  .hj-examenes td{ background:var(--panel-2); font-weight:700; font-size:13px; }
  .hj-acciones{ white-space:nowrap; }
  .hj-acciones .icon-btn.sel{ background:var(--primary); color:#fff; }
  .boleta-cab{ display:flex; align-items:center; gap:14px;
    padding-bottom:14px; margin-bottom:16px; }
  .boleta-logo{ width:78px; height:78px; object-fit:contain; }
  .boleta-colegio{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0; }
  .boleta-sub{ font-size:15px; color:var(--ink); margin:4px 0 0; text-transform:uppercase;
    letter-spacing:.05em; font-weight:600; }
  .boleta-lbl{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .boleta-dato{ font-size:17px; font-weight:700; }
  .boleta-firmas{ display:flex; gap:28px; margin-top:34px; }
  .boleta-firmas > div{ flex:1; text-align:center; }
  .boleta-firmas span{ display:block; border-top:1px solid var(--ink); margin-bottom:6px; }
  .boleta-firmas p{ font-size:11.5px; color:var(--muted); margin:0; }
  @page{ size: letter landscape; margin:14mm; }
  @media print{
    .sidebar, .filters, .toast, .nota-chica, .btn, .icon-btn{ display:none !important; }
    .main{ padding:0 !important; max-width:none !important; }
    .card{ box-shadow:none; border:none; }
    body{ background:#fff; }
  }
  .nota-chica{ font-size:11.5px; color:var(--muted); margin:10px 0 0; }
  .celda-nota{ display:flex; align-items:center; gap:3px; }
  .obs-btn{ border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:5px;
    width:20px; height:24px; font-size:11px; cursor:pointer; line-height:1; flex-shrink:0; }
  .obs-btn:hover{ border-color:var(--primary); color:var(--primary); }
  .obs-btn.con-obs{ background:var(--gold-light); border-color:#E3C98A; color:#7A5A1C; }
  .estado-sel{ width:100%; margin-top:4px; padding:3px 4px; font-size:11px; border-radius:5px;
    border:1px solid var(--line-strong); background:#fff; }
  .estado-sel.estado-entregada{ background:var(--primary-light); color:var(--primary-dark); }
  .estado-sel.estado-tardia{ background:var(--gold-light); color:#7A5A1C; }
  .estado-sel.estado-no{ background:var(--red-light); color:var(--red); }
  .clave-actual{ display:flex; align-items:center; gap:4px; font-family:'JetBrains Mono',monospace;
    font-size:12.5px; color:var(--primary-dark); margin-bottom:5px; }
  .rep-opciones{ display:flex; flex-wrap:wrap; gap:7px; }
  .check-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; padding:6px 11px; font-size:12.5px;
    font-weight:500; color:var(--ink); cursor:pointer; }
  .check-chip input{ width:auto; margin:0; cursor:pointer; }
  .login-logo{ width:60px; height:60px; object-fit:contain; margin-bottom:12px; border-radius:8px; }
  .brand-logo{ width:38px; height:38px; object-fit:contain; margin-bottom:8px; display:block; border-radius:6px; }
  .candado{ font-size:11px; margin-left:auto; opacity:.6; }
  .candado + .badge{ margin-left:6px; }
  textarea{ font-size:13.5px; line-height:1.5; }
  .aviso-motor{
    background:var(--gold-light); border:1px solid #E3C98A; border-radius:var(--radius);
    padding:11px 15px; font-size:13px; color:#6B4E10; margin-bottom:18px; line-height:1.55;
  }
  .aviso-motor.aviso-grave{ background:var(--red-light); border-color:#E0B3A9; color:#7A2A1C; }
  .btn-respaldo{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .sync-row{
    display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted);
    margin-bottom:9px; cursor:pointer; user-select:none;
  }
  .sync-row:hover{ color:var(--ink); }
  .sync-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .logout-btn{
    width:100%; padding:8px; border:1px solid var(--line); background:var(--panel-2); border-radius:8px;
    font-size:12.5px; cursor:pointer; color:var(--muted); font-weight:600;
  }
  .logout-btn:hover{ border-color:var(--red); color:var(--red); }

  .main{ flex:1; min-width:0; padding:32px 40px; max-width:1200px; }
  .page-head{ margin-bottom:26px; }
  .page-eyebrow{ font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin:0 0 6px;}
  .page-title{ font-size:21px; margin:0; }
  .saludo-grande{ font-family:'Fraunces',serif; font-size:26px; font-weight:600;
    letter-spacing:-.01em; color:var(--gold); text-transform:none; margin:0 0 4px; }
  .page-desc{ color:var(--muted); font-size:14px; margin:6px 0 0; max-width:640px; }

  /* ---------- GENERIC ---------- */
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; margin-bottom:18px;}
  .card-title{ font-size:15px; margin:0 0 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .grid{ display:grid; gap:14px; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  @media(max-width:900px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } .main{padding:20px;} .sidebar{width:190px;} }

  .stat{ background:var(--panel-2); border-radius:var(--radius); padding:16px 18px; }
  .stat-label{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:0 0 6px;}
  .stat-value{ font-size:26px; font-weight:700; margin:0; font-family:'Fraunces',serif; }

  label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:5px; }
  input[type=text], input[type=number], select, textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line-strong); border-radius:8px; font-size:13.5px;
    background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary); }
  .field{ margin-bottom:12px; }
  .btn{
    padding:9px 16px; border-radius:8px; border:1px solid var(--line-strong); background:#fff; font-size:13.5px;
    font-weight:600; cursor:pointer; color:var(--ink); display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{ border-color:var(--primary); }
  .btn-primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .btn-primary:hover{ background:var(--primary-dark); border-color:var(--primary-dark); }
  .btn-danger{ color:var(--red); border-color:var(--red-light); background:var(--red-light); }
  .btn-danger:hover{ background:var(--red); color:#fff; }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:8px 10px; border-bottom:2px solid var(--line-strong); white-space:nowrap;}
  td{ padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:hover td{ background:var(--panel-2); }
  .table-wrap{ overflow-x:auto; }

    return (typeof p === 'number' && !isNaN(p)) ? p : PESO_ACTIVIDADES_DEF;

if('serviceWorker' in navigator){

/* Comprime una imagen elegida por el usuario antes de guardarla: se
   reduce a un ancho máximo razonable y se convierte a JPEG, para que
   adjuntar fotos no dispare el tamaño de la base de datos compartida. */
function comprimirImagen(file, maxAncho){
  maxAncho = maxAncho || 900;
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(null); return; }
    if(!/^image\//.test(file.type)){ reject(new Error('El archivo no es una imagen.')); return; }
    const lector = new FileReader();
    lector.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const escala = Math.min(1, maxAncho / img.width);
        const w = Math.max(1, Math.round(img.width * escala));
        const h = Math.max(1, Math.round(img.height * escala));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen.'));
      img.src = lector.result;
    };
    lector.onerror = ()=>reject(new Error('No se pudo leer el archivo.'));
    lector.readAsDataURL(file);
  });
}

  if(!file) return null;
  return comprimirImagen(file, maxAncho);

const TOKEN_SYNC = 'd4ae7102ac20122b55670a6b41aa3cae46e73138';

async function nubePing(){
  const url = getSyncUrl();

async function nubeLeer(){
  const url = getSyncUrl();

    {method:'GET', redirect:'follow'}), 12000);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const txt = await r.text();
  if(!txt || txt.trim()==='' || txt.trim()==='null') return null;

      motor = 'nube';
      return;
    }catch(e){ console.warn('sincronización en la nube no disponible', e); }
  }
  if(typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function'){
    // se intenta más de una vez: un fallo momentáneo no debe dejar sin sincronización toda la sesión
    for(let i=0; i<2; i++){
      try{
        await conLimite(window.storage.set('__prueba', '1', true), 5000);
        motor = 'compartido';
        return;
      }catch(e){ console.warn('almacenamiento compartido no disponible', e); }
      await new Promise(r=>setTimeout(r, 600));
    }
  }
  try{
    window.localStorage.setItem('__prueba','1');
    window.localStorage.removeItem('__prueba');
    motor = 'local';
    return;
  }catch(e){ console.warn('almacenamiento local no disponible', e); }
  motor = 'memoria';
}
/* Si se degradó por un problema pasajero, se vuelve a intentar el modo compartido */
async function intentarPromocion(){
  if(motor === 'compartido' || motor === 'nube') return false;
  if(getSyncUrl()){
    try{ await nubePing(); motor='nube'; iniciarSync(); setSyncStatus('ok'); if(currentUser) render(); return true; }catch(e){}
  }
  if(!(typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function')) return false;
  try{
    await conLimite(window.storage.set('__prueba', '1', true), 5000);
    motor = 'compartido';
    iniciarSync();
    setSyncStatus('ok');
    if(currentUser) render();
    return true;
  }catch(e){ return false; }
}

async function leerCrudo(clave, compartido){
  if(motor === 'nube' && clave === DOC_KEY){
    const doc = await nubeLeer();
    return doc ? JSON.stringify(doc) : null;
  }
  if(motor === 'nube'){  // sesión y ajustes siguen siendo de cada equipo
    try{ return window.localStorage.getItem(clave); }catch(e){ return null; }
  }
  if(motor === 'compartido'){
    const r = await conLimite(window.storage.get(clave, compartido!==false));
    return r ? r.value : null;
  }
  if(motor === 'local'){ return window.localStorage.getItem(clave); }
  return memoria[clave] || null;
}
async function escribirCrudo(clave, valor, compartido){
  if(motor === 'nube' && clave === DOC_KEY){
    await nubeEscribir(valor);
    try{ window.localStorage.setItem(DOC_KEY, valor); }catch(e){}  // copia local por si se cae la red
    return true;
  }
  if(motor === 'nube'){
    try{ window.localStorage.setItem(clave, valor); }catch(e){}
    return true;
  }
  if(motor === 'compartido'){
    const r = await conLimite(window.storage.set(clave, valor, compartido!==false));
    if(!r) throw new Error('respuesta vacía');
    return true;
  }
  if(motor === 'local'){ window.localStorage.setItem(clave, valor); return true; }
  memoria[clave] = valor; return true;
}

async function leerDoc(){
  // OJO: no se debe confundir "no hay ningún dato todavía" con "hubo un
  // error leyendo" — antes ambos casos devolvían null por igual, y eso
  // hacía que un simple corte de internet pudiera terminar borrando los
  // datos reales (el sistema pensaba "está vacío" y escribía una base en
  // blanco encima). Ahora, si falla la lectura, se avisa con un error en
  // vez de asumir que no hay nada.
  const v = await leerCrudo(DOC_KEY, true);

/* Reconoce los datos de ejemplo que traían las versiones anteriores.
   Solo se descartan si el equipo NO está conectado al centro escolar. */
function esDemoAntiguo(doc){
  if(!doc || !Array.isArray(doc.docentes)) return false;
  const idsDemo = ['t_direccion','t_coord','t_secre','t_jose','t_elena','t_walter','t_karla','t_mario'];
  const nombresDemo = ['lic. ana martínez','lic. carlos rivas','sra. marta lópez','prof. josé hernández'];
  const coincideId = doc.docentes.filter(d=>idsDemo.indexOf(d.id) >= 0).length;
  const coincideNombre = doc.docentes.filter(d=>
    nombresDemo.indexOf(String(d.nombre||'').trim().toLowerCase()) >= 0).length;
  if(coincideId < 3 && coincideNombre < 3) return false;
  // si además el colegio nunca se personalizó, es la base de ejemplo
  const nombreColegio = (doc.ajustes && doc.ajustes.nombreColegio) || 'Centro Escolar';
  return nombreColegio === 'Centro Escolar';
}

    // verdad, no se toca nada y se avisa.

      adoptarDoc(viejos);

  }else if(esDemoAntiguo(doc) && motor !== 'nube' && motor !== 'compartido'){

    // se descartan para no mostrar docentes ni alumnos inventados.

  if(!DB.mensajes) DB.mensajes = [];
  if(!DB.reportesEliminados) DB.reportesEliminados = [];
  if(DB.config.correlativoReportes === undefined){
    // Compatibilidad con datos ya existentes: arranca del número más alto ya usado.

/* Aplica el cambio en pantalla al instante y lo encola para guardarlo. */
function commit(mutador){
  mutador(docActual());
  pendientes.push(mutador);
  // En Hojas de tareas y Calificaciones el guardado es manual: el cambio
  // se ve en pantalla al instante, pero no se manda al servidor hasta que
  // la persona presiona "Guardar cambios" — así varios campos editados
  // seguidos se mandan juntos en un solo guardado, en vez de uno por
  // campo. En el resto de paneles se sigue guardando solo, como siempre.
  if(currentView==='hojas' || currentView==='calificaciones'){
    setSyncStatus('manual');
  }else{
    setSyncStatus('pendiente');
    // Espera un poco antes de guardar, para agrupar varios campos editados
    // seguidos (por ejemplo, toda una fila de la hoja de tareas) en un solo
    // guardado, en vez de uno por cada campo. Sigue siendo automático — la
    // persona no tiene que hacer nada distinto, solo se guarda menos veces.
    programarGuardado(700);
  }
}
function programarGuardado(ms){
  if(flushTimer) clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, ms);
}
async function flush(){
  if(guardando || pendientes.length===0) return;
  guardando = true;
  const lote = pendientes.slice();
  let exito = false;
  try{
    const remoto = await leerDoc();
    const base = remoto || docActual();
    lote.forEach(m=>{ try{ m(base); }catch(e){ console.error('reaplicar', e); } });
    await escribirDoc(base);
    // Mientras se leía/guardaba (dos idas y vueltas a la nube), el usuario
    // pudo haber hecho más cambios (por ejemplo, borrar otra nota). Esos
    // cambios ya quedaron en pendientes pero todavía no en "base": hay que
    // volver a aplicarlos antes de adoptar, si no, adoptarDoc los borraría
    // de la pantalla un instante aunque sigan pendientes de guardar.
    const nuevosDurante = pendientes.slice(lote.length);
    nuevosDurante.forEach(m=>{ try{ m(base); }catch(e){ console.error('reaplicar', e); } });
    adoptarDoc(base);
    pendientes = nuevosDurante;
    intentosFallidos = 0;
    exito = true;
  }catch(e){
    console.error('guardar', e);
    intentosFallidos++;
  }finally{
    // pase lo que pase, nunca queda bloqueado
    guardando = false;
  }
  if(exito){
    if(pendientes.length>0){ programarGuardado(300); }
    else{
      setSyncStatus('ok');
      // No reconstruir la pantalla si el maestro sigue escribiendo en un
      // campo (por ejemplo, pasó al siguiente campo de la fila y ese
      // guardado en segundo plano terminó mientras seguía tecleando):
      // eso le borraría lo que todavía no había confirmado. Se actualiza
      // en cuanto suelte el campo, igual que ya hace pullCambios().
      if(currentUser && !hayEdicionEnCurso()) render();
    }
  }else{
    setSyncStatus('error');
    if(intentosFallidos % 3 === 0) intentarPromocion();
    const espera = Math.min(800 * Math.pow(2, intentosFallidos-1), 20000);
    if(intentosFallidos === 3){
      showToast('No se está pudiendo guardar. Usa "Descargar respaldo" para no perder nada.');
    }
    programarGuardado(espera);
  }
}
/* Reintento manual desde el indicador */
async function reintentarGuardado(){
  if(sesionEstudiante){ await actualizarDatosEstudiante(); return; }
  intentosFallidos = 0;
  await intentarPromocion();
  if(pendientes.length>0){ programarGuardado(0); showToast('Reintentando…'); }
  else pullCambios(false);
}

/* ===================== GENERADOR DE ARCHIVOS .XLSX =====================
   Escribe un libro de Excel real (ZIP + XML), sin librerías externas.
   ===================================================================== */
const TABLA_CRC = (()=>{
  const t = new Uint32Array(256);
  for(let n=0; n<256; n++){
    let c = n;
    for(let k=0; k<8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0; i<bytes.length; i++) c = TABLA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function textoABytes(txt){
  if(typeof TextEncoder !== 'undefined') return new TextEncoder().encode(txt);
  const arr = [];
  for(let i=0;i<txt.length;i++){
    let c = txt.charCodeAt(i);
    if(c < 0x80) arr.push(c);
    else if(c < 0x800){ arr.push(0xC0|(c>>6), 0x80|(c&63)); }
    else { arr.push(0xE0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63)); }
  }
  return new Uint8Array(arr);
}
/* ZIP sin compresión (método "store"): suficiente y muy simple */
function crearZip(archivos){
  const partes = [], central = [];
  let offset = 0;
  const d = new Date();
  const fechaDos = {
    hora: [ (((d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1)) & 0xFF),
            ((((d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1)) >> 8) & 0xFF) ],
    fecha:[ ((((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) & 0xFF),
            (((((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) >> 8) & 0xFF) ]
  };
  const u16 = v => [v & 0xFF, (v>>8) & 0xFF];
  const u32 = v => [v & 0xFF, (v>>8) & 0xFF, (v>>16) & 0xFF, (v>>24) & 0xFF];

  archivos.forEach(f=>{
    const nombre = textoABytes(f.nombre);
    const datos = (f.contenido instanceof Uint8Array) ? f.contenido : textoABytes(f.contenido);
    const crc = crc32(datos);
    const local = [].concat(
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), fechaDos.hora, fechaDos.fecha,
      u32(crc), u32(datos.length), u32(datos.length),
      u16(nombre.length), u16(0)
    );
    partes.push(new Uint8Array(local), nombre, datos);
    central.push([].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), fechaDos.hora, fechaDos.fecha,
      u32(crc), u32(datos.length), u32(datos.length),
      u16(nombre.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
    ), nombre);
    offset += local.length + nombre.length + datos.length;
  });

  const centralBytes = [];
  for(let i=0; i<central.length; i+=2){
    centralBytes.push(new Uint8Array(central[i]), central[i+1]);
  }
  const tamCentral = centralBytes.reduce((s,b)=>s+b.length, 0);
  const fin = new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0), u16(archivos.length), u16(archivos.length),
    u32(tamCentral), u32(offset), u16(0)
  ));

  const todo = partes.concat(centralBytes, [fin]);
  const total = todo.reduce((s,b)=>s+b.length, 0);
  const salida = new Uint8Array(total);
  let pos = 0;
  todo.forEach(b=>{ salida.set(b, pos); pos += b.length; });
  return salida;
}
function escaparXml(txt){
  return String(txt).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function letraColumna(n){
  let s = '';
  while(n > 0){ const r = (n-1) % 26; s = String.fromCharCode(65+r) + s; n = Math.floor((n-1)/26); }
  return s;
}
function hojaXml(encabezados, filas){
  const fila = (celdas, nf, estilo) => {
    const cs = celdas.map((v,i)=>{
      const ref = letraColumna(i+1) + nf;
      const est = estilo ? ' s="'+estilo+'"' : '';
      if(v === null || v === undefined || v === '') return '<c r="'+ref+'"'+est+'/>';
      if(typeof v === 'number' && isFinite(v)) return '<c r="'+ref+'"'+est+'><v>'+v+'</v></c>';
      return '<c r="'+ref+'"'+est+' t="inlineStr"><is><t xml:space="preserve">'+escaparXml(v)+'</t></is></c>';
    }).join('');
    return '<row r="'+nf+'">'+cs+'</row>';
  };
  const anchos = encabezados.map((h,i)=>{
    let max = String(h).length;
    filas.forEach(f=>{ const v = f[i]; if(v!==undefined && v!==null) max = Math.max(max, String(v).length); });
    return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+Math.min(46, Math.max(8, max+3))+'" customWidth="1"/>';
  }).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<cols>'+anchos+'</cols><sheetData>' +
    fila(encabezados, 1, 1) +
    filas.map((f,i)=>fila(f, i+2, 0)).join('') +
    '</sheetData></worksheet>';
}

function descargarXlsx(nombreArchivo, hojas){
  try{
    const bytes = construirXlsx(hojas);
    const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo.replace(/[\\\/:\*\?"<>\|]/g,' ').trim() + '.xlsx';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    showToast('Descargado: ' + nombreArchivo + '.xlsx');
    return true;
  }catch(e){
    console.error('xlsx', e);
    showToast('No se pudo generar el archivo de Excel.');
    return false;
  }
}

/* Descarga la base completa como libro de Excel (una hoja por sección) */
function descargarRespaldo(){
  try{
    const grados = misGrados(currentUser);            // solo las aulas que le competen
    const estVisibles = DB.estudiantes.filter(e=>grados.indexOf(e.grado)>=0);
    const nombreAsig = {};
    DB.asignaturas.forEach(a=>nombreAsig[a.id]=a.nombre);

    const hEst = ['N°','Grado','Apellidos','Nombres'];
    const fEst = [];
    grados.forEach(g=>{
      ordenarEstudiantes(estVisibles.filter(e=>e.grado===g), 'apellidos')
        .forEach((e,i)=>fEst.push([i+1, g, apellidosDe(e), nombresDe(e)]));
    });

    const hNotas = ['Grado','Estudiante','Asignatura','Período','Casilla','Nota','Estado','Fecha','Observaciones'];
    const fNotas = [];
    estVisibles.forEach(e=>{
      asignaturasVisibles(e.grado).forEach(asig=>{
        const acts = getActividades(e.grado, asig.id, p);
        for(let p=1;p<=4;p++){
          acts.forEach(a=>{
            const nota = getComp(e.id, asig.id, p, 'act:'+a.id);
            const est = getEstado(e.id, asig.id, p, a.id);
            const fec = getFechaTarea(e.grado, asig.id, a.id, p);
            const ob = getObs(e.id, asig.id, p, 'act:'+a.id);
            if(nota!==undefined || est || fec || ob)
              fNotas.push([e.grado, e.nombre, asig.nombre, p, a.nombre,
                nota!==undefined?nota:'', est?ESTADOS[est].nombre:'', fec||'', ob||'']);
          });
          rubrosActivos().forEach(r=>{
            if(r.conRecuperacion){
              const rec = getComp(e.id, asig.id, p, claveRecuperacion(r.key));
              if(rec!==undefined)
                fNotas.push([e.grado, e.nombre, asig.nombre, p, 'Recuperación de '+getNombreRubro(e.grado, asig.id, r.key), rec, '', '', '']);
            }
            const nota = getComp(e.id, asig.id, p, r.key);
            const ob = getObs(e.id, asig.id, p, r.key);
            const esTarea = esRubroTarea(r.key);
            const est = esTarea ? getEstado(e.id, asig.id, p, r.key) : '';
            const fec = esTarea ? getFechaTarea(e.grado, asig.id, r.key, p) : '';
            if(nota!==undefined || ob || est || fec)
              fNotas.push([e.grado, e.nombre, asig.nombre, p, getNombreRubro(e.grado, asig.id, r.key),
                nota!==undefined?nota:'', est?ESTADOS[est].nombre:'', fec||'', ob||'']);
          });
        }
      });
    });

    const hRes = ['Grado','Estudiante','Asignatura','Período 1','Período 2','Período 3','Período 4','Promedio final','Estado'];
    const fRes = [];
    estVisibles.forEach(e=>{
      asignaturasVisibles(e.grado).forEach(asig=>{
        const ps = [1,2,3,4].map(p=>{
          const i = periodInfo(e.id, asig.id, p, e.grado);
          return i.valor===null?'':Number(i.valor.toFixed(1));
        });
        const si = subjectInfo(e.id, asig.id, e.grado);
        if(ps.some(v=>v!=='') )
          fRes.push([e.grado, e.nombre, asig.nombre].concat(ps,
            [si.valor===null?'':Number(si.valor.toFixed(1)), si.completo?'Completo':'Parcial']));
      });
    });

    const hMat = ['N°','Grado','Apellidos','Nombres','Promedio general del año'];
    const fMat = [];
    grados.forEach(g=>{
      ordenarEstudiantes(DB.estudiantes.filter(e=>e.grado===g), 'apellidos')
        .forEach((e,i)=>{
          const prom = studentFinalAverage(e.id, g);
          fMat.push([i+1, g, apellidosDe(e), nombresDe(e), prom===null?'':Number(prom.toFixed(1))]);
        });
    });

    const guardado = currentUser;
    const hTar = ['Fecha','Grado','Materia','Estudiante','Nombre de la tarea','Tipo','Período','Estado','Observaciones'];
    const fTar = listaTareas({}).map(f=>[f.fecha||'', f.grado, f.materia, f.estudiante, f.tarea,
      f.tipo||'Actividad', f.periodo, f.estado?ESTADOS[f.estado].nombre:'', f.obs||'']);

    const hAl = ['Nivel','Estudiante','Grado','Tareas pendientes','Materias'];
    const fAl = calcularAlertas({}).map(a=>[a.alerta.nombre, a.estudiante, a.grado, a.cantidad, a.materias.join(', ')]);

    const hDoc = ['Docente','Perfil','Grado de orientación','Asignaturas asignadas'];
    const fDoc = (isAdmin(currentUser)?DB.docentes.filter(d=>!esPropietario(d)):[currentUser]).map(d=>[d.nombre, domainLabel(d), orientacionesDe(d).join(', '),
      (d.asignaciones||[]).map(a=>(nombreAsig[a.asignaturaId]||'?')+' ('+a.grado+')').join(', ')]);

    const hojas = [
      ['Estudiantes', hEst, fEst], ['Notas', hNotas, fNotas], ['Resumen', hRes, fRes],
      ['Matriz', hMat, fMat], ['Tareas', hTar, fTar], ['Alertas', hAl, fAl], ['Docentes', hDoc, fDoc]
    ];
    const anioArch = (DB.ajustes && DB.ajustes.anio) || new Date().getFullYear();
    descargarXlsx('Base escolar ' + anioArch,
      hojas.map(h=>({nombre:h[0], encabezados:h[1], filas:h[2]})));
  }catch(e){ console.error(e); showToast('No se pudo generar el archivo de Excel.'); }
}

/* ============================= SESIÓN ============================= */
async function guardarSesion(){
  try{
    const datos = {userId: currentUser?currentUser.id:null, esEstudiante: sesionEstudiante, view: currentView};
    if(sesionEstudiante && sesionEstudianteCred){
      // Se guarda en este dispositivo (nunca compartido) para poder reanudar
      // la sesión sin descargar la base completa ni volver a pedir la clave.
      datos.usuarioEst = sesionEstudianteCred.usuario;
      datos.claveEst = sesionEstudianteCred.claveHash;
    }
    await escribirCrudo('sesion', JSON.stringify(datos), false);
  }catch(e){}
}
async function restaurarSesion(){
  try{
    const v = await leerCrudo('sesion', false);
    if(!v) return;
    const s = JSON.parse(v);
    if(!s || !s.userId) return;
    if(s.esEstudiante){
      if(motor === 'nube' && s.usuarioEst && s.claveEst){
        try{
          const datos = await nubeLeerEstudiante(s.usuarioEst, s.claveEst);
          if(datos && datos.estudiante){
            adoptarDocEstudiante(datos);
            currentUser = DB.estudiantes[0];
            sesionEstudiante = true;
            sesionEstudianteCred = {usuario: s.usuarioEst, claveHash: s.claveEst};
            currentView = s.view || 'sincronizacionEstudiante';
            return;
          }
        }catch(e){ console.warn('no se pudo reanudar sesión de estudiante', e); }
        return;   // credenciales guardadas ya no válidas: se queda en el login
      }
      // Sin Apps Script propio no hay filtrado en el servidor: recurre a la base completa
      if(!baseCompletaCargada) await loadAll();
      const e = DB.estudiantes.find(x=>x.id===s.userId);
      if(e){ currentUser = e; sesionEstudiante = true; currentView = s.view || 'sincronizacionEstudiante'; if(!e.accesos) e.accesos = accesosPorDefecto(); }
    }else{
      if(!baseCompletaCargada) await loadAll();
      const u = DB.docentes.find(t=>t.id===s.userId);
      if(u){ currentUser = u; sesionEstudiante = false; currentView = s.view || 'panel'; }
    }
  }catch(e){}
}

let syncStatus = 'ok';
let lastSync = null;
let syncTimer = null;
function setSyncStatus(s){
  syncStatus = s;
  if(s==='ok') lastSync = new Date();
  const el = document.getElementById('sync-indicator');
  if(el) el.outerHTML = renderSyncIndicator();
  actualizarBotonGuardarManual();
}
/* Aviso + botón de "Guardar cambios" para los paneles de guardado manual
   (Hojas de tareas y Calificaciones). Se actualiza reemplazando solo este
   bloque (no toda la pantalla), para no interrumpir si la persona sigue
   escribiendo en otro campo mientras tanto. */
function renderGuardarManualBanner(){
  if(currentView!=='hojas' && currentView!=='calificaciones') return '';
  const hay = pendientes.length > 0;
  return `<div id="guardar-manual-banner" class="card" style="margin-bottom:14px; border-left:4px solid ${hay?'var(--gold)':'var(--primary)'}; background:${hay?'var(--gold-light)':'var(--primary-light)'};">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <p style="margin:0; font-size:13.5px; font-weight:600; color:${hay?'#7A5A1C':'var(--primary-dark)'};">${hay?'⚠️ Tienes cambios sin guardar':'✓ Todo guardado'}</p>
      <button class="btn ${hay?'btn-primary':''}" ${hay?'':'disabled'} onclick="guardarCambiosManual()">Guardar cambios</button>
    </div>
  </div>`;
}
function actualizarBotonGuardarManual(){
  const el = document.getElementById('guardar-manual-banner');
  if(el) el.outerHTML = renderGuardarManualBanner();
}
function guardarCambiosManual(){
  if(pendientes.length===0){ showToast('No hay cambios sin guardar.'); return; }
  showToast('Guardando…');
  programarGuardado(0);
}
function hayEdicionEnCurso(){
  const a = document.activeElement;
  if(a && (a.tagName==='INPUT' || a.tagName==='SELECT' || a.tagName==='TEXTAREA')) return true;
  if(viewState.modalStudent || viewState.modalTeacher || viewState.modalSubject) return true;
  return false;
}
async function pullCambios(silencioso){
  if(motor !== 'compartido' && motor !== 'nube') return false;   // sin lugar común no hay nada que traer
  if(pendientes.length>0 || guardando) return false;
  const doc = await leerDoc();
  if(!doc){ setSyncStatus('error'); return false; }
  // Puede que, mientras se esperaba la respuesta, el usuario haya hecho un
  // cambio propio (quedó en camino a guardarse): en ese caso no hay que
  // pisarlo con lo que se acaba de traer del servidor.
  if(pendientes.length>0 || guardando) return false;
  const cambio = JSON.stringify(docActual()) !== JSON.stringify(doc);
  if(cambio){
    adoptarDoc(doc);
    if(currentUser){
      const u = sesionEstudiante ? DB.estudiantes.find(e=>e.id===currentUser.id) : DB.docentes.find(t=>t.id===currentUser.id);
      currentUser = u || null;
      if(!currentUser) sesionEstudiante = false;
    }
    if(!hayEdicionEnCurso()){
      setSyncStatus('ok');
      render();
      if(!silencioso) showToast('Datos actualizados.');
      return true;
    }
  }
  setSyncStatus('ok');
  return cambio;
}
function iniciarSync(){
  if(syncTimer) clearInterval(syncTimer);
  if(motor !== 'compartido' && motor !== 'nube') return;
  const refrescar = ()=>{ if(sesionEstudiante) actualizarDatosEstudiante(); else pullCambios(true); };
  syncTimer = setInterval(()=>{ if(currentUser && !document.hidden) refrescar(); }, 15000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && currentUser) refrescar(); });
}
function renderSyncIndicator(){
  const hora = lastSync ? lastSync.toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'}) : '—';
  let color = 'var(--primary)', texto;
  if(syncStatus==='pendiente'){ color = 'var(--gold)'; texto = 'Guardando…'; }
  else if(syncStatus==='manual'){ color = 'var(--gold)'; texto = 'Cambios sin guardar'; }
  else if(syncStatus==='error'){ color = 'var(--red)'; texto = 'No se pudo guardar — toca para reintentar'; }
  else if(motor==='nube'){ texto = 'Sincronizado ' + hora; }
  else if(motor==='compartido'){ texto = 'Sincronizado ' + hora; }
  else if(motor==='local'){ texto = 'Solo este equipo ' + hora; }
  else { texto = 'Sin guardado — descarga respaldo'; color = 'var(--red)'; }
  return `<div id="sync-indicator" class="sync-row" onclick="reintentarGuardado()" title="Reintentar / actualizar">
    <span class="sync-dot" style="background:${color}"></span><span>${texto}</span>
  </div>`;
}

function doGet(e) {

/* Busca al estudiante dueño de estas credenciales dentro del documento
   completo. Se usa en todas las acciones que un estudiante puede pedir. */
function buscarEstudiante(doc, pedido) {
  if (!doc || !doc.estudiantes) return null;
  for (var i = 0; i < doc.estudiantes.length; i++) {
    var e = doc.estudiantes[i];
    if (e.usuario === pedido.usuario && e.clave === pedido.clave) return e;
  }
  return null;
}

/* Entrega SOLO lo que le corresponde a un estudiante: sus propias notas,
   sus propios reportes, sus propios mensajes, y las hojas de tareas de su
   grado. Nunca la lista de docentes ni los datos de los demás estudiantes. */
function datosEstudiante(cuerpoJson) {
  var pedido = JSON.parse(cuerpoJson);
  var doc = JSON.parse(leerDatos());
  var est = buscarEstudiante(doc, pedido);
  if (!est) return JSON.stringify({error: true});

  var idsAsig = {};
  ((doc.curriculo && doc.curriculo[est.grado]) || []).forEach(function(id){ idsAsig[id] = true; });
  (doc.docentes || []).forEach(function(d){
    (d.asignaciones || []).forEach(function(a){ if (a.grado === est.grado) idsAsig[a.asignaturaId] = true; });
  });
  var asignaturas = (doc.asignaturas || []).filter(function(a){ return idsAsig[a.id]; });
  var curriculoFiltrado = {};
  curriculoFiltrado[est.grado] = Object.keys(idsAsig);

  var prefijoEst = est.id + '|';
  var prefijoGrado = est.grado + '|';
  function porPrefijo(obj, prefijo) {
    var salida = {};
    Object.keys(obj || {}).forEach(function(k){ if (k.indexOf(prefijo) === 0) salida[k] = obj[k]; });
    return salida;
  }

  var boletaDatos = {};
  if (doc.boletaDatos && doc.boletaDatos[est.id]) boletaDatos[est.id] = doc.boletaDatos[est.id];

  var mensajes = (doc.mensajes || []).filter(function(m){
    return m.deId === est.id || m.paraId === est.id;
  });

  return JSON.stringify({
    estudiante: est,
    asignaturas: asignaturas,
    curriculo: curriculoFiltrado,
    config: doc.config || {},
    ajustes: doc.ajustes || {},
    calificaciones: porPrefijo(doc.calificaciones, prefijoEst),
    estados: porPrefijo(doc.estados, prefijoEst),
    observaciones: porPrefijo(doc.observaciones, prefijoEst),
    hojas: porPrefijo(doc.hojas, prefijoGrado),
    actividades: porPrefijo(doc.actividades, prefijoGrado),
    tareas: porPrefijo(doc.tareas, prefijoGrado),
    rubros: porPrefijo(doc.rubros, prefijoGrado),
    reportes: (doc.reportes || []).filter(function(r){ return r.estId === est.id; }),
    boletaDatos: boletaDatos,
    mensajes: mensajes
  });
}

/* Agrega una línea a la bitácora sin que el estudiante reciba ni envíe
   nunca la base completa: el servidor valida sus credenciales acá mismo. */
function registrarEvento(cuerpoJson) {
  var pedido = JSON.parse(cuerpoJson);
  var doc = JSON.parse(leerDatos());
  var est = buscarEstudiante(doc, pedido);
  if (!est) return '{"error":true}';
  doc.bitacora = doc.bitacora || [];
  doc.bitacora.push({
    ts: new Date().toISOString(), userId: est.id, nombre: est.nombre,
    accion: pedido.accion || '', detalle: pedido.detalle || ''
  });
  if (doc.bitacora.length > 800) doc.bitacora = doc.bitacora.slice(doc.bitacora.length - 800);
  guardarDatos(JSON.stringify(doc));
  return '{"ok":true}';
}

/* Un estudiante reporta un problema de la plataforma: se valida su
   credencial y se agrega el reporte directamente en el servidor, sin que
   su navegador reciba ni envíe nunca la base completa. */
function agregarSoporte(cuerpoJson) {
  var pedido = JSON.parse(cuerpoJson);
  var doc = JSON.parse(leerDatos());
  var est = buscarEstudiante(doc, pedido);
  if (!est) return '{"error":true}';
  doc.soporte = doc.soporte || [];
  var numeros = doc.soporte.map(function(s){ return Number(s.numero) || 0; });
  var numero = (numeros.length ? Math.max.apply(null, numeros) : 0) + 1;
  doc.soporte.push({
    id: 'sop_' + new Date().getTime(), numero: numero, ts: new Date().toISOString(),
    userId: est.id, nombre: est.nombre, origen: 'estudiante',
    titulo: pedido.titulo || '', descripcion: pedido.descripcion || '',
    imagen: pedido.imagen || null, estado: 'pendiente', vistas: [], notas: []
  });
  guardarDatos(JSON.stringify(doc));
  return '{"ok":true}';
}

/* Un estudiante envía un mensaje (normalmente, respondiendo a alguien que
   ya le escribió). Se valida su credencial en el servidor. */
function enviarMensajeEstudiante(cuerpoJson) {

/* Combina lo que este equipo tiene con lo que ya está en el Drive.
   Regla: nunca se borra nada de nadie. Ante una nota repetida en la misma
   casilla, se conserva la que ya estaba en el Drive y se reporta el choque. */
function combinarDocs(local, nube){
  const res = {
    estudiantes: (nube.estudiantes||[]).slice(),
    asignaturas: (nube.asignaturas||[]).slice(),
    docentes: (nube.docentes||[]).slice(),
    calificaciones: Object.assign({}, nube.calificaciones||{}),
    config: nube.config || local.config,
    actividades: Object.assign({}, nube.actividades||{}),
    curriculo: Object.assign({}, nube.curriculo||{}),
    tareas: Object.assign({}, nube.tareas||{}),
    estados: Object.assign({}, nube.estados||{}),
    observaciones: Object.assign({}, nube.observaciones||{}),
    rubros: Object.assign({}, nube.rubros||{}),
    boletaDatos: Object.assign({}, nube.boletaDatos||{}, local.boletaDatos||{}),
    hojas: Object.assign({}, nube.hojas||{}, local.hojas||{}),
    bitacora: (nube.bitacora||[]).concat((local.bitacora||[]).filter(l=>!(nube.bitacora||[]).some(x=>x.ts===l.ts && x.userId===l.userId))).slice(-800),
    reportes: (nube.reportes||[]).concat((local.reportes||[]).filter(r=>!(nube.reportes||[]).some(x=>x.id===r.id))),
    averias: (nube.averias||[]).concat((local.averias||[]).filter(r=>!(nube.averias||[]).some(x=>x.id===r.id))),
    ajustes: (local.ajustes && local.ajustes.nombreColegio &&
              local.ajustes.nombreColegio !== 'Centro Escolar') ? local.ajustes : (nube.ajustes || local.ajustes)
  };
  const cuenta = {estudiantes:0, docentes:0, asignaturas:0, notas:0, choques:0};
  const mapaIds = {};   // id local -> id definitivo en el Drive

  (local.asignaturas||[]).forEach(a=>{
    const ya = res.asignaturas.find(x=>x.id===a.id || x.nombre.toLowerCase()===a.nombre.toLowerCase());
    if(ya){ mapaIds[a.id] = ya.id; }
    else { res.asignaturas.push(a); mapaIds[a.id] = a.id; cuenta.asignaturas++; }
  });
  (local.estudiantes||[]).forEach(e=>{
    const ya = res.estudiantes.find(x=>x.id===e.id ||
      (x.nombre.trim().toLowerCase()===e.nombre.trim().toLowerCase() && x.grado===e.grado));
    if(ya){ mapaIds[e.id] = ya.id; }
    else { res.estudiantes.push(e); mapaIds[e.id] = e.id; cuenta.estudiantes++; }
  });
  (local.docentes||[]).forEach(d=>{
    if(d.id === 'u_inicial') return;        // usuario de ejemplo: no se sube nunca
    const ya = res.docentes.find(x=>x.id===d.id || x.nombre.trim().toLowerCase()===d.nombre.trim().toLowerCase());
    if(!ya){ res.docentes.push(d); cuenta.docentes++; }
    else if(d.asignaciones){       // se suman asignaciones que el Drive no tenga
      ya.asignaciones = ya.asignaciones || [];
      d.asignaciones.forEach(a=>{
        const aid = mapaIds[a.asignaturaId] || a.asignaturaId;
        if(!ya.asignaciones.some(z=>z.grado===a.grado && z.asignaturaId===aid))
          ya.asignaciones.push({grado:a.grado, asignaturaId:aid});
      });
      const orientUnion = new Set(orientacionesDe(ya).concat(orientacionesDe(d)));
      if(orientUnion.size){ ya.orientaciones = Array.from(orientUnion); delete ya.orientacion; }
    }
  });
  Object.keys(local.actividades||{}).forEach(k=>{ if(!res.actividades[k]) res.actividades[k] = local.actividades[k]; });
  Object.keys(local.tareas||{}).forEach(k=>{ if(!res.tareas[k]) res.tareas[k] = local.tareas[k]; });
  Object.keys(local.observaciones||{}).forEach(k=>{ if(!res.observaciones[k]) res.observaciones[k] = local.observaciones[k]; });
  Object.keys(local.rubros||{}).forEach(k=>{ if(!res.rubros[k]) res.rubros[k] = local.rubros[k]; });
  Object.keys(local.curriculo||{}).forEach(g=>{
    res.curriculo[g] = res.curriculo[g] || [];
    (local.curriculo[g]||[]).forEach(id=>{ const d=mapaIds[id]||id; if(res.curriculo[g].indexOf(d)<0) res.curriculo[g].push(d); });
  });
  Object.keys(local.estados||{}).forEach(k=>{
    const p = k.split('|');
    const nueva = [mapaIds[p[0]]||p[0], mapaIds[p[1]]||p[1], p[2], p[3]].join('|');
    if(!(nueva in res.estados)) res.estados[nueva] = local.estados[k];
  });
  Object.keys(local.calificaciones||{}).forEach(k=>{
    const p = k.split('|');
    const nueva = [mapaIds[p[0]]||p[0], mapaIds[p[1]]||p[1], p[2], p[3]].join('|');
    if(!(nueva in res.calificaciones)){ res.calificaciones[nueva] = local.calificaciones[k]; cuenta.notas++; }
    else if(res.calificaciones[nueva] !== local.calificaciones[k]){
      res.calificaciones[nueva] = local.calificaciones[k];   // este equipo actualiza el Drive
      cuenta.choques++;
    }
  });
  return {doc:res, cuenta};
}

async function guardarSyncUrl(){
  const v = document.getElementById('sync_input').value.trim();
  if(!v){ showToast('Pega el enlace que termina en /exec.'); return; }
  if(!/^https:\/\/.+\/exec$/.test(v)){ showToast('El enlace debe empezar con https:// y terminar en /exec.'); return; }
  setSyncUrl(v);
  showToast('Conectando…');
  try{
    const doc = await nubeLeer();
    const mio = JSON.parse(JSON.stringify(docActual()));
    motor = 'nube';
    if(doc){
      // Un equipo recién abierto (sin datos propios) solo adopta lo del centro escolar,
      // sin subir el usuario de ejemplo ni pisar el nombre del colegio.
      const sinDatosPropios = (mio.estudiantes||[]).length === 0 &&
        (mio.docentes||[]).length <= 1 &&
        Object.keys(mio.calificaciones||{}).length === 0;
      if(sinDatosPropios){
        adoptarDoc(doc);
        setSyncStatus('ok');
        iniciarSync();
        showToast('Conectado con los datos del centro escolar.');
        render();
        return;
      }
      // Este equipo actualiza el Drive: se sube lo suyo y se conserva lo que ya había allá.
      const {doc:combinado, cuenta} = combinarDocs(mio, doc);
      adoptarDoc(combinado);
      await nubeEscribir(JSON.stringify(combinado));
      const aporto = cuenta.estudiantes + cuenta.docentes + cuenta.asignaturas + cuenta.notas;
      showToast(aporto > 0
        ? 'Conectado. Se subieron ' + aporto + ' dato(s) de este equipo al Drive.'
        : 'Conectado con los datos del centro escolar.');
    }else{
      await nubeEscribir(JSON.stringify(mio));  // primer equipo: sube lo que tiene
      showToast('Conectado. Se subieron los datos actuales.');
    }
    setSyncStatus('ok');
    iniciarSync();
    render();
  }catch(e){
    console.error(e);
    setSyncUrl('');
    showToast('No se pudo conectar. Revisa que el acceso sea "Cualquier usuario".');
    render();
  }
}
function quitarSyncUrl(){
  if(!confirm('¿Desconectar este equipo? Los datos dejarán de compartirse.')) return;
  setSyncUrl('');
  if(ENLACE_FIJO){ showToast('Este sistema trae el enlace del centro escolar integrado: volverá a conectarse solo.'); }

/* ============================= PERMISOS ============================= */
/* Clave guardada como número derivado, no como texto plano.
   Es una barrera de uso interno, no cifrado de grado bancario. */
function hashClave(txt){
  let h = 5381;
  for(let i=0;i<txt.length;i++){ h = ((h*33) ^ txt.charCodeAt(i)) >>> 0; }
  return 'h' + h.toString(36);
}
function tieneClave(u){ return !!(u && u.clave); }

/* Los estudiantes guardan nombres y apellidos por separado.
   El campo "nombre" se mantiene sincronizado para el resto del sistema. */
function nombreCompleto(nombres, apellidos){
  return ((nombres||'').trim() + ' ' + (apellidos||'').trim()).trim();
}
function separarNombre(completo){
  const partes = (completo||'').trim().split(/\s+/).filter(Boolean);
  if(partes.length <= 1) return {nombres: partes[0]||'', apellidos:''};
  if(partes.length === 2) return {nombres: partes[0], apellidos: partes[1]};
  if(partes.length === 3) return {nombres: partes.slice(0,2).join(' '), apellidos: partes[2]};
  return {nombres: partes.slice(0, partes.length-2).join(' '), apellidos: partes.slice(-2).join(' ')};
}
/* Rellena nombres/apellidos en registros creados antes de esta versión */
function normalizarEstudiante(e){
  if(e.nombres === undefined || e.apellidos === undefined){
    const p = separarNombre(e.nombre);
    e.nombres = p.nombres;
    e.apellidos = p.apellidos;
  }
  e.nombre = nombreCompleto(e.nombres, e.apellidos) || e.nombre;
  return e;
}
function apellidosDe(e){ return (e.apellidos||'').trim() || (e.nombre||''); }
function nombresDe(e){ return (e.nombres||'').trim() || (e.nombre||''); }
/* Ordena por nombres o por apellidos, según lo elegido en pantalla */
function ordenarEstudiantes(lista, criterio){
  const col = new Intl.Collator('es', {sensitivity:'base'});
  return lista.slice().sort((a,b)=>{
    if(criterio === 'apellidos'){
      return col.compare(apellidosDe(a), apellidosDe(b)) || col.compare(nombresDe(a), nombresDe(b));
    }
    return col.compare(nombresDe(a), nombresDe(b)) || col.compare(apellidosDe(a), apellidosDe(b));
  });
}

/* Un docente puede tener más de un grado de orientación */
function orientacionesDe(u){
  if(!u) return [];
  if(Array.isArray(u.orientaciones)) return u.orientaciones.filter(Boolean);
  return u.orientacion ? [u.orientacion] : [];
}
function esOrientador(u, grado){ return orientacionesDe(u).indexOf(grado) >= 0; }

/* Para el saludo: omite el tratamiento (Lic., Profa., Miss…) y usa el nombre */
const TRATAMIENTOS = ['lic','lic.','licda','licda.','prof','prof.','profa','profa.','sra','sra.','sr','sr.',
  'srta','srta.','ing','ing.','miss','mtro','mtro.','mtra','mtra.','dr','dr.','dra','dra.'];
function nombrePila(completo){
  const partes = String(completo||'').trim().split(/\s+/).filter(Boolean);
  if(partes.length > 1 && TRATAMIENTOS.indexOf(partes[0].toLowerCase()) >= 0) return partes[1];
  return partes[0] || '';
}
/* Saludo: las dos primeras palabras del nombre tal como está registrado */
function saludoNombre(completo){
  const partes = String(completo||'').trim().split(/\s+/).filter(Boolean);
  return partes.slice(0, 2).join(' ');
}

/* Paneles cuyo acceso se configura por usuario.
   El nivel elegido NUNCA amplía las reglas del sistema: solo las restringe.
   Un docente con "editar" en Calificaciones sigue editando únicamente
   sus asignaturas o su grado de orientación. */
const PANELES = [
  {id:'estudiantes',    label:'Estudiantes'},
  {id:'calificaciones', label:'Calificaciones'},
  {id:'matriz',         label:'Notas por aula'},
  {id:'tareas',         label:'Registro y alertas de tareas'},
  {id:'boletas',        label:'Boletas de notas'},
  {id:'hojas',          label:'Hojas de tareas'},
  {id:'reportes',       label:'Reportes disciplinarios',
   niveles:[{v:'no',t:'Sin acceso'},{v:'editar',t:'Editar y ver con límite'},{v:'editartodo',t:'Editar y ver todos'}]}
];
/* Compatibilidad: usuarios configurados con los niveles antiguos de solo-consulta
   ('ver'/'vertodo') pasan a poder editar, conservando el mismo alcance de antes. */
function nivelPanel(u, panelId){
  u = u || currentUser;
  if(!u) return 'no';
  if(isAdmin(u)) return 'editar';
  if(u.paneles && u.paneles[panelId]){
    const v = u.paneles[panelId];
    if(panelId === 'reportes'){
      if(v === 'ver') return 'editar';
      if(v === 'vertodo') return 'editartodo';
    }
    return v;
  }
  if(u.soloLectura) return 'ver';
  return 'editar';                 // docentes de antes: todo habilitado como siempre
}
function puedeVerPanel(u, panelId){ return nivelPanel(u, panelId) !== 'no'; }
function puedeEditarPanel(u, panelId){
  const n = nivelPanel(u, panelId);
  return n === 'editar' || n === 'editartodo';
}
/* Quién puede ver todos los reportes del centro escolar */
function veTodosReportes(u){
  u = u || currentUser;
  if(!u) return false;
  if(isAdmin(u)) return true;
  return nivelPanel(u, 'reportes') === 'editartodo';
}
/* Reportes que este usuario puede ver: los suyos, los de su grado de
   orientación, o todos si tiene ese permiso. */
function reportesVisibles(u){
  u = u || currentUser;
  const todos = (DB.reportes || []);
  if(veTodosReportes(u)) return todos;
  return todos.filter(r => r.docenteId === u.id || esOrientador(u, r.grado));
}
/* Cuenta de reportes que ESTE usuario todavía no ha abierto */
function contarReportesNoVistos(u){
  u = u || currentUser;
  return reportesVisibles(u).filter(r => !(r.vistas||[]).some(v=>v.userId===u.id)).length;
}
/* Usuarios como Recepción ven todas las aulas, pero sin editar nada */
function tieneAlcanceTotal(u){ return !!(u && (isAdmin(u) || u.alcanceTotal)); }
/* Grados de los que este usuario puede emitir boletas */
function gradosBoleta(u){
  u = u || currentUser;
  if(!u) return [];
  if(tieneAlcanceTotal(u)) return DB.config.grados.slice();
  return DB.config.grados.filter(g=>esOrientador(u, g));   // solo su grado de orientación
}

function isAdmin(u){ return u && (u.tipo === 'admin' || u.tipo === 'propietaria' || u.tipo === 'propietario'); }
/* Cuenta de la propietaria de la plataforma: acceso total, pero nadie del
   colegio (ni Dirección) puede verla, editarla ni eliminarla — solo ella
   misma, ya con sesión iniciada, puede cambiar su propia contraseña. */
function esPropietario(u){ return !!(u && (u.tipo === 'propietaria' || u.tipo === 'propietario')); }
function isDireccion(u){ return u && (u.dominio === 'direccion' || esPropietario(u)); }
function canAccessGrado(u, grado){
  if(!u) return false;
  if(isAdmin(u)) return true;
  if(esOrientador(u, grado)) return true;
  return u.asignaciones.some(a=>a.grado===grado);
}
function canEditGrades(u, grado, asignaturaId){
  if(!u) return false;
  if(!puedeEditarPanel(u, 'calificaciones')) return false;   // panel en modo consulta
  if(isAdmin(u)) return true;
  if(u.soloLectura) return false;
  if(esOrientador(u, grado)) return true;
  return u.asignaciones.some(a=>a.grado===grado && a.asignaturaId===asignaturaId);
}
function canManageAcademicData(u){ return isAdmin(u); }
/* Quién puede entrar a Personalizar → Mensajes: acceso total completo
   (isAdmin), o un docente con "alcanceTotal" (ve todas las aulas), aunque
   no tenga el resto de permisos de Dirección. */
function puedePersonalizarMensajes(u){
  u = u || currentUser;
  return isAdmin(u) || !!(u && u.alcanceTotal);
}
function canEditTeacherAccount(u, target){
  if(target && (target.tipo === 'propietaria' || target.tipo === 'propietario')) return !!(u && u.id === target.id);
  if(isAdmin(u)) return true;
  if(isAdmin(u) && target.tipo === 'docente') return true;
  return false;
}
function misGrados(u){
  if(tieneAlcanceTotal(u)) return DB.config.grados.slice();
  const set = new Set(u.asignaciones.map(a=>a.grado));
  orientacionesDe(u).forEach(g=>set.add(g));
  return DB.config.grados.filter(g=>set.has(g));
}
/* Materias que este usuario puede ver en un grado:
   administración y orientador(a) ven todas; el resto, solo las que imparte. */
function asignaturasVisibles(grado, u){
  u = u || currentUser;
  const todas = asignaturasDeGrado(grado);
  if(!u) return [];
  if(tieneAlcanceTotal(u) || esOrientador(u, grado)) return todas;
  return todas.filter(a=>(u.asignaciones||[]).some(x=>x.grado===grado && x.asignaturaId===a.id));
}
function verGradoCompleto(grado, u){
  u = u || currentUser;
  return !!u && (tieneAlcanceTotal(u) || esOrientador(u, grado));
}
function asignaturasDeGrado(grado){
  const ids = new Set((DB.curriculo && DB.curriculo[grado]) || []);
  DB.docentes.forEach(d=>d.asignaciones.forEach(a=>{ if(a.grado===grado) ids.add(a.asignaturaId); }));
  return DB.asignaturas.filter(s=>ids.has(s.id));
}
function docenteDeAsignatura(grado, asignaturaId){
  return DB.docentes.find(d=>d.asignaciones.some(a=>a.grado===grado && a.asignaturaId===asignaturaId));
}

/* ============================= HOJA DE TAREAS ============================= */
/* La hoja de tareas es la fuente de los nombres y fechas: lo que el docente
   escribe aquí aparece solo en Calificaciones, que ya no se edita a mano. */
const HOJA_DEF = {
  encabezados: {fecha:'FECHA', contenidos:'CONTENIDOS', tareas:'TAREAS', rubrica:'Rúbrica',
                nota:'Nota', firma:'Firma', observaciones:'Observaciones'},
  rubrica: [{nombre:'Puntualidad', peso:30},
            {nombre:'Legibilidad de los ejercicios (orden y letra)', peso:10},
            {nombre:'Contenido', peso:60}],
  firmas: ['F. Responsable','F. Maestro'],
  textoExamenes: 'SEMANA DE EXÁMENES',
  etiquetas: ['INTEGRADORA I','INTEGRADORA II','INTEGRADORA III','INTEGRADORA IV']
};
const PERIODO_PALABRA = {1:'PRIMER', 2:'SEGUNDO', 3:'TERCER', 4:'CUARTO'};

function hojaCfg(){
  const c = (DB.config && DB.config.hojaCfg) || {};
  return {
    encabezados: Object.assign({}, HOJA_DEF.encabezados, c.encabezados || {}),
    rubrica: Array.isArray(c.rubrica) ? c.rubrica : HOJA_DEF.rubrica.map(r=>Object.assign({},r)),
    firmas: Array.isArray(c.firmas) ? c.firmas : HOJA_DEF.firmas.slice(),
    textoExamenes: c.textoExamenes !== undefined ? c.textoExamenes : HOJA_DEF.textoExamenes,
    etiquetas: Array.isArray(c.etiquetas) ? c.etiquetas : HOJA_DEF.etiquetas.slice()
  };
}
function guardarHojaCfg(mutador){
  const actual = hojaCfg();
  mutador(actual);
  commit(doc=>{ doc.config = doc.config || {}; doc.config.hojaCfg = actual; });
}
function hojaKey(grado, asigId, periodo){ return grado+'|'+asigId+'|'+periodo; }

/* Hoja inicial: respeta las casillas de actividades que ya existieran */
function hojaPorDefecto(grado, asigId){
  const cfg = hojaCfg();
  const previas = (DB.actividades && DB.actividades[grado+'|'+asigId]) || null;
  const nombres = previas ? previas.map(a=>a.nombre) : ['','','',''];
  const mitad = Math.ceil(nombres.length/2);
  const filas = [];
  const nuevaTarea = (nombre)=>({tipo:'tarea', fecha:'', contenido:'', tarea:nombre||'',
    etiqueta:'', rubrica: cfg.rubrica.map(r=>Object.assign({},r)), nota:'', obs:''});
  const nuevaInteg = (i)=>({tipo:'integradora', fecha:'', contenido:'', tarea:'',
    etiqueta: cfg.etiquetas[i] || ('INTEGRADORA '+(i+1)), rubrica:[], nota:'', obs:''});
  nombres.slice(0, mitad).forEach(n=>filas.push(nuevaTarea(n)));
  filas.push(nuevaInteg(0));
  nombres.slice(mitad).forEach(n=>filas.push(nuevaTarea(n)));
  filas.push(nuevaInteg(1));
  return {filas: filas, examen: {fecha:'', texto: cfg.textoExamenes}};
}
function getHoja(grado, asigId, periodo){
  if(!DB.hojas) DB.hojas = {};
  const k = hojaKey(grado, asigId, periodo);
  if(!DB.hojas[k]) DB.hojas[k] = hojaPorDefecto(grado, asigId);
  return DB.hojas[k];
}
function mutarHoja(grado, asigId, periodo, fn){
  const k = hojaKey(grado, asigId, periodo);
  const base = JSON.parse(JSON.stringify(getHoja(grado, asigId, periodo)));
  commit(doc=>{
    doc.hojas = doc.hojas || {};
    if(!doc.hojas[k]) doc.hojas[k] = base;
    fn(doc.hojas[k]);
  });
}
/* Filas de tarea y de integradora, en el orden en que aparecen en la hoja */
function filasTarea(grado, asigId, periodo){
  return getHoja(grado, asigId, periodo).filas.filter(f=>f.tipo==='tarea');
}
function filasIntegradora(grado, asigId, periodo){
  return getHoja(grado, asigId, periodo).filas.filter(f=>f.tipo==='integradora');
}
/* Nombre que verá Calificaciones para una integradora: etiqueta y, si lo hay, su detalle */
const ROMANOS = ['I','II','III','IV','V','VI'];
function etiquetaCorta(key){
  if(String(key).indexOf('act') === 0) return 'T ' + (Number(String(key).replace('act','')) || 1);
  const i = ['integradora1','integradora2','integradora3','integradora4'].indexOf(key);
  if(i >= 0) return 'Int ' + (ROMANOS[i] || (i+1));
  return null;
}
function nombreIntegradoraHoja(fila){
  const et = (fila.etiqueta||'').trim();
  const tx = (fila.tarea||'').trim();
  if(et && tx) return et + ' - ' + tx;
  return et || tx || '';
}

/* ============================= ACTIVIDADES (casillas 20%) ============================= */
function actividadesKey(grado, asigId){ return grado+'|'+asigId; }
/* SOLO LECTURA: nunca escribe. Las casillas por defecto usan ids fijos, así todos
   los dispositivos coinciden aunque todavía no se hayan guardado. */
function getActividades(grado, asigId, periodo){
  if(periodo){
    // La hoja de tareas manda: sus filas de tarea son las casillas de actividades
    const filas = filasTarea(grado, asigId, periodo);
    if(filas.length) return filas.map((f,i)=>({id:'act'+(i+1), nombre: f.tarea || ('Actividad '+(i+1))}));
  }
  if(!DB.actividades) DB.actividades = {};
  const key = actividadesKey(grado, asigId);
  if(!DB.actividades[key]){
    DB.actividades[key] = [1,2,3,4,5,6].map(n=>({id:'act'+n, nombre:'Actividad '+n}));
  }
  return DB.actividades[key];
}
function mutarActividades(grado, asigId, fn){
  const key = actividadesKey(grado, asigId);
  const base = getActividades(grado, asigId);
  return commit(doc=>{
    if(!doc.actividades) doc.actividades = {};
    if(!doc.actividades[key]) doc.actividades[key] = base.map(a=>({id:a.id, nombre:a.nombre}));
    fn(doc.actividades[key]);
  });
}
async function addActividad(grado, asigId){
  await mutarActividades(grado, asigId, lista=>{
    let n = lista.length+1;
    while(lista.some(a=>a.id==='act'+n)) n++;
    lista.push({id:'act'+n, nombre:'Actividad '+n});
  });
  render();
}
async function renameActividad(grado, asigId, actId, nombre){
  const limpio = nombre.trim();
  if(!limpio) return;
  await mutarActividades(grado, asigId, lista=>{
    const a = lista.find(x=>x.id===actId);
    if(a) a.nombre = limpio;
  });
  render();
}
async function removeActividad(grado, asigId, actId){
  if(!confirm('¿Eliminar esta casilla de actividad? Se perderán las notas registradas en ella.')) return;
  await mutarActividades(grado, asigId, lista=>{
    const i = lista.findIndex(a=>a.id===actId);
    if(i>=0) lista.splice(i,1);
  });
  const compKey = 'act:'+actId;
  commit(doc=>{
    Object.keys(doc.calificaciones).forEach(k=>{
      const p = k.split('|');
      if(p[1]===asigId && p[3]===compKey) delete doc.calificaciones[k];
    });
  });
  render();
}

/* ============================= TAREAS Y ESTADOS ============================= */
const ESTADOS = {
  entregada: {nombre:'Entregada', pill:'pill-primary'},
  tardia:    {nombre:'Entrega tardía', pill:'pill-gold'},
  no:        {nombre:'No entregada', pill:'pill-rojo'}
};
function getNombreRubro(grado, asigId, key, periodo){
  if(periodo){
    const idx = ['integradora1','integradora2','integradora3','integradora4'].indexOf(key);
    if(idx >= 0){
      const filas = filasIntegradora(grado, asigId, periodo);
      const nom = filas[idx] ? nombreIntegradoraHoja(filas[idx]) : '';
      if(nom) return nom;
    }
  }
  const r = (DB.rubros||{})[grado+'|'+asigId+'|'+key];
  if(r) return r;
  const fijo = rubrosActivos().find(x=>x.key===key);
  return fijo ? fijo.nombre : key;
}
function renameRubro(grado, asigId, key, nombre){
  const limpio = (nombre||'').trim();
  if(!limpio) return;
  commit(doc=>{
    if(!doc.rubros) doc.rubros = {};
    doc.rubros[grado+'|'+asigId+'|'+key] = limpio;
  });
  render();
}
function claveTarea(grado, asigId, actId, periodo){ return grado+'|'+asigId+'|'+actId+'|'+periodo; }
function getFechaTarea(grado, asigId, actId, periodo){
  if(periodo){
    if(String(actId).indexOf('act') === 0){
      const i = Number(String(actId).replace('act','')) - 1;
      const filas = filasTarea(grado, asigId, periodo);
      if(filas[i] && filas[i].fecha) return filas[i].fecha;
    }else{
      const idx = ['integradora1','integradora2','integradora3','integradora4'].indexOf(actId);
      if(idx >= 0){
        const filas = filasIntegradora(grado, asigId, periodo);
        if(filas[idx] && filas[idx].fecha) return filas[idx].fecha;
      }
    }
  }
  const t = DB.tareas[claveTarea(grado, asigId, actId, periodo)];
  return t ? t.fecha : '';
}
function setFechaTarea(grado, asigId, actId, periodo, fecha){
  const k = claveTarea(grado, asigId, actId, periodo);
  commit(doc=>{
    if(!doc.tareas) doc.tareas = {};
    if(fecha) doc.tareas[k] = {fecha:fecha}; else delete doc.tareas[k];
  });
}
function getEstado(estId, asigId, periodo, actId){

}
function setEstado(estId, asigId, periodo, actId, valor){

  commit(doc=>{
    if(!doc.estados) doc.estados = {};
    if(valor) doc.estados[k] = valor; else delete doc.estados[k];

}
function getObs(estId, asigId, periodo, comp){

}
function setObs(estId, asigId, periodo, comp, texto){

/* Construye el registro de tareas a partir de lo cargado en Calificaciones */
/* ============================= NOTIFICACIONES (numerito en los paneles y en el ícono) =============================
   Solo estos 5 paneles pueden notificar — a propósito no hay opción para
   ningún otro. Cada docente decide, en su propio dispositivo, cuáles
   quiere ver marcados. */
const PANELES_NOTIFICABLES = [
  {id:'averias',  label:'Averías y solicitudes'},
  {id:'mensajes', label:'Mensajes'},
  {id:'soporte',  label:'Soporte de la plataforma'},
  {id:'reportes', label:'Reportes disciplinarios'},
  {id:'tareas',   label:'Registro y alertas de tareas'},
];
function notifActiva(id){ return getPref('notif_'+id, true); }
function contarTareasPendientesDocente(){
  return listaTareas({estado:'no'}).length;
}
function contadorPanelDocente(id){
  if(!notifActiva(id)) return 0;
  if(id==='averias')  return contarAveriasPendientes(currentUser);
  if(id==='mensajes') return contarMensajesNoLeidos(currentUser.id);
  if(id==='soporte')  return contarSoportePendientes(currentUser);
  if(id==='reportes') return contarReportesNoVistos(currentUser);
  if(id==='tareas')   return contarTareasPendientesDocente();
  return 0;
}
/* Suma de todo lo que este docente eligió notificar — es lo que se manda
   al numerito del ícono de la app. */
function totalNotificacionesDocente(){
  return PANELES_NOTIFICABLES.reduce((s,p)=>s + contadorPanelDocente(p.id), 0);
}
/* El numerito en el ícono de la app (fuera del navegador), al estilo
   WhatsApp. OJO: esto solo se actualiza mientras la app está abierta (o
   se vuelve a abrir) — no es una notificación push que llegue con la app
   cerrada del todo; eso necesitaría un servidor de notificaciones aparte. */
function actualizarBadgeApp(){
  try{
    if(!('setAppBadge' in navigator)) return;
    if(!currentUser || sesionEstudiante){ navigator.clearAppBadge().catch(()=>{}); return; }
    const total = totalNotificacionesDocente();
    if(total>0) navigator.setAppBadge(total).catch(()=>{});
    else navigator.clearAppBadge().catch(()=>{});
  }catch(e){ /* navegador sin soporte: no pasa nada */ }
}
function renderNotificacionesModal(){

  const cerrar = 'viewState.modalNotificaciones=false; render();';

  <div class="modal-bg" onclick="if(event.target===this){ ${cerrar} }">
