<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escuela Cristiana Cristo a las Naciones</title>
<style>
  :root{
    --ink:#1c2b2a; --muted:#5b6b69; --panel:#ffffff; --bg:#f1efe9;
    --gold:#B98A2E; --line:#e4ddd0; --radius:16px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); font-family:'Georgia','Times New Roman',serif; color:var(--ink);
    padding:24px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 20px 60px rgba(0,0,0,.12); max-width:480px; width:100%;
    padding:40px 32px; text-align:center;
  }
  .eyebrow{
    font-family:'Inter',Arial,sans-serif; font-size:12px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); font-weight:700; margin:0 0 10px;
  }
  h1{ font-size:24px; margin:0 0 18px; line-height:1.3; }
  p{ font-family:'Inter',Arial,sans-serif; font-size:15px; line-height:1.6; color:var(--muted); margin:0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Este sistema ya no está disponible</h1>
    <p>Por favor ingresa a la página oficial del colegio para cualquier información o trámite.</p>
  </div>
</body>
</html>
